# #1073 — the doorbell Worker (one Worker for both rings).
#
# GitHub-OIDC-gated Workers Builds doorbell: on a valid CI identity it starts an
# allowlisted Cloudflare Builds run (the repo's own workers, never itself) and
# reports that run's status. It does NOT run Wrangler or Pulumi, and it never
# accepts a caller-supplied trigger id or account id. The trigger map for each
# ring lives in vars; the Builds API token arrives as a Cloudflare Secrets
# Store binding (shared store with the other workers).
#
# Staging and production are environments of the SAME worker: the OIDC claims
# (environment/ref/sub) select the ring, and SAFE-1 (release-manifest pin)
# gates production commits. isBannedComponent forbids starting this worker
# itself (edge isolation contract scans this file).

name = "doorbell"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# CI-reachable helper endpoint (OIDC-protected): workers.dev host is a public
# config, not a credential (same as the migration executor).
workers_dev = true
preview_urls = false

[observability]
enabled = true

[vars]
ENVIRONMENT = "development"
CLOUDFLARE_ACCOUNT_ID = "021233c1880a43aa68565496100e1f8c"
STAGING_TRIGGER_MAP = "{}"
PRODUCTION_TRIGGER_MAP = "{}"

[env.staging]
name = "doorbell-staging"
workers_dev = true
preview_urls = false

[env.staging.vars]
ENVIRONMENT = "staging"
CLOUDFLARE_ACCOUNT_ID = "021233c1880a43aa68565496100e1f8c"
STAGING_TRIGGER_MAP = "{\"web\":\"4fb45713-28f6-4c2d-a58f-b289dd120339\"}"
PRODUCTION_TRIGGER_MAP = "{}"

[[env.staging.secrets_store_secrets]]
binding = "BUILDS_API_TOKEN"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "BUILDS_API_TOKEN_STAGING"

[env.production]
name = "doorbell"
workers_dev = true
preview_urls = false

[env.production.vars]
ENVIRONMENT = "production"
CLOUDFLARE_ACCOUNT_ID = "021233c1880a43aa68565496100e1f8c"
STAGING_TRIGGER_MAP = "{}"
PRODUCTION_TRIGGER_MAP = "{}"

[[env.production.secrets_store_secrets]]
binding = "BUILDS_API_TOKEN"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "BUILDS_API_TOKEN_PROD"
