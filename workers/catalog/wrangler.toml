name = "catalog"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]
# No public host of any kind — catalog is reached only through the root
# Worker's CATALOG service binding. Two separate doors have to be shut:
#
#   workers_dev  — the <name>.<subdomain>.workers.dev host. wrangler resolves
#                  `defaultWorkersDev = routes.length === 0`, and catalog
#                  declares no routes, so omitting this publishes the Worker.
#   preview_urls — the per-version <prefix>-<name>.<subdomain>.workers.dev
#                  host. When the key is absent wrangler sends no
#                  `previews_enabled` at all, so the server keeps Cloudflare's
#                  enabled-by-default state — a public URL per version, with
#                  real bindings. wrangler's "unintentionally public" warning
#                  does not save us: it early-returns under isNonInteractiveOrCI.
#
# Both are `inheritable` keys (wrangler 4.112 cli.js:35080 / :35088), so the
# top-level value alone covers every environment. The per-environment repeats
# below are a deliberate policy choice enforced by
# test/wrangler-private.worker.test.ts — a reader should not have to know the
# inheritance rules to see that an environment is private — NOT a wrangler
# requirement. Every environment is private; there is no exception.
workers_dev = false
preview_urls = false

# Hyperdrive binds the Worker to a pooled Postgres connection in production.
# src/index.ts reads env.HYPERDRIVE.connectionString first, falling back to
# env.DATABASE_URL when the binding is absent (local dev / tests).
#
# Provision once, then fill `id` below (it is a config id, not a secret):
#   wrangler hyperdrive create catalog-pg \
#     --connection-string="postgres://USER:PASS@HOST:5432/DB"
#   # → prints: ✅ Created ... id: <hyperdrive-id>
#
# Uncomment after `id` is known. While commented out, prod falls back to the
# DATABASE_URL secret (set via `wrangler secret put DATABASE_URL`).
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"

# R2 bucket for lazy-cached pilgrimage point photos. The catalog Worker serves
# GET /catalog/img/:pointId: first hit pulls the origin from image.anitabi.cn,
# stores the bytes here once, and records the asset in media_assets; later hits
# stream straight from R2 (see src/media/img.ts).
#
# R2 bucket provisioned by Pulumi (infra/index.ts) as `catalog-media`.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "catalog-media"

# R2 bucket for immutable public catalog snapshots (issue #1012, see src/publish/).
# Every successful daily run publishes an N/N-1 snapshot set here; the online
# gcSnapshots pass (keep N and N-1) IS the retention enforcement, so no R2
# lifecycle rule is required. Provisioned by Pulumi as `catalog-snapshots`.
[[r2_buckets]]
binding = "SNAPSHOT_BUCKET"
bucket_name = "catalog-snapshots"

[observability]
enabled = true

# Per-environment schedules (issue #1016, spec §183): the upstream ingest
# crons — SEED_CRON (0 4 * * *), DAILY_DISCOVER_CRON (0 6 * * *), TTL_REFRESH_CRON
# (17 * * * *) — belong to PRODUCTION ALONE; staging declares only the daily
# snapshot import cron DAILY_IMPORT_CRON (0 3 * * *). The development
# (top-level) environment declares none. Keep the strings in sync with
# src/cron-config.ts; the runtime handler additionally guards on ENVIRONMENT so
# a wrongly-routed event fails closed. The :17 minute keeps catalog off the top
# of the hour.
[triggers]
crons = []

# NOTE: keep this block to ENVIRONMENT only. The vitest-pool-workers test env
# reads [vars]; test/worker.worker.test.ts asserts that /catalog/* returns 503
# ("catalog database not configured") precisely because neither HYPERDRIVE nor
# DATABASE_URL is set here. Do NOT add DATABASE_URL to [vars].
[vars]
ENVIRONMENT = "development"

# Local `wrangler dev` Neon connection.
# DATABASE_URL is NOT placed in [vars] (it would break the no-DB 503 test and is
# environment-specific). Instead create catalog/.dev.vars (git-ignored) with:
#   DATABASE_URL=<standing-dev-branch-cloud-dsn>
# See .dev.vars.example for the create-once and connection-string recipe.
# wrangler dev loads .dev.vars automatically. For a deployed environment set:
#   wrangler secret put DATABASE_URL

[env.staging]
name = "catalog-staging"
workers_dev = false
preview_urls = false

# #912 PR2: the staging DSN comes from the Cloudflare Secrets Store (secret
# CATALOG_DATABASE_URL, provisioned by the infra/neon-secrets Pulumi stack)
# instead of `wrangler secret put` in CI. env.DATABASE_URL is then a
# SecretsStoreSecret — src/index.ts awaits `.get()` (string fallback kept for
# tests/local dev). Wrangler validates the binding's store_id/secret_name at
# deploy time; no CI secret pass-through remains.
[[env.staging.secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "CATALOG_DATABASE_URL"

[env.staging.vars]
ENVIRONMENT = "staging"

[env.staging.triggers]
crons = ["0 3 * * *"]

# #1016 AC2 / #1148: restore this binding when production Worker `catalog`
# exists. Wrangler rejects deploy with 10143 if the target script is missing;
# production catalog has never been deployed (apply frozen). Until then
# snapshotSourceFor falls back to SNAPSHOT_BUCKET. `entrypoint` is required
# on restore — without it the binding hits the default fetch export.
# [[env.staging.services]]
# binding = "PROD_SNAPSHOT"
# service = "catalog"
# entrypoint = "SnapshotReadEntrypoint"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "catalog-media-staging"

[[env.staging.r2_buckets]]
binding = "SNAPSHOT_BUCKET"
bucket_name = "catalog-snapshots-staging"

[env.production]
name = "catalog"
workers_dev = false
preview_urls = false

# #1048 production runtime DSN cutover: production reads its DSN from the
# Cloudflare Secrets Store like staging already does. The store secrets are
# provisioned by the infra/neon-secrets Pulumi stack with the prod stack's
# "_PROD" suffix (CATALOG_DATABASE_URL_PROD) because staging and production
# share the account's single default Secrets Store. env.DATABASE_URL is then
# a SecretsStoreSecret - src/index.ts awaits `.get()` (string fallback kept
# for tests/local dev). CI no longer uploads DATABASE_URL as a worker secret
# for production; the wrangler binding supersedes the old owner-DSN upload.
[[env.production.secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "CATALOG_DATABASE_URL_PROD"

[env.production.vars]
ENVIRONMENT = "production"

[env.production.triggers]
crons = ["0 4 * * *", "0 6 * * *", "17 * * * *"]

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "catalog-media"

[[env.production.r2_buckets]]
binding = "SNAPSHOT_BUCKET"
bucket_name = "catalog-snapshots"
