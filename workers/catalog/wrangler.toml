name = "catalog"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]
# No public host of any kind — catalog is reached only through the root
# Worker's CATALOG service binding. Two separate doors have to be shut:
#
#   workers_dev  — the <name>.<subdomain>.workers.dev host. wrangler resolves
#                  `defaultWorkersDev = routes.length === 0`, and catalog
#                  declares no routes, so omitting this publishes the Worker.
#   preview_urls — the per-version <prefix>-<name>.<subdomain>.workers.dev
#                  host. When the key is absent wrangler sends no
#                  `previews_enabled` at all, so the server keeps Cloudflare's
#                  enabled-by-default state — a public URL per version, with
#                  real bindings. wrangler's "unintentionally public" warning
#                  does not save us: it early-returns under isNonInteractiveOrCI.
#
# Both are `inheritable` keys (wrangler 4.112 cli.js:35080 / :35088), so the
# top-level value alone covers every environment. The per-environment repeats
# below are a deliberate policy choice enforced by
# test/wrangler-private.worker.test.ts — a reader should not have to know the
# inheritance rules to see that an environment is private — NOT a wrangler
# requirement. `[env.preview]` overrides preview_urls back to true on purpose.
workers_dev = false
preview_urls = false

# Hyperdrive binds the Worker to a pooled Postgres connection in production.
# src/index.ts reads env.HYPERDRIVE.connectionString first, falling back to
# env.DATABASE_URL when the binding is absent (local dev / tests).
#
# Provision once, then fill `id` below (it is a config id, not a secret):
#   wrangler hyperdrive create catalog-pg \
#     --connection-string="postgres://USER:PASS@HOST:5432/DB"
#   # → prints: ✅ Created ... id: <hyperdrive-id>
#
# Uncomment after `id` is known. While commented out, prod falls back to the
# DATABASE_URL secret (set via `wrangler secret put DATABASE_URL`).
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"

# R2 bucket for lazy-cached pilgrimage point photos. The catalog Worker serves
# GET /catalog/img/:pointId: first hit pulls the origin from image.anitabi.cn,
# stores the bytes here once, and records the asset in media_assets; later hits
# stream straight from R2 (see src/media/img.ts).
#
# R2 bucket provisioned by Pulumi (infra/index.ts) as `catalog-media`.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "catalog-media"

[observability]
enabled = true

# NOTE: keep this block to ENVIRONMENT only. The vitest-pool-workers test env
# reads [vars]; test/worker.worker.test.ts asserts that /catalog/* returns 503
# ("catalog database not configured") precisely because neither HYPERDRIVE nor
# DATABASE_URL is set here. Do NOT add DATABASE_URL to [vars].
[vars]
ENVIRONMENT = "development"

# Local `wrangler dev` Neon connection.
# DATABASE_URL is NOT placed in [vars] (it would break the no-DB 503 test and is
# environment-specific). Instead create catalog/.dev.vars (git-ignored) with:
#   DATABASE_URL=<standing-dev-branch-cloud-dsn>
# See .dev.vars.example for the create-once and connection-string recipe.
# wrangler dev loads .dev.vars automatically. For a deployed environment set:
#   wrangler secret put DATABASE_URL

[env.staging]
name = "catalog-staging"
workers_dev = false
preview_urls = false

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "catalog-media-staging"

[env.production]
name = "catalog"
workers_dev = false
preview_urls = false

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "catalog-media"

# Per-PR preview environment (issue #305). Routeless: CI deploys only the
# one-time bootstrap that creates the Worker; previews are undeployed versions
# reached through preview URLs. DATABASE_URL is injected per version from the
# Neon branch preview/pr-<N> by .github/workflows/preview.yml.
[env.preview]
name = "catalog-preview"
workers_dev = false
preview_urls = true

[env.preview.vars]
ENVIRONMENT = "preview"

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "catalog-media-staging" # reuse staging cache; previews are ephemeral
