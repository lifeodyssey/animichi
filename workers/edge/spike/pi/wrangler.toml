# animichi-spike-pi — W0-S1 probe Worker (issue #1244), NOT a production
# surface. It exists to answer three questions on a *deployed* Worker, which
# `wrangler dev` cannot answer (spec §四):
#   1. does a pi-agent-core turn complete against the real gateway for each of
#      mimo / anthropic / gemini?
#   2. does an abort at each of the three break points leave no dangling state?
#   3. what are the cold and warm wake-up times of a bundle this size?
#
# It is deployed BY HAND by the owner and deleted when W0 closes. It is not in
# any CD cohort, has no route, and shares no binding with the edge Worker.
#
# Provider keys are Worker secrets, never vars, and never appear in a response
# body: GET /healthz reports presence as a boolean only.
#   MIMO_API_KEY      — direct MiMo endpoint (preferred mimo route)
#   ZEN_GO_API_KEY    — zen/go gateway (mimo fallback route)
#   ANTHROPIC_API_KEY — Anthropic Messages API
#   GEMINI_API_KEY    — Google Generative AI API
# See README.md for the exact provisioning and deploy commands.

name = "animichi-spike-pi"
main = "src/entry.ts"
# The research report measured the bundle on 2026-08-01 with and without
# `nodejs_compat`; the flag stays on here because, unlike that probe, this
# Worker makes real provider calls through the vendored OpenAI / Anthropic /
# Google SDKs rather than a mocked stream function.
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# A throwaway probe has no zone route: the owner drives it over its
# *.workers.dev hostname, which is also what the measurement script targets.
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "PI_TURN"
class_name = "PiTurnSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PiTurnSession"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
