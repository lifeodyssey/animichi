new_sqlite_classes = ["EdgeGuard"]

[env.staging]
name = "animichi-staging"
routes = []
# No custom domain in staging: the hostname comes from the zone routes Pulumi
# declares (staging.animichi.com/v1/*, /img/*, /tiles/*, /healthz — #541), with
# the staging WAF gate (#529/#559) sitting on the zone ahead of them.
# `workers_dev` was explicitly `true` here until #541 step 6 so the
# post-staging promotion gate's assertions had a stable, intentional contract
# instead of relying on wrangler's implicit default (issue #484). With the
# cutover live it is `false`, like every other environment (#539): a
# `*.workers.dev` hostname is not on the zone and would bypass the WAF
# outright (see infra/index.ts "Why WAF and not Cloudflare Access").
# `preview_urls` is pinned to `false` for the same reason — per-version preview
# URLs are not a surface the gate (or anything else) is meant to expose.
workers_dev = false
preview_urls = false

[[env.staging.r2_buckets]]
binding = "MAP_TILES"
bucket_name = "map-tiles-staging"

[env.staging.vars]
# Forwarded to the container as APP_ENV (issue #498) — required, see
# src/container/container-env.ts CONTAINER_REQUIRED_KEYS. This is the whole point of the fix:
# staging traces must tag "staging" in Logfire, not "production".
APP_ENV = "staging"
CATALOG_API_URL = "http://catalog.internal"
# Showcase-mode gate (S0-v2 GOAL C / C9): staging stays fully functional
# (showcase off). Strict boolean — only the literal "false" means that.
EDGE_SHOWCASE_MODE = "false"
# #527/#528 (P1-A): CORS_ALLOWED_ORIGIN was never provisioned for staging as
# either a repo-level or a staging-environment GH secret. Simply removing it
# from ci.yml's worker_secrets (an earlier revision of this PR did that) would
# NOT preserve staging's current behavior — there is no wildcard fallback.
# `workers/edge/src/container/container-env.ts` hardcodes `APP_ENV: "production"` for every
# environment (confirmed: no APP_ENV var/secret exists anywhere — root,
# staging, or production), and only forwards CORS_ALLOWED_ORIGIN to the
# container when it is non-empty. With it absent, the container boots with
# `app_env=production` and `cors_allowed_origin=""`'s Pydantic-validated
# default `"*"` — and `settings.py`'s `validate_cors_origin` raises
# ValueError on `"*"` when `app_env == "production"` (verified: reproduced
# the exact ValidationError locally with `env -i APP_ENV=production ...`).
# Deleting the entry would have swapped "deploy step fails loudly, before
# anything is live" for "deploy succeeds, container crash-loops" — worse,
# not better. A domain name isn't a secret; putting the real staging web
# origin here (verified reachable: `curl -o /dev/null -w '%{http_code}'
# https://animichi-web-staging.zhenjiazhou0127.workers.dev/` -> 200, and
# matches apps/web/wrangler.jsonc's `env.staging.name` = "animichi-web-staging"
# with no custom route, i.e. the default workers.dev URL) is more honest than
# a GH secret nobody would think to look for, and needs no owner action.
# `buildContainerEnvVars` forwards `vars` and `secrets` identically — this
# is not a behavior change from the container's point of view. NOTE: the
# root `animichi-staging` Worker has never successfully deployed yet
# (`wrangler secret list --env staging` -> "Worker ... not found"), so there
# is no pre-existing manually-set CORS_ALLOWED_ORIGIN secret this could
# conflict with.
CORS_ALLOWED_ORIGIN = "https://animichi-web-staging.zhenjiazhou0127.workers.dev"
ANON_ACCESS_ENABLED = "true"
# AUTH-2 #950 hard cut (committed 2026-08-11): edge verifies Neon Auth (Better
# Auth) JWTs against this branch JWKS ONLY — the dual-issuer flag, the split
# issuer var, and the Supabase verifier are deleted. issuer/audience are
# derived from this URL (workers/edge/src/identity/auth.ts). The value is a
# placeholder until the operator sets the real one (see infra/src/neon-auth.ts,
# which declares the derivation + the neon-secrets secret).
NEON_AUTH_JWKS_URL = "https://REDACTED-NEON-ENDPOINT.neonauth.c-2.ap-southeast-1.aws.neon.tech/neondb/auth/.well-known/jwks.json"
# Per-identity burst limit (abuse control). The per-identity DAILY message
# quota is issue #282 and is configured separately.
ANON_RATE_LIMIT = "20"
ANON_RATE_LIMIT_WINDOW_SECONDS = "60"
# Global anonymous daily spend ceiling (X4). Enforced by the container ingress
# against the daily_usage table; 0 disables the breaker.
ANON_DAILY_COST_BUDGET_USD = "5.0"
# Per-identity daily message quota (issue #282, S1.10) — a fairness/UX
# mechanism, not a security defense line: it keeps one visitor's free usage
# reasonable while the shared budget above stays open for everyone else.
# Enforced by the container ingress against anon_daily_message_count; 0 or
# unset disables it, the same "0 disables" convention as the budget ceiling
# above. Default is an owner-set operations decision (20 here is a starting
# point, not a locked-in value).
ANON_DAILY_MESSAGE_QUOTA = "20"
# Per-identity limit on the two cost-bearing AUTHENTICATED endpoints (issue
# #284 / Task 9): POST /v1/chat and POST /v1/byok/probe ONLY — authenticated
# reads (GET /v1/conversations, /v1/*/messages, /v1/*/routes) are NOT counted
# against this window, so paging through session history never 429s an
# unrelated in-flight chat turn. Left unset this falls back to the
# authenticated class default in @animichi/contract identity-contract (60/60s);
# 60/60s gives normal chat usage headroom above the anonymous burst ceiling.
AUTH_RATE_LIMIT = "60"
AUTH_RATE_LIMIT_WINDOW_SECONDS = "60"

# #912 follow-up: the agent container's Neon role DSN comes from the
# Cloudflare Secrets Store (secret AGENT_SVC_DATABASE_URL, provisioned by the
# infra/neon-secrets Pulumi stack) instead of `wrangler secret put` in CI.
# env.AGENT_SVC_DATABASE_URL is then a SecretsStoreSecret that
# buildContainerEnvVars forwards into the container when set (it is NOT in
# CONTAINER_REQUIRED_KEYS — production has no binding yet, #855 cutover).
# Do NOT add AGENT_SVC_DATABASE_URL to `secrets.required` here: wrangler
# rejects a name assigned to both a Secrets Store Secret binding and a Secret
# binding; the binding's deploy-time store/secret validation is the fail-closed
# gate (a missing store secret fails the deploy API call).
#
# The store secret name AGENT_SVC_DATABASE_URL deliberately differs from the
# production jobs Worker's upload chain name: they are different planes
# (Cloudflare store vs Worker secret) and store secret names are unique per
# store. Production keeps getting its container DSN via the SUPABASE_DB_URL
# worker secret until the #855 prod cutover provisions
# AGENT_SVC_DATABASE_URL for prod.
[[env.staging.secrets_store_secrets]]
binding = "AGENT_SVC_DATABASE_URL"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "AGENT_SVC_DATABASE_URL"

[[env.staging.services]]
binding = "CATALOG"
service = "catalog-staging"

[[env.staging.services]]
binding = "USERS"
service = "users-staging"

[[env.staging.containers]]
class_name = "RuntimeContainer"
image = "../../apps/agent/Dockerfile"
image_build_context = "../../"
max_instances = 3
# lite (0.0625 vCPU / 256 MiB) is below this service's import peak (~273 MiB,
# cold-start audit 2026-08-07) — OOM risk during boot. basic: 1/4 vCPU / 1 GiB.
instance_type = "basic"

[[env.staging.durable_objects.bindings]]
name = "CONTAINER"
class_name = "RuntimeContainer"

# Strongly-consistent state for the edge guards (rate limiter + anonymous
# daily-budget latch). A Durable Object, not KV: both are read-modify-write
# counters that must be correct under concurrency, and KV is eventually
# consistent with a 60s edge cache.
[[env.staging.durable_objects.bindings]]
name = "EDGE_GUARD"
class_name = "EdgeGuard"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RuntimeContainer"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["EdgeGuard"]
