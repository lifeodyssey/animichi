[env.staging]
name = "animichi-staging"
routes = []
# No custom domain in staging: the hostname comes from the zone routes Pulumi
# declares (staging.animichi.com/v1/*, /img/*, /tiles/*, /healthz — #541).
# `workers_dev` history: explicitly `true` until #541 step 6 (issue #484),
# then `false` per #539 because a `*.workers.dev` hostname is not on the zone
# and so bypassed the WAF gate that used to guard staging. Re-opened for
# STAGING ONLY by owner decision 2026-08-27: the zone front door answers
# GitHub-runner IPs with a Bot Fight Mode managed challenge, which the Free
# plan cannot skip per hostname or rule (audit follow-up; subdomain zone-splits
# are Enterprise-only), so the CD smoke check probes workers.dev directly.
# #1369 closed the bypass instead of accepting it: staging's door is now a
# Cloudflare Access application (`infra/src/staging-access.ts`), and Access is
# not a zone feature — the same application covers `staging.animichi.com` AND
# this worker's `*.workers.dev` hostname, so both are behind one login and one
# service token. Production keeps `workers_dev = false` and has no Access
# application: it has a real login.
# `preview_urls` stays `false` — per-version preview URLs remain unexposed.
# Main-only CD promotes the sealed edge bundle;
# local and Cloudflare Workers Builds deployment entrypoints are retired.
workers_dev = true
preview_urls = false

[[env.staging.r2_buckets]]
binding = "MAP_TILES"
bucket_name = "map-tiles-staging"

[[env.staging.r2_buckets]]
binding = "DOCS_ASSETS"
bucket_name = "docs-assets-staging"

[env.staging.vars]
# APP_ENV (issue #498): staging traces must be distinguishable from production's,
# so this block declares its own value — see the default ring's note for why the
# three stay distinct and why the entry is still declared with no reader.
APP_ENV = "staging"
CATALOG_API_URL = "http://catalog.internal"
# The Go transport can outlive the edge request without raising, so fallback
# never gets a chance to run. Use the proven direct endpoint first in staging.
DEFAULT_AGENT_MODEL = "openai:mimo-v2.5@https://api.xiaomimimo.com/v1"
FALLBACK_AGENT_MODEL = "openai:mimo-v2.5@https://opencode.ai/zen/go/v1"
# Showcase-mode gate (S0-v2 GOAL C / C9): staging stays fully functional
# (showcase off). Strict boolean — only the literal "false" means that.
EDGE_SHOWCASE_MODE = "false"
# CORS_ALLOWED_ORIGIN — the Python agent service's CORS allowlist (#527/#528,
# P1-A). It reached a consumer only through the container env allowlist, so
# nothing reads it since #1605; the declaration is kept so the Python-tree
# removal retires it together with that consumer rather than dropping it here.
# A domain name isn't a secret, and the value is the real staging web origin
# (apps/web/wrangler.jsonc's `env.staging.name` = "animichi-web-staging" with no
# custom route, i.e. the default workers.dev URL).
CORS_ALLOWED_ORIGIN = "https://animichi-web-staging.zhenjiazhou0127.workers.dev"
ANON_ACCESS_ENABLED = "true"
# AUTH-2 #950 hard cut (committed 2026-08-11): edge verifies Neon Auth (Better
# Auth) JWTs against this branch JWKS ONLY — the dual-issuer flag, the split
# issuer var, and the Supabase verifier are deleted. issuer/audience are
# derived from this URL (workers/edge/src/identity/auth.ts). The value is a
# staging branch's public URL. It is derived from apps/web's staging Neon Auth
# SDK endpoint and pinned by auth-config.test.ts so the browser and edge cannot
# silently target different branches; infra/src/neon-auth.ts mirrors the same derivation.
NEON_AUTH_JWKS_URL = "https://ep-broad-frost-aopp3uqq.neonauth.c-2.ap-southeast-1.aws.neon.tech/neondb/auth/.well-known/jwks.json"
# Per-identity burst limit (abuse control). The per-identity DAILY message
# quota is issue #282 and is configured separately.
ANON_RATE_LIMIT = "20"
ANON_RATE_LIMIT_WINDOW_SECONDS = "60"
# Shared anonymous spend ceiling. Native admission, drive and tools read daily_usage.
ANON_DAILY_COST_BUDGET_USD = "5.0"
# Anonymous per-identity message reservations; zero disables this message-count ceiling.
ANON_DAILY_MESSAGE_QUOTA = "20"
# Per-identity limit on the two cost-bearing AUTHENTICATED endpoints (issue
# #284 / Task 9): POST /v1/chat and POST /v1/byok/probe ONLY — authenticated
# reads (GET /v1/conversations, /v1/*/messages, /v1/*/routes) are NOT counted
# against this window, so paging through session history never 429s an
# unrelated in-flight chat turn. Left unset this falls back to the
# authenticated class default in @animichi/contract identity-contract (60/60s);
# 60/60s gives normal chat usage headroom above the anonymous burst ceiling.
AUTH_RATE_LIMIT = "60"
AUTH_RATE_LIMIT_WINDOW_SECONDS = "60"

# #912 follow-up: the native agent role DSN comes from the
# Cloudflare Secrets Store (secret AGENT_SVC_DATABASE_URL, provisioned by the
# infra/database-access Pulumi stack) instead of `wrangler secret put` in CI.
# env.AGENT_SVC_DATABASE_URL is a SecretsStoreSecret, and the native agent tier
# resolves it through `readStoreOrString` (`src/env.ts`, #1157). It is not a
# required key: local `wrangler dev` binds no store secret at all, so the tier
# must still start without one (production and staging both bind
# it as of W4-1, #1314).
# Do NOT add AGENT_SVC_DATABASE_URL to `secrets.required` here: wrangler
# rejects a name assigned to both a Secrets Store Secret binding and a Secret
# binding; the binding's deploy-time store/secret validation is the fail-closed
# gate (a missing store secret fails the deploy API call).
#
# The store secret name AGENT_SVC_DATABASE_URL deliberately differs from the
# production jobs Worker's upload chain name: they are different planes
# (Cloudflare store vs Worker secret) and store secret names are unique per
# store. Production's own entry in this one shared store is the "_PROD"-suffixed
# name bound in [env.production] above (W4-1, #1314). Staging also requires
# its existing anonymous identity seed; enabling access must preserve it.
[[env.staging.secrets_store_secrets]]
binding = "MIMO_API_KEY"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "MIMO_API_KEY"

[[env.staging.secrets_store_secrets]]
binding = "ZEN_GO_API_KEY"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "ZEN_GO_API_KEY"

[[env.staging.secrets_store_secrets]]
binding = "GOOGLE_MAPS_API_KEY"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "GOOGLE_MAPS_API_KEY"

[[env.staging.secrets_store_secrets]]
binding = "LOGFIRE_TOKEN"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "LOGFIRE_TOKEN"

[[env.staging.secrets_store_secrets]]
binding = "TURNSTILE_SECRET"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "TURNSTILE_SECRET"

[[env.staging.secrets_store_secrets]]
binding = "ANON_ID_SECRET"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "ANON_ID_SECRET"

[[env.staging.secrets_store_secrets]]
binding = "AGENT_SVC_DATABASE_URL"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "AGENT_SVC_DATABASE_URL"

[[env.staging.services]]
binding = "CATALOG"
service = "catalog-staging"

[[env.staging.services]]
binding = "USERS"
service = "users-staging"

# Strongly-consistent state for the edge guards (rate limiter + anonymous
# daily-budget latch). A Durable Object, not KV: both are read-modify-write
# counters that must be correct under concurrency, and KV is eventually
# consistent with a 60s edge cache.
[[env.staging.durable_objects.bindings]]
name = "EDGE_GUARD"
class_name = "EdgeGuard"

# W1-2 (#1251): the singleton RunSweeper Durable Object — the at-least-once
# backstop for agent turns. The intake commits its transaction and then arms the
# session's own DO; a crash in between leaves a committed `running` run whose
# session instance was never armed, so only an instance OUTSIDE that session can
# notice. One instance for the whole Worker, on a periodic alarm, scans `runs`
# for running rows with an expired or never-taken lease and re-arms each one's
# session (spec docs/specs/2026-09-01-agent-ts-rewrite-spec.md §三).
#
# AGENT_SESSION is the per-session Durable Object the sweeper wakes and the
# intake arms (#1252): one instance per session, running its turn inside its own
# `alarm()` handler. The binding is safe to declare now because `src/entry.ts`
# exports the class wrangler resolves `class_name` against.
[[env.staging.durable_objects.bindings]]
name = "AGENT_SESSION"
class_name = "AgentSession"


[[env.staging.ratelimits]]
name = "RATE_LIMITER"
# Chosen integer, distinct per environment so staging counters stay
# independent of local/production. Do not reuse across unrelated bindings.
namespace_id = "100002"
simple = { limit = 60, period = 60 }

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RuntimeContainer"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["EdgeGuard"]

[[env.staging.migrations]]
tag = "v3"
new_sqlite_classes = ["RunSweeper"]

[[env.staging.migrations]]
tag = "v4"
new_sqlite_classes = ["AgentSession"]

[[env.staging.migrations]]
tag = "v5"
deleted_classes = ["RunSweeper"]

[[env.staging.migrations]]
tag = "v6"
deleted_classes = ["RuntimeContainer"]

# Cloudflare-native rate-limit binding (issue #680) — the COARSE best-effort
# burst damper. Worker-side sibling of the zone-level WAF damper in
# infra/src/hardening.ts; it drives the edge's "native" tier (cacheable public
# reads + the coarse outer wall for durable classes). A GLOBAL (multi-PoP)
# counter, so no per-isolate local limiter can bypass it.
#
# Schema: [[ratelimits]] with name = the binding variable (env.RATE_LIMITER),
# a REQUIRED namespace_id — a CHOSEN POSITIVE INTEGER per CF docs (not a
# dashboard/API-provisioned resource; ratelimit bindings are not visible in
# the dashboard), e.g. "1001" — and a simple fixed window { limit, period }
# where period is 10 or 60. Wrangler requires the binding in every named
# environment, so it is repeated under [env.production] and [env.staging] as
# distinct ids (100001/100002/100003: base/local default, staging, production) so local/staging/production counters stay
# independent. Do NOT reuse a namespace_id for any unrelated binding on the
# same account: two bindings sharing one namespace_id share one global
# counter (intentional cross-Worker sharing). Absent the binding entirely the
# worker fails the native tier open with an alert (never a 500). The exact
# durable/fail-closed tier remains the EDGE_GUARD Durable Object.
[[ratelimits]]
name = "RATE_LIMITER"
# namespace_id is a CHOSEN positive integer (per CF docs, not a dashboard/
# API-provisioned resource). 100001 is the base (local default) namespace — used by `wrangler dev` and un-named deploys; there is no dev environment, only staging and production. Do NOT reuse
# this id for any other binding on this account: two bindings that share a
# namespace_id share one global counter (intentional cross-Worker sharing).
namespace_id = "100001"
simple = { limit = 60, period = 60 }
