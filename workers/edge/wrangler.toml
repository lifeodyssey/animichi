# Cloudflare Workers + Containers — the API gateway for animichi.
# https://developers.cloudflare.com/workers/containers/
#
# Architecture (issue #537 retired the bundled Next.js app; `apps/web` owns
# every HTML surface now, so this Worker is API + asset proxy only):
#   src/entry.ts → /v1/* (container proxy) + /v1/users/* (users Worker)
#                   + /img/* (image proxy) + /tiles/* (private R2 proxy)
#                   + /healthz + one public catalog read
#                   → everything else: JSON 404, no page renderer
#
# ROUTES: none here, deliberately. This Worker's hostnames are declared in
# Pulumi (`infra/index.ts`) as of #541 — `animichi.com/v1/*`, `/img/*`, `/tiles/*` and
# `/healthz`, with the apex itself going to `apps/web` via a Custom Domain.
# The repo rule is "routes belong to Pulumi, worker code belongs to wrangler";
# an earlier version of this file claimed `animichi.com/*` here, which is what
# made a page request land on this Worker's JSON 404.
#
# Until Pulumi's `webRoutesEnabled` is turned on, this Worker has no hostname
# at all: no routes here, and `workers_dev = false` since #539. That is the
# intended pre-cutover state, not a misconfiguration.
#
# Deploy: always run `wrangler deploy -c workers/edge/wrangler.toml` from the
# monorepo root. `main = "src/entry.ts"` and the `[[containers]]` image path are
# resolved relative to this config file, but the container image is built from
# the directory wrangler is invoked in — the build context must stay the repo
# root so the Dockerfile's `COPY apps/agent/...` lines resolve (#853).
#
# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN       — Wrangler deploy auth
#   CLOUDFLARE_ACCOUNT_ID      — Cloudflare account target
#
# Edge runtime secrets (used by src/identity/auth.ts for /v1 auth):
#   NEON_AUTH_JWKS_URL        — branch JWKS (AUTH-2 #950): the edge's ONLY
#                               identity source; set as a secret, not a checked
#                               in var, on production (see infra/src/neon-auth.ts)
#
# Container runtime secrets (forwarded to Python backend). Production model
# policy is MiMo-only (#684): MIMO_API_KEY is the one live model credential.
# The DeepSeek and generic OpenAI-compat fallbacks stay wired but DISABLED
# (settings.fallback_agent_model is empty; re-enabling is a config flip, not a
# secret add) — so their keys remain provisioned, not deleted:
#   SUPABASE_DB_URL            — postgres://... for asyncpg (legacy plane; still
#                                the prod container DSN until the #855 cutover)
#   AGENT_SVC_DATABASE_URL     — Neon agent_svc role DSN (staging, via the
#                                Secrets Store binding below; forwarded into the
#                                container and preferred over SUPABASE_DB_URL by
#                                apps/agent settings, #912 follow-up)
#   MIMO_API_KEY               — required primary model key (MiMo V2.5)
#   DEEPSEEK_API_KEY           — wired-but-disabled fallback model key (DeepSeek)
#   (photo-search recognition rides the same chat model credentials above —
#   #656 retired the standalone Gemini vision provider in favor of the main
#   agent's multimodal input, apps/agent/src/animichi/agents/photo_vision.py)
#   OPENAI_COMPAT_BASE_URL     — OpenAI-compatible endpoint (MiMo transport)
#   OPENAI_COMPAT_API_KEY      — wired-but-disabled compat fallback provider key
#   GOOGLE_MAPS_API_KEY        — optional geocoding provider key
#   LOGFIRE_TOKEN              — optional observability token
#   CORS_ALLOWED_ORIGIN        — backend CORS allowlist
#
# Anonymous access (issue #274 / S1.8) — anonymous chat is OPT-IN and stays off
# until BOTH of these are present:
#   ANON_ACCESS_ENABLED        — "true" to open /v1/chat to anonymous callers ([vars] below)
#   ANON_ID_SECRET             — HMAC key for the signed anonymous-id cookie (wrangler secret put)
#   TURNSTILE_SECRET           — REQUIRED once ANON_ACCESS_ENABLED="true" (issue #447): every
#                                anonymous /v1/chat turn is verified at siteverify before it can
#                                reach the limiter or the container, so an environment with
#                                anonymous access on and no secret answers 403 turnstile_required
#                                to everyone. Local/dev may use Cloudflare's always-passing test
#                                pair (site 1x00000000000000000000AA / secret 1x0000000000000000000000000000000AA).

compatibility_date = "2025-03-01"
# `enable_ctx_exports` is required for the `ctx.exports` loopback-binding API
# (docs: workers/runtime-apis/context#exports — "you must use the
# enable_ctx_exports compatibility flag", on by default only in future).
# @cloudflare/containers reaches ctx.exports.ContainerProxy when starting the
# RuntimeContainer; without the flag the export exists but the API does not,
# and every container start fails with "ctx.exports is undefined" — staging
# /healthz 500 on the first real root deploy (run 30795617682).
compatibility_flags = ["nodejs_compat", "enable_ctx_exports"]
main = "src/entry.ts"

# Plain (non-secret) vars forwarded into the RuntimeContainer (Python agent).
# CATALOG_API_URL is the base the agent's CatalogClient POSTs to as
# `{CATALOG_API_URL}/catalog/<method>`. The container reaches catalog over the
# private hostname `catalog.internal`, intercepted by RuntimeContainer.outboundByHost
# → env.CATALOG binding (in-datacenter, no public internet round-trip).
# There is NO public /catalog/* route on the main Worker.
[vars]
# Forwarded to the container as APP_ENV (issue #498) — Settings.app_env's own
# default is "development", so the default (no-env-selected) `wrangler dev`
# block matches that instead of silently claiming "production".
APP_ENV = "development"
CATALOG_API_URL = "http://catalog.internal"
ANON_ACCESS_ENABLED = "true"
# NEON_AUTH_JWKS_URL — Neon Auth branch JWKS (AUTH-2 #950): the edge's ONLY
# identity source. Unset fails closed (no verified bearer).
# Showcase-mode gate (S0-v2 GOAL C / C9): worker-side sibling of the web app's
# VITE_SHOWCASE_MODE with the same strict-boolean contract — only the literal
# "false" opens the functional /v1 routes; "true" denies them with 403 and any
# unset/empty/malformed value FAILS CLOSED (denies). staging=false keeps full
# functionality, production=true makes the backend unreachable past the
# landing's own surface (/healthz, /img/*, /tiles/*). Consumed by the edge
# worker itself, so it is deliberately NOT in CONTAINER_ENV_KEYS.
EDGE_SHOWCASE_MODE = "false"
# Per-identity burst limit (abuse control). The per-identity DAILY message
# quota is issue #282 and is configured separately.
ANON_RATE_LIMIT = "20"
ANON_RATE_LIMIT_WINDOW_SECONDS = "60"
# Global anonymous daily spend ceiling (X4). Enforced by the container ingress
# against the daily_usage table; 0 disables the breaker.
ANON_DAILY_COST_BUDGET_USD = "5.0"
# Per-identity daily message quota (issue #282, S1.10) — a fairness/UX
# mechanism, not a security defense line: it keeps one visitor's free usage
# reasonable while the shared budget above stays open for everyone else.
# Enforced by the container ingress against anon_daily_message_count; 0 or
# unset disables it, the same "0 disables" convention as the budget ceiling
# above. Default is an owner-set operations decision (20 here is a starting
# point, not a locked-in value).
ANON_DAILY_MESSAGE_QUOTA = "20"
# Per-identity limit on the two cost-bearing AUTHENTICATED endpoints (issue
# #284 / Task 9): POST /v1/chat and POST /v1/byok/probe ONLY — authenticated
# reads (GET /v1/conversations, /v1/*/messages, /v1/*/routes) are NOT counted
# against this window, so paging through session history never 429s an
# unrelated in-flight chat turn. Left unset this falls back to the
# authenticated class default in @animichi/contract identity-contract (60/60s);
# 60/60s gives normal chat usage headroom above the anonymous burst ceiling.
AUTH_RATE_LIMIT = "60"
AUTH_RATE_LIMIT_WINDOW_SECONDS = "60"

# Catalog read-path service (search/spots/nearby/route).
# This binding is reached ONLY via RuntimeContainer.outboundByHost["catalog.internal"]
# — the container intercepts outbound requests to catalog.internal and routes them
# to env.CATALOG (in-datacenter hop, no public internet, no extra auth surface).
# The catalog Worker must be deployed first (its name = "catalog" must match
# the `service` field below). There is NO public /catalog/* route on the main Worker.
[[services]]
binding = "CATALOG"
service = "catalog"

# Users service for authenticated user-domain routes.
[[services]]
binding = "USERS"
service = "users"

# Map assets remain private in R2.  The edge Worker is the only public reader;
# `/tiles/*` is routed to this Worker by Pulumi once the web hostname is enabled.
# Local/default and staging deliberately point at the staging bucket so a
# command without an explicit production environment cannot read production
# map data.
[[r2_buckets]]
binding = "MAP_TILES"
bucket_name = "map-tiles-staging"

[[containers]]
name = "animichi-runtimecontainer"
class_name = "RuntimeContainer"
image = "../../apps/agent/Dockerfile"
image_build_context = "../../"
max_instances = 3
# lite (0.0625 vCPU / 256 MiB) is below this service's import peak (~273 MiB,
# cold-start audit 2026-08-07) — OOM risk during boot. basic: 1/4 vCPU / 1 GiB.
instance_type = "basic"

[[durable_objects.bindings]]
name = "CONTAINER"
class_name = "RuntimeContainer"

# Strongly-consistent state for the edge guards (rate limiter + anonymous
# daily-budget latch). A Durable Object, not KV: both are read-modify-write
# counters that must be correct under concurrency, and KV is eventually
# consistent with a 60s edge cache.
[[durable_objects.bindings]]
name = "EDGE_GUARD"
class_name = "EdgeGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RuntimeContainer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EdgeGuard"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[env.production]
name = "animichi"

[env.production.vars]
# Forwarded to the container as APP_ENV (issue #498) — required, see
# src/container/container-env.ts CONTAINER_REQUIRED_KEYS.
APP_ENV = "production"
CATALOG_API_URL = "http://catalog.internal"
ANON_ACCESS_ENABLED = "false"
# NEON_AUTH_JWKS_URL — Neon Auth branch JWKS (AUTH-2 #950): the edge's ONLY
# identity source. Unset fails closed (no verified bearer).
# Showcase-mode gate (S0-v2 GOAL C / C9): production is landing-only — every
# functional /v1 route (chat/photo-search/users) and the public catalog read
# answer 403; only /healthz, /img/* and /tiles/* stay reachable. Strict
# boolean: anything other than the literal "false" denies, so a missing var
# can never silently re-open the backend.
EDGE_SHOWCASE_MODE = "true"
# Per-identity burst limit (abuse control). The per-identity DAILY message
# quota is issue #282 and is configured separately.
ANON_RATE_LIMIT = "20"
ANON_RATE_LIMIT_WINDOW_SECONDS = "60"
# Global anonymous daily spend ceiling (X4). Enforced by the container ingress
# against the daily_usage table; 0 disables the breaker.
ANON_DAILY_COST_BUDGET_USD = "5.0"
# Per-identity daily message quota (issue #282, S1.10) — a fairness/UX
# mechanism, not a security defense line: it keeps one visitor's free usage
# reasonable while the shared budget above stays open for everyone else.
# Enforced by the container ingress against anon_daily_message_count; 0 or
# unset disables it, the same "0 disables" convention as the budget ceiling
# above. Default is an owner-set operations decision (20 here is a starting
# point, not a locked-in value).
ANON_DAILY_MESSAGE_QUOTA = "20"
# Per-identity limit on the two cost-bearing AUTHENTICATED endpoints (issue
# #284 / Task 9): POST /v1/chat and POST /v1/byok/probe ONLY — authenticated
# reads (GET /v1/conversations, /v1/*/messages, /v1/*/routes) are NOT counted
# against this window, so paging through session history never 429s an
# unrelated in-flight chat turn. Left unset this falls back to the
# authenticated class default in @animichi/contract identity-contract (60/60s);
# 60/60s gives normal chat usage headroom above the anonymous burst ceiling.
AUTH_RATE_LIMIT = "60"
AUTH_RATE_LIMIT_WINDOW_SECONDS = "60"

[[env.production.services]]
binding = "CATALOG"
service = "catalog"

[[env.production.services]]
binding = "USERS"
service = "users"

[[env.production.r2_buckets]]
binding = "MAP_TILES"
bucket_name = "map-tiles"

[[env.production.containers]]
class_name = "RuntimeContainer"
image = "../../apps/agent/Dockerfile"
image_build_context = "../../"
max_instances = 3
# lite (0.0625 vCPU / 256 MiB) is below this service's import peak (~273 MiB,
# cold-start audit 2026-08-07) — OOM risk during boot. basic: 1/4 vCPU / 1 GiB.
instance_type = "basic"

[[env.production.durable_objects.bindings]]
name = "CONTAINER"
class_name = "RuntimeContainer"

# Strongly-consistent state for the edge guards (rate limiter + anonymous
# daily-budget latch). A Durable Object, not KV: both are read-modify-write
# counters that must be correct under concurrency, and KV is eventually
# consistent with a 60s edge cache.
[[env.production.durable_objects.bindings]]
