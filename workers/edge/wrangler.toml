[[env.staging.containers]]
class_name = "RuntimeContainer"
image = "../../apps/agent/Dockerfile"
image_build_context = "../../"
max_instances = 3
# lite (0.0625 vCPU / 256 MiB) is below this service's import peak (~273 MiB,
# cold-start audit 2026-08-07) — OOM risk during boot. basic: 1/4 vCPU / 1 GiB.
instance_type = "basic"
# Co-locate with the Neon data plane (aws-ap-southeast-1). Unconstrained
# placement put the container an ocean away: measured 208ms per statement
# (BEGIN/COMMIT n=75, range 205-214ms — a fixed RTT, not query work), and one
# chat turn spends 8+ round trips on transaction control alone. Placement is
# sticky once an instance is running (Containers FAQ), so this must be pinned
# rather than left to first-request routing.
constraints = { regions = ["APAC"] }

[[env.staging.durable_objects.bindings]]
name = "CONTAINER"
class_name = "RuntimeContainer"

# Strongly-consistent state for the edge guards (rate limiter + anonymous
# daily-budget latch). A Durable Object, not KV: both are read-modify-write
# counters that must be correct under concurrency, and KV is eventually
# consistent with a 60s edge cache.
[[env.staging.durable_objects.bindings]]
name = "EDGE_GUARD"
class_name = "EdgeGuard"

# W1-2 (#1251): the singleton RunSweeper Durable Object — the at-least-once
# backstop for agent turns. The intake commits its transaction and then arms the
# session's own DO; a crash in between leaves a committed `running` run whose
# session instance was never armed, so only an instance OUTSIDE that session can
# notice. One instance for the whole Worker, on a periodic alarm, scans `runs`
# for running rows with an expired or never-taken lease and re-arms each one's
# session (spec docs/specs/2026-09-01-agent-ts-rewrite-spec.md §三).
#
# AGENT_SESSION is the per-session Durable Object the sweeper wakes and the
# intake arms (#1252): one instance per session, running its turn inside its own
# `alarm()` handler. The binding is safe to declare now because `src/entry.ts`
# exports the class wrangler resolves `class_name` against.
[[env.staging.durable_objects.bindings]]
name = "AGENT_SESSION"
class_name = "AgentSession"


[[env.staging.ratelimits]]
name = "RATE_LIMITER"
# Chosen integer, distinct per environment so staging counters stay
# independent of local/production. Do not reuse across unrelated bindings.
namespace_id = "100002"
simple = { limit = 60, period = 60 }

