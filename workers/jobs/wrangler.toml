name = "jobs"
main = "src/index.ts"
compatibility_date = "2026-08-03"
compatibility_flags = ["nodejs_compat"]

# Scheduled-only Worker: no workers.dev or preview URL may expose this database mutator.
workers_dev = false
preview_urls = false

[observability]
enabled = true

[triggers]
crons = ["37 18 * * *", "37 19 * * *"]

[env.production]
name = "jobs"
workers_dev = false
preview_urls = false

# Production has NO Secrets Store binding yet (#912): the store secrets hold
# staging-role DSNs only, so binding production to them would silently point
# prod at the staging database. Production keeps its AGENT_DATABASE_URL worker
# secret (uploaded by CI from the same-named GH environment secret) until the
# production-role cutover phase (#912 follow-up); `secrets.required` here is
# the fail-closed guard for that upload chain.

[env.production.triggers]
crons = ["37 18 * * *", "37 19 * * *"]

[env.production.secrets]
required = ["AGENT_DATABASE_URL"]
