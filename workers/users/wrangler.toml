name = "users"
main = "src/index.ts"
# No public workers.dev host — reached only via the root Worker USERS service binding.
workers_dev = false
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# Keep vars to ENVIRONMENT only. Tests assert unconfigured auth/database 503s;
# local dev uses .dev.vars and deployed environments use Secrets Store bindings.
[vars]
ENVIRONMENT = "development"

[env.staging]
name = "users-staging"
workers_dev = false

# #912 PR2: the staging DSN comes from the Cloudflare Secrets Store (secret
# USERS_DATABASE_URL, provisioned by the infra/database-access Pulumi stack)
# instead of `wrangler secret put` in CI. env.DATABASE_URL is then a
# SecretsStoreSecret — src/index.ts awaits `.get()` (string fallback kept for
# tests/local dev). Wrangler validates the binding at deploy time; no CI
# secret pass-through remains.
[[env.staging.secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "USERS_DATABASE_URL"

[env.staging.vars]
ENVIRONMENT = "staging"

[env.production]
name = "users"
workers_dev = false

# #1048 production runtime DSN cutover: production reads its DSN from the
# Cloudflare Secrets Store like staging already does. The store secrets are
# provisioned by the infra/database-access Pulumi stack with the prod stack's
# "_PROD" suffix (USERS_DATABASE_URL_PROD) because staging and production
# share the account's single default Secrets Store. env.DATABASE_URL is then
# a SecretsStoreSecret - src/index.ts awaits `.get()`. CI no longer uploads
# DATABASE_URL as a worker secret for production; the binding supersedes the
# old owner-DSN upload.
[[env.production.secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "USERS_DATABASE_URL_PROD"

[env.production.vars]
ENVIRONMENT = "production"
