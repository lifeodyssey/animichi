# #1051 / #1124 / #1589 / #1634 — the migrator Worker.
#
# POST /migrate applies the one Prisma chain, read from the graph this Worker
# carries at /bundle/migrations (src/prisma-target.ts), behind a fixed-name DO
# mutex (src/lock.ts). Prisma's control client carries the apply over `pg` — a
# TCP connection, which nodejs_compat below provides — to the DIRECT Neon
# host; src/direct-dsn.ts rejects a pooled one before any SQL. neon-http is left
# with two read-only probes: the ledger check that refuses a database the
# retired chain migrated (src/atlas-leftovers.ts, #1625) and GET /catalog-schema.
# The migrator DSN (MIGRATOR_DATABASE_URL, dedicated `migrator` role, #1050) is a
# Secrets Store binding, never in GitHub, never on a runtime worker
# (workers/edge/test/migrator-role-isolation.test.ts).
#
# Reached by the deploy pipeline at POST /migrate. Each environment's URL is
# supplied to CI as the `MIGRATOR_STAGING_URL` / `MIGRATOR_PRODUCTION_URL`
# workflow variable (the account's workers.dev / custom host is provisioned by
# the operator on first deploy).
#
# #1365 (#1055) adds [env.production]: a SEPARATE Worker with a separate DSN
# secret (MIGRATOR_DATABASE_URL_PROD, the "_PROD" name the prod stack of
# infra/database-access writes — staging and production share the account's one
# Secrets Store, so the names must differ) and a separate OIDC allowlist,
# selected by MIGRATOR_OIDC_POLICY. The two allowlists never merge: one array
# holding both shapes would let the staging job's token open the production
# door (MED-2, src/policy.ts). Staging sets no selector — the default IS
# staging, so a Worker deployed without one cannot become the production door.

name = "migrator"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# The migrator is a live helper endpoint (OIDC-protected) the deploy pipeline
# calls, so it exposes a CI-reachable host. Staging uses the account's
# workers.dev host (a public config, not a credential); stateful/private
# Workers keep workers_dev = false (see catalog/users).
workers_dev = true
preview_urls = false

[vars]
ENVIRONMENT = "development"

[[durable_objects.bindings]]
name = "MIGRATOR_APPLY_LOCK"
class_name = "MigratorApplyLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MigrationContainer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MigratorApplyLock"]

[[migrations]]
tag = "v3-retire-migration-container"
deleted_classes = ["MigrationContainer"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[env.staging]
name = "migrator-staging"
workers_dev = true
preview_urls = false

# #1050: the staging migrator DSN comes from the Cloudflare Secrets Store
# (secret MIGRATOR_DATABASE_URL, provisioned by infra/database-access). env.
# MIGRATOR_DATABASE_URL is a SecretsStoreSecret; src/index.ts awaits .get().
[[env.staging.secrets_store_secrets]]
binding = "MIGRATOR_DATABASE_URL"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "MIGRATOR_DATABASE_URL"

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.durable_objects.bindings]]
name = "MIGRATOR_APPLY_LOCK"
class_name = "MigratorApplyLock"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["MigrationContainer"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["MigratorApplyLock"]

[[env.staging.migrations]]
tag = "v3-retire-migration-container"
deleted_classes = ["MigrationContainer"]

[env.production]
name = "migrator-production"
workers_dev = true
preview_urls = false

# #1050/#1365: the production migrator DSN. Same store as staging (the account
# plan allows one), so the secret carries the prod stack's "_PROD" suffix while
# the binding keeps the single name src/create-app.ts reads.
[[env.production.secrets_store_secrets]]
binding = "MIGRATOR_DATABASE_URL"
store_id = "66c9bb0faef644b4a0671bb7d90d98bd"
secret_name = "MIGRATOR_DATABASE_URL_PROD"

[env.production.vars]
ENVIRONMENT = "production"
# The only thing that makes this Worker enforce PRODUCTION_OIDC_POLICY.
MIGRATOR_OIDC_POLICY = "production"

[[env.production.durable_objects.bindings]]
name = "MIGRATOR_APPLY_LOCK"
class_name = "MigratorApplyLock"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["MigrationContainer"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["MigratorApplyLock"]

[[env.production.migrations]]
tag = "v3-retire-migration-container"
deleted_classes = ["MigrationContainer"]
