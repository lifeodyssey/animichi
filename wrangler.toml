[env.staging]
name = "animichi-staging"
routes = []
# No custom domain in staging. Wrangler's own default-resolution logic
# (`defaultWorkersDev = routes.length === 0`, confirmed against the 4.79/
# 4.112 source — the published docs' "adding a routes component infers
# workers_dev=false" note is only true for a NON-empty routes array) already
# defaults workers_dev to true here: this Worker was already reachable at
# https://animichi-staging.<account subdomain>.workers.dev without this line.
# `workers_dev = true` is written explicitly anyway (issue #484) so the
# post-staging promotion gate's assertions have a stable, intentional
# contract instead of relying on an implicit default that a future non-empty
# `routes` entry would silently flip to false. `preview_urls` is pinned to
# `false` for the same reason — Cloudflare defaults it to match workers_dev,
# and per-version preview URLs are not a surface this gate (or anything
# else) is meant to expose.
workers_dev = true
preview_urls = false

[env.staging.vars]
# Forwarded to the container as APP_ENV (issue #498) — required, see
# containerEnv.ts CONTAINER_REQUIRED_KEYS. This is the whole point of the fix:
# staging traces must tag "staging" in Logfire, not "production".
APP_ENV = "staging"
CATALOG_API_URL = "http://catalog.internal"
# #527/#528 (P1-A): CORS_ALLOWED_ORIGIN was never provisioned for staging as
# either a repo-level or a staging-environment GH secret. Simply removing it
# from ci.yml's worker_secrets (an earlier revision of this PR did that) would
# NOT preserve staging's current behavior — there is no wildcard fallback.
# `worker/containerEnv.ts` hardcodes `APP_ENV: "production"` for every
# environment (confirmed: no APP_ENV var/secret exists anywhere — root,
# staging, or production), and only forwards CORS_ALLOWED_ORIGIN to the
# container when it is non-empty. With it absent, the container boots with
# `app_env=production` and `cors_allowed_origin=""`'s Pydantic-validated
# default `"*"` — and `settings.py`'s `validate_cors_origin` raises
# ValueError on `"*"` when `app_env == "production"` (verified: reproduced
# the exact ValidationError locally with `env -i APP_ENV=production ...`).
# Deleting the entry would have swapped "deploy step fails loudly, before
# anything is live" for "deploy succeeds, container crash-loops" — worse,
# not better. A domain name isn't a secret; putting the real staging web
# origin here (verified reachable: `curl -o /dev/null -w '%{http_code}'
# https://animichi-web-staging.zhenjiazhou0127.workers.dev/` -> 200, and
# matches apps/web/wrangler.jsonc's `env.staging.name` = "animichi-web-staging"
# with no custom route, i.e. the default workers.dev URL) is more honest than
# a GH secret nobody would think to look for, and needs no owner action.
# `buildContainerEnvVars` forwards `vars` and `secrets` identically — this
# is not a behavior change from the container's point of view. NOTE: the
# root `animichi-staging` Worker has never successfully deployed yet
# (`wrangler secret list --env staging` -> "Worker ... not found"), so there
# is no pre-existing manually-set CORS_ALLOWED_ORIGIN secret this could
# conflict with.
CORS_ALLOWED_ORIGIN = "https://animichi-web-staging.zhenjiazhou0127.workers.dev"
ANON_ACCESS_ENABLED = "true"
# Per-identity burst limit (abuse control). The per-identity DAILY message
# quota is issue #282 and is configured separately.
ANON_RATE_LIMIT = "20"
ANON_RATE_LIMIT_WINDOW_SECONDS = "60"
# Global anonymous daily spend ceiling (X4). Enforced by the container ingress
# against the daily_usage table; 0 disables the breaker.
ANON_DAILY_COST_BUDGET_USD = "5.0"
# Per-identity daily message quota (issue #282, S1.10) — a fairness/UX
# mechanism, not a security defense line: it keeps one visitor's free usage
# reasonable while the shared budget above stays open for everyone else.
# Enforced by the container ingress against anon_daily_message_count; 0 or
# unset disables it, the same "0 disables" convention as the budget ceiling
# above. Default is an owner-set operations decision (20 here is a starting
# point, not a locked-in value).
ANON_DAILY_MESSAGE_QUOTA = "20"
# Per-identity limit on the two cost-bearing AUTHENTICATED endpoints (issue
# #284 / Task 9): POST /v1/chat and POST /v1/byok/probe ONLY — authenticated
# reads (GET /v1/conversations, /v1/*/messages, /v1/*/routes) are NOT counted
# against this window, so paging through session history never 429s an
# unrelated in-flight chat turn. Left unset this would silently fall back to
# the shared ANON_RATE_LIMIT default (20/60s); 60/60s gives normal chat usage
# headroom above the anonymous burst ceiling.
AUTH_RATE_LIMIT = "60"
AUTH_RATE_LIMIT_WINDOW_SECONDS = "60"

[[env.staging.services]]
binding = "CATALOG"
service = "catalog-staging"

[[env.staging.services]]
binding = "USERS"
service = "users-staging"

[[env.staging.containers]]
class_name = "RuntimeContainer"
image = "./Dockerfile"
max_instances = 3

[[env.staging.durable_objects.bindings]]
name = "CONTAINER"
class_name = "RuntimeContainer"

# Strongly-consistent state for the edge guards (rate limiter + anonymous
