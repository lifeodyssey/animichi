# SonarCloud automatic-analysis config (single source of truth; the legacy
# sonar-project.properties twin was retired).
# The archived Supabase tree (issue #1000) duplicates shapes the live data plane also declares;
# that duplication is history, not a finding. `packages/test-postgres/sql/` holds one frozen
# pre-Prisma fixture for the two lanes whose query layer has not moved yet (#1629–#1631), which
# duplicates the same shapes for the same reason.
sonar.cpd.exclusions=supabase/migrations/**,packages/test-postgres/sql/**

# #725: these two trees are static design-mockup exports (HTML/JS/JSX/CSS +
# their own spec markdown) — never built, bundled, or deployed, and they never
# execute against production data. Scanning them as production code produced
# ~18 false-positive VULNERABILITY findings (e.g. Math.random() in a static
# splash-screen mockup flagged as weak crypto). Keep this list narrow: only
# directories verified to contain nothing that ships or runs in a request path.
# e2e/** is test infrastructure (Playwright suites + visual tooling) — static analysis stays on, coverage-on-new-code does not apply.
sonar.coverage.exclusions=e2e/**
sonar.exclusions=docs/archive/design-sync/**,docs/archive/mockups-demo/**,docs/archive/landing-hero/**,docs/archive/review-boards/**,docs/mockups/**
