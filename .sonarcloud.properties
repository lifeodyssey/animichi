# SonarCloud automatic-analysis config (this file name is what automatic
# analysis reads; sonar-project.properties is kept for CI-based scanners).
# The twin-migration rule (docs/ops/neon-test-infra.md) REQUIRES every
# supabase migration to ship a near-identical auth-stripped atlas twin —
# duplication across the two migration trees is structural, not accidental.
sonar.cpd.exclusions=supabase/migrations/**,db/migrations/**
