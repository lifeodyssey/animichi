[project]
name = "animichi"
version = "0.1.0"
description = "AI-powered travel assistant for anime pilgrims using Gemini LLM"
requires-python = ">=3.11"
authors = [
    {name = "Animichi Team", email = "team@animichi.com"}
]
keywords = ["anime", "travel", "ai", "gemini", "animichi", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core Dependencies
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    # Async/HTTP
    "httpx>=0.28.0",
    # Security floors for transitive deps (open dependabot alerts)
    "urllib3>=2.7.0",
    "authlib>=1.6.12",
    "idna>=3.15",
    "starlette>=1.0.1",
    # Observability
    "structlog>=25.0.0",
    "rich>=14.0.0",
    # Google Generative AI (model-agnostic, used by pydantic-ai)
    "google-genai>=1.16.0",
    # v2: Agent Framework
    "pydantic-ai>=2.9.0",
    # v2: Database (Postgres + PostGIS)
    "asyncpg>=0.31.0",
    # HTTP runtime adapter
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "ddgs>=9.14.1",
    "logfire[fastapi,httpx]>=4.29.0",
]

[project.scripts]
animichi-api = "agent.interfaces.fastapi_service:main"

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",

    # Code Quality
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "pre-commit>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 88
target-version = "py311"
# vulture's whitelist is a bare-name DSL artifact, not importable Python source.
# Exclude it from ruff (B018/F821 are expected for the DSL) — not a code suppression.
extend-exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "S",   # flake8-bandit security
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"agent/tests/**" = ["S101", "S105", "S106", "S108", "S311", "S314", "S607"]
"agent/config/settings.py" = ["S104"]  # FastAPI container must bind 0.0.0.0; remove with agent→Worker migration (Wave 3)
"agent/interfaces/routes/health.py" = ["S603"]  # args is always a hardcoded list, not user input

[tool.coverage.run]
source = ["agent"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    ".uv_python/*",
    "*/.uv_python/*",
    ".uv_cache/*",
    "*/.uv_cache/*",
    ".uv-cache/*",
    "*/.uv-cache/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.vulture]
paths = ["agent", "vulture_whitelist.py"]
min_confidence = 80

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "agent/typestubs"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "agent.agents.models",
    "agent.domain.entities",
    "agent.domain.llm_schemas",
    "agent.interfaces.public_api",
]
disallow_any_explicit = false

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30.1",
    "mypy>=1.19.1",
    "psycopg2-binary>=2.9.11",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "sqlfluff>=4.2.2",
    "testcontainers[postgres]>=4.14.2",
    "vulture>=2.16",
]
# One-off maintenance scripts (e.g. agent/scripts/backfill_city.py) that pull
# heavy transitive deps (numpy+scipy via reverse-geocoder, ~70MB) we don't want
# in the production image or the everyday dev install.
scripts = [
    "reverse-geocoder>=1.5.1",
]
