# Fast local gate (<5s): ruff · oxlint · gitleaks run on every commit.
# Heavy checks (mypy, full test suites + coverage) run on pre-push, since CI
# is the authoritative gate for those — keeps commits fast per best practice.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '__snapshots__/|\.sse$'
      - id: end-of-file-fixer
        # Recorded SSE fixtures must keep their wire-accurate trailing blank
        # line (event terminator); do not let the fixer collapse it.
        exclude: '\.sse$'
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix, apps/agent/agent/]
      - id: ruff-format
        args: [apps/agent/agent/]

  # Secret scan — sub-second, official gitleaks pre-commit hook (SHA/tag-pinned).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Fast strict TS lint for the three live pnpm packages.
      - id: oxlint
        name: oxlint (strict live-package lint)
        entry: pnpm run lint:oxlint
        language: system
        files: ^(workers/catalog|workers/users|apps/web)/
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

      - id: frontend-lint
        name: frontend lint
        entry: bash -c 'cd frontend && npx eslint .'
        language: system
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

      # --- pre-push stage: heavy checks. Commits stay fast; CI is authoritative. ---
      - id: mypy
        name: mypy
        entry: bash -c 'cd apps/agent && uv run mypy agent/agents/ agent/interfaces/ agent/domain/ agent/infrastructure/ agent/clients/'
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: frontend-test-coverage
        name: frontend tests + coverage (lines>=60%)
        entry: bash -c 'cd frontend && npx vitest run --coverage'
        language: system
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
        stages: [pre-push]

      - id: backend-test-coverage
        name: backend tests + coverage (lines>=80%)
        entry: bash -c 'cd apps/agent && SUPABASE_DB_URL=postgresql://postgres:postgres@localhost:54322/postgres DEEPSEEK_API_KEY=test-key uv run pytest agent/tests/unit/ -q --cov --cov-fail-under=80'
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
