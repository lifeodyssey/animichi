# Local gates — three stages (contract: docs/ops/local-gates.md):
#
#   pre-commit (fast, <10s): universal checks (format, yaml/toml syntax,
#     shebang/exec-bit agreement, secret scan, shell/workflow lint, repo-wide
#     ruff) + oxlint for the TS packages actually staged
#     (scripts/local-gates/oxlint-changed.sh).
#
#   commit-msg: commitlint against commitlint.config.js — the same file CI's
#     `commits` job runs, so there is no second validator to drift from.
#
#   pre-push: scripts/local-gates/pre-push-affected.sh — the pushed commits'
#     messages go through commitlint (the `commits` job's own command over the
#     same narrowed range), then the changed files select the workspace packages
#     (each runs its own lint / typecheck / test / test:integration scripts, the
#     ones CI runs) plus two buckets: the migration chain and the
#     documentation hygiene checks. Browser e2e, live Neon and deploys stay
#     in CI; `make check-full` is the manual everything-run.
#
# Install: pre-commit install --hook-type pre-commit --hook-type commit-msg
#   --hook-type pre-push
# Policy: fix a failing gate or document an environmental exemption — no
# silent --no-verify (CI still enforces).
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '__snapshots__/|\.sse$'
      - id: end-of-file-fixer
        # Recorded SSE fixtures must keep their wire-accurate trailing blank
        # line (event terminator); do not let the fixer collapse it.
        exclude: '\.sse$'
      - id: check-yaml
      - id: check-toml
      # The two halves of the shebang/exec-bit agreement, upstream's own
      # implementation of what shebang-exec-bit.sh hand-rolled (#1371): a file
      # with the executable bit must say how to run it, and a file that says so
      # must be runnable. Together they keep `bash scripts/x.sh` and
      # `./scripts/x.sh` from disagreeing about a script.
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # commit-msg: the CI mirror is the `commits` job, which runs this same
  # commitlint.config.js over the PR's commits and its title. The hook brings
  # its own @commitlint/cli (^21.1.0 at this rev, the workspace's major), and
  # config-conventional is pinned to the version the workspace resolves.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@21.2.2"]

  # Ruff over any staged .py (scripts/git-squash-daily.py is the one Python
  # file left once the agent was retired, #1607). Like every pre-commit hook,
  # this lints staged files.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
      - id: ruff-format
        types: [python]

  # Secret scan — sub-second, official gitleaks pre-commit hook (SHA/tag-pinned).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Oxlint for the TS packages actually staged. Dispatch is derived from
      # `pnpm ls` (scripts/local-gates/oxlint-changed.sh): a package with
      # lint:oxlint is picked up automatically, and every workspace package has
      # one (#1358).
      - id: oxlint
        name: oxlint (changed TS packages)
        entry: bash scripts/local-gates/oxlint-changed.sh
        language: system
        pass_filenames: false
        always_run: true

      # Shell syntax + common pitfalls (SC2086 reached CI twice in #853/#857).
      # Every shell file, not only scripts/ and .github/scripts/: #1371 retired
      # quality.sh, whose hand-written `run shellcheck` lines were the only
      # thing covering infra/database-access/reset-staging-baseline.sh and the
      # per-package scripts. `types: [shell]` is the whole scope now, so a new
      # script cannot land outside it.
      - id: shellcheck
        name: shellcheck (every shell file)
        entry: shellcheck --severity=warning
        language: system
        types: [shell]

      # GitHub Actions syntax + workflow_call.secrets typing.
      - id: actionlint
        name: actionlint (workflow syntax)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      # ORM-only database access (raw-SQL policy, #999). Runs the repository
      # Semgrep ruleset (.semgrep/, three rules) on TypeScript, scoped to
      # /workers/catalog/src and /workers/users/src (paths.include); unrelated
      # files simply match nothing and pass. semgrep is installed via uv tool
      # (same version as the reusable-security CI job — 1.172.0). Atlas migration SQL and the
      # sanctioned typed-expression seams are excluded by the rules themselves.
      #
      # We scan the repo ROOT (target '.') rather than passing the staged files
      # explicitly: semgrep applies .semgrepignore (which excludes test/ and
      # tests/) only to directory scans, and applies the rules' anchored
      # paths.include only when target-relative paths keep the
      # /workers/... prefix. Listing individual payload files bypasses BOTH of
      # those — the pre-commit hook would flag pre-existing raw SQL in test
      # fixtures (e.g. workers/**/test/**) that the CI scan (.semgrepignore)
      # skips. Scanning '.' reproduces the CI job's behavior exactly, and
      # --exclude mirrors the test/test directory exclusions explicitly.
      - id: semgrep-orm
        name: semgrep (ORM-only DB access)
        # pass_filenames:false so pre-commit does NOT append the changed files as
        # explicit targets (that bypasses .semgrepignore). The files regex still
        # gates the hook to commits that touch a TypeScript file.
        entry: uv tool run --no-build semgrep@1.172.0 --config .semgrep --error . --exclude '**/tests/**' --exclude '**/test/**'
        language: system
        files: \.ts$
        pass_filenames: false

      # --- pre-push stage: the affected-package gate (#1371). ---
      # The changed files pick the packages and the three buckets; each package
      # runs its own lint / typecheck / test / test:integration scripts, which
      # are the ones CI's affected matrix runs, so nothing has to prove the two
      # agree. A changed path that maps to no package, no bucket and no
      # whitelist entry fails the push closed.
      - id: pre-push-affected
        name: pre-push affected gate (scripts/local-gates/pre-push-affected.sh)
        entry: bash scripts/local-gates/pre-push-affected.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
