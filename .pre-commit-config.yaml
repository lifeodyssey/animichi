# Local gates — two stages, routed by changed package (contract:
# docs/ops/local-gates.md):
#
#   pre-commit (fast, <10s): universal checks (format, yaml/toml syntax,
#     secret scan, shell/workflow lint, repo-wide ruff) + oxlint for the TS
#     packages actually staged. The router is
#     scripts/local-gates/changed-packages.sh --staged, which maps the staged
#     tracked diff (add/modify/rename/delete) plus intentional untracked
#     inputs onto the package set.
#
#   pre-push (medium): ONE orchestrator, scripts/local-gates/pre-push.sh,
#     invoked as a single hook. It re-reads the router in merge-base-to-head
#     mode and runs the deterministic Quality lane, then each affected
#     package's CI-equivalent gate set (lint + typecheck + unit + coverage +
#     build, contract drift, fresh-schema apply, credential-free Pulumi load)
#     with canonical floors from the packages themselves (agent 87 — nothing
#     weaker is duplicated here). Checks needing browser e2e / live Neon /
#     cloud deploys stay in CI.
#
# Install: pre-commit install && pre-commit install --hook-type pre-push
# Policy: fix a failing gate or document an environmental exemption — no
# silent --no-verify (CI still enforces).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '__snapshots__/|\.sse$'
      - id: end-of-file-fixer
        # Recorded SSE fixtures must keep their wire-accurate trailing blank
        # line (event terminator); do not let the fixer collapse it.
        exclude: '\.sse$'
      - id: check-yaml
      - id: check-toml

  # Ruff over all repo Python paths (any staged .py — apps/agent, scripts/,
  # .github/scripts/); previously scoped to apps/agent only, which let
  # scripts/*.py lint failures (EXE001/BLE001/PLW1510) reach CI. Like every
  # pre-commit hook, this lints staged files; the full tree is CI's job.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
      - id: ruff-format
        types: [python]

  # Secret scan — sub-second, official gitleaks pre-commit hook (SHA/tag-pinned).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Oxlint for the TS packages actually staged. Dispatch is derived from
      # the workspace set (scripts/local-gates/oxlint-changed.sh): a package
      # with lint:oxlint is picked up automatically. contract still lints
      # src/ only (test/ is outside tsconfig; type-aware collapse otherwise).
      - id: oxlint
        name: oxlint (changed TS packages)
        entry: bash scripts/local-gates/oxlint-changed.sh
        language: system
        pass_filenames: false
        always_run: true

      # Shell syntax + common pitfalls (SC2086 reached CI twice in #853/#857).
      - id: shellcheck
        name: shellcheck (scripts + CI shell)
        entry: shellcheck --severity=warning
        language: system
        files: ^(scripts|\.github/scripts)/
        types: [shell]

      # GitHub Actions syntax + workflow_call.secrets typing (actionlint.yaml
      # carries the documented STAGING_GATE_TOKEN environment-secret escape).
      - id: actionlint
        name: actionlint (workflow syntax)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      # ORM-only database access (raw-SQL policy, #999). Runs the repository
      # Semgrep ruleset (.semgrep/, six rules) on Python + TypeScript. Python
      # rules are scoped to /apps/agent, TypeScript to /workers/catalog/src and
      # /workers/users/src (paths.include); unrelated files simply match nothing
      # and pass. semgrep is installed via uv tool (same version as the
      # reusable-security CI job — 1.172.0). Atlas migration SQL and the
      # sanctioned typed-expression seams are excluded by the rules themselves.
      #
      # We scan the repo ROOT (target '.') rather than passing the staged files
      # explicitly: semgrep applies .semgrepignore (which excludes test/ and
      # tests/) only to directory scans, and applies the rules' anchored
      # paths.include only when target-relative paths keep the /apps/agent,
      # /workers/... prefix. Listing individual payload files bypasses BOTH of
      # those — the pre-commit hook would flag pre-existing raw SQL in test
      # fixtures (e.g. apps/agent/**/tests/**) that the CI scan (.semgrepignore)
      # skips. Scanning '.' reproduces the CI job's behavior exactly, and
      # --exclude mirrors the test/test directory exclusions explicitly.
      - id: semgrep-orm
        name: semgrep (ORM-only DB access)
        # pass_filenames:false so pre-commit does NOT append the changed files as
        # explicit targets (that bypasses .semgrepignore). The files regex still
        # gates the hook to commits that touch a Python/TypeScript file.
        entry: uv tool run --no-build semgrep@1.172.0 --config .semgrep --error . --exclude '**/tests/**' --exclude '**/test/**'
        language: system
        files: \.(py|ts)$
        pass_filenames: false

      # --- pre-push stage: the single orchestration surface (#1003). ---
      # scripts/local-gates/pre-push.sh is the sole pre-push entrypoint. It
      # re-reads the router in merge-base-to-head mode, runs the deterministic
      # Quality lane, then each affected package's CI-equivalent gates with
      # canonical floors from the packages themselves, and fails fast. The
      # earlier per-hook typecheck/unit/atlas/CI/docs duplication is gone.
      - id: pre-push
        name: pre-push orchestrator (scripts/local-gates/pre-push.sh)
        entry: bash scripts/local-gates/pre-push.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
