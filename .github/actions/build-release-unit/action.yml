name: Build release unit
description: Produce and seal one immutable release artifact for a main SHA.
inputs:
  unit:
    description: Release unit from the canonical component graph.
    required: true
  source_sha:
    description: Exact main SHA to package.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    - name: Install Pulumi CLI for sealed infra SDK generation
      if: ${{ inputs.unit == 'infra' }}
      uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      with:
        pulumi-version-file: .pulumi.version
    - name: Generate and build the pinned Neon provider SDK once
      if: ${{ inputs.unit == 'infra' }}
      working-directory: infra/database-access
      run: |
        set -euo pipefail
        pulumi package add terraform-provider kislerdm/neon
        git restore package.json
        pnpm install --frozen-lockfile
      shell: bash
    - name: Produce the release payload once
      env:
        RELEASE_UNIT: ${{ inputs.unit }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        CF_REGISTRY_ACCOUNT: "021233c1880a43aa68565496100e1f8c"
        VITE_SITE_ORIGIN: https://animichi.invalid
        VITE_CATALOG_URL: https://animichi.invalid/v1/catalog
        VITE_USERS_URL: https://animichi.invalid/v1/users
        VITE_AGENT_URL: https://animichi.invalid/v1
        VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        VITE_NEON_AUTH_BASE_URL: https://animichi.invalid/auth
        VITE_CF_BEACON_TOKEN: 00000000-0000-0000-0000-000000000000
        VITE_SHOWCASE_MODE: "false"
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/release-output"
        mkdir -p "$out"
        case "$RELEASE_UNIT" in
          web)
            pnpm --filter web build
            mkdir -p "$out/apps/web"
            cp -R apps/web/.output "$out/apps/web/.output"
            cp apps/web/wrangler.jsonc "$out/apps/web/wrangler.jsonc"
            cp package.json pnpm-lock.yaml pnpm-workspace.yaml "$out/"
            ;;
          catalog|users)
            mkdir -p "$out/bundle" "$out/config"
            pnpm exec wrangler deploy -c "workers/$RELEASE_UNIT/wrangler.toml" --dry-run -e production --outdir "$out/bundle"
            cp "workers/$RELEASE_UNIT/wrangler.toml" "$out/config/wrangler.toml"
            ;;
          db)
            mkdir -p "$out/migrations"
            cp -R migrations/neon/. "$out/migrations/"
            ;;
          agent)
            image="registry.cloudflare.com/$CF_REGISTRY_ACCOUNT/animichi-agent:sha-$SOURCE_SHA"
            docker build -f apps/agent/Dockerfile -t "$image" .
            docker save "$image" > "$out/image.tar"
            printf '%s\n' "$image" > "$out/image-ref"
            ;;
          migrator)
            image="registry.cloudflare.com/$CF_REGISTRY_ACCOUNT/animichi-migrator:sha-$SOURCE_SHA"
            docker build -f workers/migrator/Dockerfile -t "$image" .
            docker save "$image" > "$out/image.tar"
            printf '%s\n' "$image" > "$out/image-ref"
            mkdir -p "$out/bundle" "$out/config"
            sed -e "s#main = \"src/index.ts\"#main = \"$GITHUB_WORKSPACE/workers/migrator/src/index.ts\"#" \
              -e "s#image = \"./Dockerfile\"#image = \"$image\"#g" workers/migrator/wrangler.toml > "$RUNNER_TEMP/migrator.toml"
            sed "s#image = \"./Dockerfile\"#image = \"$image\"#g" workers/migrator/wrangler.toml > "$out/config/wrangler.toml"
            pnpm exec wrangler deploy -c "$RUNNER_TEMP/migrator.toml" --dry-run -e staging --outdir "$out/bundle"
            ;;
          edge)
            image="registry.cloudflare.com/$CF_REGISTRY_ACCOUNT/animichi-agent:sha-$SOURCE_SHA"
            printf '%s\n' "$image" > "$out/image-ref"
            mkdir -p "$out/bundle" "$out/config"
            sed -e "s#main = \"src/entry.ts\"#main = \"$GITHUB_WORKSPACE/workers/edge/src/entry.ts\"#" \
              -e "s#image = \"../../apps/agent/Dockerfile\"#image = \"$image\"#g" workers/edge/wrangler.toml > "$RUNNER_TEMP/edge.toml"
            sed "s#image = \"../../apps/agent/Dockerfile\"#image = \"$image\"#g" workers/edge/wrangler.toml > "$out/config/wrangler.toml"
            pnpm exec wrangler deploy -c "$RUNNER_TEMP/edge.toml" --dry-run -e production --outdir "$out/bundle"
            ;;
          infra)
            git archive "$SOURCE_SHA" infra | tar -x -C "$out"
            built_sdk="infra/database-access/node_modules/@pulumi/neon"
            sealed_sdk="$out/infra/database-access/sdks/neon"
            [ -f "$built_sdk/bin/index.js" ] || { echo "::error::built Neon provider SDK entrypoint is missing"; exit 1; }
            mkdir -p "$out/infra/database-access/sdks"
            cp -RL "$built_sdk" "$sealed_sdk"
            [ -f "$sealed_sdk/bin/index.js" ] || { echo "::error::sealed Neon provider SDK entrypoint is missing"; exit 1; }
            cp package.json pnpm-lock.yaml pnpm-workspace.yaml .pulumi.version "$out/"
            printf '%s\n' 'rollback-before-pulumi-up' > "$out/rollback-contract"
            ;;
          *) echo "::error::unknown release unit $RELEASE_UNIT"; exit 1 ;;
        esac
      shell: bash
    - name: Seal payload and metadata
      env:
        RELEASE_UNIT: ${{ inputs.unit }}
        SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -euo pipefail
        release="$RUNNER_TEMP/release"
        mkdir -p "$release"
        tar -C "$RUNNER_TEMP/release-output" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - . \
          | gzip -n > "$release/artifact.tar.gz"
        digest="$(sha256sum "$release/artifact.tar.gz" | cut -d' ' -f1)"
        jq -n -c --arg unit "$RELEASE_UNIT" --arg source_sha "$SOURCE_SHA" --arg digest "$digest" \
          '{schema_version:1,unit:$unit,source_sha:$source_sha,artifact_sha256:$digest}' > "$release/artifact-manifest.json"
      shell: bash
    - name: Publish immutable main-SHA artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-${{ inputs.source_sha }}-${{ inputs.unit }}
        path: ${{ runner.temp }}/release
        if-no-files-found: error
        retention-days: 14
