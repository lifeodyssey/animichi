name: Upload coverage
description: Download one affected component's coverage artifact and publish it through Codecov OIDC.
inputs:
  component:
    description: Component name.
    required: true
  download_path:
    description: Artifact destination.
    required: true
  files:
    description: Codecov file list for non-agent components.
    required: false
    default: ""
  flags:
    description: Codecov flags for non-agent components.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ci-coverage-${{ inputs.component }}-${{ github.sha }}
        path: ${{ inputs.download_path }}
    - name: Upload unit coverage
      if: ${{ inputs.component == 'agent' }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: apps/agent/coverage-unit.xml
        flags: unit
        fail_ci_if_error: true
        use_oidc: true
    - name: Upload integration coverage
      if: ${{ inputs.component == 'agent' }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: apps/agent/coverage-integration.xml
        flags: integration
        fail_ci_if_error: true
        use_oidc: true
    - name: Upload component coverage
      if: ${{ inputs.component != 'agent' }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ${{ inputs.files }}
        flags: ${{ inputs.flags }}
        fail_ci_if_error: true
        use_oidc: true
