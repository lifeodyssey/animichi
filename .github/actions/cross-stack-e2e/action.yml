name: Cross-stack E2E
description: Build the emitted web Worker and exercise its browser routes.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    - name: Build emitted web Worker
      env:
        VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
        VITE_SHOWCASE_MODE: "false"
        VITE_NEON_AUTH_BASE_URL: "http://127.0.0.1:9"
      run: pnpm --filter web test:integration
      shell: bash
    - name: Restore Playwright browser cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium
    - name: Install Playwright browser
      run: |
        test -x node_modules/.bin/playwright
        node_modules/.bin/playwright install --with-deps chromium
      shell: bash
    - name: Exercise emitted Worker routes
      run: |
        set -euo pipefail
        DEV_VARS=apps/web/.dev.vars
        RUNTIME_CONFIG='{"schemaVersion":1,"api":{"agentUrl":"http://127.0.0.1:9001","siteOrigin":"http://localhost:8799"},"neonAuthBaseUrl":"http://127.0.0.1:9","turnstileSiteKey":"1x00000000000000000000AA","showcaseMode":"false","featureFlags":{}}'
        WRANGLER_PID=""
        trap 'if [ -n "${WRANGLER_PID:-}" ]; then kill "$WRANGLER_PID" 2>/dev/null || true; fi; rm -f "$DEV_VARS"' EXIT
        printf 'RUNTIME_CONFIG=%s\n' "$RUNTIME_CONFIG" > "$DEV_VARS"
        pnpm --filter web exec wrangler dev --port 8799 &
        WRANGLER_PID=$!
        for _ in $(seq 1 60); do
          if curl -sf -o /dev/null http://localhost:8799/; then break; fi
          sleep 1
        done
        curl -sf -o /dev/null http://localhost:8799/
        E2E_WEB_BASE_URL=http://localhost:8799 pnpm --dir e2e exec playwright test \
          web-404.spec.ts web-maplibre-canary.spec.ts web-chat-anonymous.spec.ts web-hero-query.spec.ts
      shell: bash
