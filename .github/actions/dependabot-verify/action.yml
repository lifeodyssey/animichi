name: Verify Dependabot upgrade
description: Install unreviewed dependency changes without lifecycle scripts and run the cross-language gate.
runs:
  using: composite
  steps:
    - name: Verify repository contract
      run: |
        test -f apps/web/package.json
        test -f pnpm-lock.yaml
        test -f apps/agent/src/animichi/interfaces/fastapi_service.py
        test ! -e apps/agent/src/animichi/agents/pipeline.py
        test ! -d frontend
      shell: bash
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.11.14"
        prune-cache: "true"
    - name: Install Python
      run: uv python install 3.11
      shell: bash
    - name: Install locked Python dependencies safely
      run: uv sync --python 3.11 --all-extras --locked --no-build --no-binary-package animichi
      working-directory: apps/agent
      shell: bash
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        run_install: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install locked Node dependencies safely
      run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
    - name: Verify agent upgrade
      env:
        AGENT_SVC_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        MIMO_API_KEY: test-only
      run: |
        uv run --no-build --no-sync ruff format --check src/animichi/
        uv run --no-build --no-sync ruff check src/animichi/
        uv run --no-build --no-sync mypy src/animichi/agents/ src/animichi/interfaces/ src/animichi/domain/ src/animichi/infrastructure/ src/animichi/clients/
        uv run --no-build --no-sync python -m pytest src/animichi/tests/unit/ -v --no-cov
        uv run --no-build --no-sync python -c "from animichi.interfaces.fastapi_service import create_fastapi_app; print('fastapi OK')"
      working-directory: apps/agent
      shell: bash
    - name: Verify web and Workers upgrade
      run: pnpm run verify:dependabot
      shell: bash
