name: Agent eval
description: Run either the affected L0 trajectory sample or the scheduled L1 suite.
inputs:
  tier:
    description: l0 or l1.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
      with:
        python: "true"
    - name: Install Python
      run: uv python install 3.11
      shell: bash
    - name: Install agent dependencies
      run: uv sync --frozen --all-extras
      working-directory: apps/agent
      shell: bash
    - name: Run affected L0 trajectories
      if: ${{ inputs.tier == 'l0' }}
      env:
        EVAL_MODEL: openai:mimo-v2.5@https://opencode.ai/zen/go/v1
        EVAL_SMOKE: "1"
        EVAL_MAX_CASES: "80"
        AGENT_SVC_DATABASE_URL: postgresql://test:test@localhost:5432/test
      run: uv run --frozen pytest src/animichi/tests/eval/test_agent_eval.py::test_agent_trajectory -v -m integration --no-cov -x
      working-directory: apps/agent
      shell: bash
    - name: Run full L1 trajectories
      if: ${{ inputs.tier == 'l1' }}
      env:
        EVAL_MODEL: openai:mimo-v2.5@https://opencode.ai/zen/go/v1
      run: uv run --frozen pytest src/animichi/tests/eval/test_agent_eval.py::test_agent_trajectory -v -m integration --no-cov -x
      working-directory: apps/agent
      shell: bash
    - name: Run L1 translation eval
      if: ${{ inputs.tier == 'l1' }}
      run: uv run --frozen pytest src/animichi/tests/eval/test_translation.py -v -m integration --no-cov -x
      working-directory: apps/agent
      shell: bash
    - name: Reject unknown eval tier
      if: ${{ inputs.tier != 'l0' && inputs.tier != 'l1' }}
      run: exit 2
      shell: bash
