name: Security tool
description: Run one security check selected by the changed-path plan.
inputs:
  tool:
    description: Security tool identifier.
    required: true
runs:
  using: composite
  steps:
    - name: Reject unknown security tool
      if: ${{ !contains(fromJSON('["codeql-actions", "codeql-javascript", "codeql-python", "trufflehog", "osv", "dependabot-config", "config-read-sets", "release-config", "zizmor", "semgrep", "sqlfluff", "runtime-promotion"]'), inputs.tool) }}
      run: exit 2
      shell: bash
    - name: Initialize selected CodeQL language
      if: ${{ contains(fromJSON('["codeql-actions", "codeql-javascript", "codeql-python"]'), inputs.tool) }}
      uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      with:
        languages: ${{ inputs.tool == 'codeql-actions' && 'actions' || inputs.tool == 'codeql-python' && 'python' || 'javascript-typescript' }}
        build-mode: none
    - name: Analyze selected CodeQL language
      if: ${{ contains(fromJSON('["codeql-actions", "codeql-javascript", "codeql-python"]'), inputs.tool) }}
      uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      with:
        category: ${{ format('/language:{0}', inputs.tool == 'codeql-actions' && 'actions' || inputs.tool == 'codeql-python' && 'python' || 'javascript-typescript') }}
    - name: Scan verified secrets with TruffleHog
      if: ${{ inputs.tool == 'trufflehog' }}
      uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
      with:
        extra_args: --results=verified --only-verified --exclude-detectors=Lob
    - name: Scan lockfiles with OSV
      if: ${{ inputs.tool == 'osv' }}
      uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
      with:
        scan-args: |-
          --recursive
          ./
    - name: Verify Dependabot coverage
      if: ${{ inputs.tool == 'dependabot-config' }}
      run: python3 .github/scripts/test_dependabot_config.py
      shell: bash
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      if: ${{ contains(fromJSON('["config-read-sets", "zizmor"]'), inputs.tool) }}
      with:
        version: "0.11.14"
        enable-cache: false
        prune-cache: "true"
    - name: Verify config read sets
      if: ${{ inputs.tool == 'config-read-sets' }}
      run: uv run --script --locked --no-build .github/scripts/test_config_read_sets.py
      shell: bash
    - uses: ./.github/actions/setup
      if: ${{ contains(fromJSON('["release-config", "semgrep", "sqlfluff"]'), inputs.tool) }}
      with:
        python: ${{ inputs.tool == 'semgrep' || inputs.tool == 'sqlfluff' }}
    - name: Verify public release configuration
      if: ${{ inputs.tool == 'release-config' }}
      run: |
        node .github/scripts/release-web-runtime-config.test.mjs
        node .github/scripts/release-web-runtime-config.mutation.test.mjs
        ruby .github/scripts/test_secret_provisioning_contract.rb
      shell: bash
    - name: Audit Actions with zizmor
      if: ${{ inputs.tool == 'zizmor' }}
      env:
        GH_TOKEN: ${{ github.token }}
        ZIZMOR_VERSION: 1.5.2
      run: uvx --no-build zizmor@"$ZIZMOR_VERSION" --cache-dir ~/.cache/zizmor .
      shell: bash
    - name: Install Semgrep
      if: ${{ inputs.tool == 'semgrep' }}
      run: uv tool install --no-build "semgrep==1.172.0"
      shell: bash
    - name: Run Semgrep
      if: ${{ inputs.tool == 'semgrep' }}
      run: |
        uv tool run --no-build semgrep@1.172.0 --config p/python --config p/typescript --config p/javascript --config .semgrep --error .
        scripts/semgrep-raw-sql-test.sh
      shell: bash
    - name: Install agent dependencies for SQLFluff
      if: ${{ inputs.tool == 'sqlfluff' }}
      run: uv sync --frozen --all-extras --no-build --no-binary-package animichi
      working-directory: apps/agent
      shell: bash
    - name: Lint migrations with SQLFluff
      if: ${{ inputs.tool == 'sqlfluff' }}
      run: uv run --frozen --no-build --no-binary-package animichi sqlfluff lint ../../migrations/neon --dialect postgres --config ../../db/.sqlfluff
      working-directory: apps/agent
      shell: bash
    - name: Verify immutable promotion and runtime secrets
      if: ${{ inputs.tool == 'runtime-promotion' }}
      run: |
        shellcheck .github/scripts/sync-edge-runtime-secrets.sh .github/scripts/promote-release-unit.sh
        python3 .github/scripts/test_edge_runtime_secrets.py
        ruby .github/scripts/test_secret_provisioning_contract.rb
        ruby .github/scripts/test_secret_provisioning_mutation.rb
        bash .github/scripts/test_promote_release_unit.sh
        ruby .github/scripts/test_cd_worker_promotion_contract.rb
        ruby .github/scripts/test_production_safety_contract.rb
        bash .github/scripts/security-aggregate.test.sh
      shell: bash
