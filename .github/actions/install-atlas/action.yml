name: "Install pinned Atlas CLI"
description: "Install the repository-pinned Atlas CLI (v0.30.0 linux/amd64) under $RUNNER_TEMP/atlas-bin and prepend it to GITHUB_PATH. Single source of truth for the pinned version + SHA-256; callers use `uses: ./.github/actions/install-atlas` instead of copying the curl/sha256sum block (AC2, #679). Keep the pinned SHA in sync with apps/agent/src/animichi/tests/atlas_helper.py ATLAS_LINUX_AMD64_SHA256."

inputs:
  version:
    description: "Atlas CLI release version to install"
    required: false
    default: "0.30.0"
  sha256:
    description: "SHA-256 of the linux/amd64 atlas binary for this version"
    required: false
    default: "dbaaf350634304d4bf92753559261a67afb399fe4ff0ea6ae5bb5d1ce6e0011a"

runs:
  using: "composite"
  steps:
    - name: Install pinned Atlas CLI
      shell: bash
      env:
        ATLAS_VERSION: ${{ inputs.version }}
        ATLAS_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/atlas-bin"
        curl --proto '=https' --tlsv1.2 -sSfL \
          "https://release.ariga.io/atlas/atlas-community-linux-amd64-v${ATLAS_VERSION}" \
          -o "$RUNNER_TEMP/atlas-bin/atlas"
        echo "${ATLAS_SHA256}  $RUNNER_TEMP/atlas-bin/atlas" | sha256sum --check --strict
        chmod +x "$RUNNER_TEMP/atlas-bin/atlas"
    - name: Add atlas-bin to PATH
      shell: python
      run: |
        import os
        path = os.path.join(os.environ["RUNNER_TEMP"], "atlas-bin")
        with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as f:
            f.write(path + "\n")
