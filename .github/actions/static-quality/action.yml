name: Static quality
description: Run the repository's canonical workflow and policy contracts.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
      with:
        python: "true"
    - name: Install pinned actionlint
      run: |
        set -euo pipefail
        version="1.7.7"
        archive="actionlint_${version}_linux_amd64.tar.gz"
        checksums="actionlint_${version}_checksums.txt"
        base="https://github.com/rhysd/actionlint/releases/download/v${version}"
        curl -sSfL --proto '=https' --proto-redir '=https' -o "$archive" "$base/$archive"
        curl -sSfL --proto '=https' --proto-redir '=https' -o "$checksums" "$base/$checksums"
        grep -F "  $archive" "$checksums" > actionlint.sha256
        sha256sum -c actionlint.sha256
        tar -xzf "$archive" actionlint
        chmod +x actionlint
      shell: bash
    - name: Run canonical static quality gate
      env:
        ACTIONLINT_BIN: ./actionlint
      run: bash scripts/local-gates/quality.sh
      shell: bash
