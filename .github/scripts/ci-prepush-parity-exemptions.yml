# CI checkpoints that pre-push does not run. Every entry needs a structured
# reason: `<class>: <CI-only resource> — …` with class one of
# secrets / OIDC / cloud / deploy. Identity is a discovered fingerprint
# (script/cmd/uses), not a job name.
exemptions:
  - id: cmd:e2e::pnpm exec playwright test
    reason: "cloud: CI-built worker artifact — Playwright browsers against the emitted Worker"
  - id: cmd:docker build -f apps/agent/Dockerfile -t $image .
    reason: "deploy: immutable main-SHA container artifact — CD-only tagged build"
  - id: cmd:docker build -f workers/migrator/Dockerfile -t $image .
    reason: "deploy: immutable main-SHA migrator artifact — CD-only tagged build"
  - id: cmd:docker save $image > $out/image.tar
    reason: "deploy: release artifact envelope — CD-only OCI export"
  - id: cmd:git archive $SOURCE_SHA infra | tar -x -C $out
    reason: "deploy: sealed Pulumi source artifact — CD-only export"
  - id: cmd:pnpm exec wrangler deploy -c $RUNNER_TEMP/edge.toml --dry-run -e production
    reason: "deploy: immutable edge release bundle — CD-only packaging"
  - id: cmd:pnpm exec wrangler deploy -c $RUNNER_TEMP/migrator.toml --dry-run -e staging
    reason: "deploy: immutable migrator release bundle — CD-only packaging"
  - id: cmd:pnpm exec wrangler deploy -c workers/$RELEASE_UNIT/wrangler.toml --dry-run -e production
    reason: "deploy: immutable affected production Worker bundle — CD-only packaging"
  - id: cmd:web::pnpm build
    reason: "deploy: sealed web .output artifact — CD-only release build"
  - id: cmd:uv tool run semgrep@1.172.0 --config p/python --config p/typescript --config p/javascript --config .semgrep --error .
    reason: "cloud: Semgrep registry (p/python, p/typescript, p/javascript)"
  - id: cmd:uvx zizmor@$ZIZMOR_VERSION --cache-dir ~/.cache/zizmor .
    reason: "secrets: GH_TOKEN — zizmor impostor-commit GitHub API audit"
  - id: script:.github/scripts/download-release-cohort.sh
    reason: "deploy: main-SHA release artifacts — CD-only cohort materialisation via the artifact API"
  - id: script:.github/scripts/cd-cohort-plan.py
    reason: "deploy: main-push release routing — CD-only affected cohort"
  - id: script:.github/scripts/change-plan.py
    reason: "deploy: main before..SHA range — CD-only release routing"
  - id: script:.github/scripts/promote-release-unit.sh
    reason: "deploy: staging/production credentials — immutable promotion adapter"
  - id: script:.github/scripts/staging-smoke-check.sh
    reason: "cloud: live staging.animichi.com — post-deploy verification against the deployed environment; behavior is covered locally by staging-smoke-check.test.sh"
  - id: script:.github/scripts/resolve-cd-base.sh
    reason: "cloud: GitHub Actions run history and current main ref — durable CD range base"
  - id: uses:codecov/codecov-action
    reason: "OIDC: codecov-action — coverage upload authenticates with GitHub OIDC"
  - id: uses:pulumi/auth-actions
    reason: "OIDC: GitHub id-token — CD exchanges the job's OIDC identity for a short-lived Pulumi Cloud organization token (#1077); a workstation uses its own `pulumi login`"
  - id: uses:github/codeql-action/analyze
    reason: "cloud: GitHub-hosted CodeQL runners — analyze"
  - id: uses:github/codeql-action/init
    reason: "cloud: GitHub-hosted CodeQL runners — init"
  - id: uses:google/osv-scanner-action/osv-scanner-action
    reason: "cloud: live OSV vulnerability API — osv-scanner-action"
  - id: uses:docker://ghcr.io/gitleaks/gitleaks:v8.24.3
    reason: "cloud: pinned Gitleaks container — GitHub-hosted runner"
  - id: uses:trufflesecurity/trufflehog
    reason: "cloud: TruffleHog verified-secret detectors — live APIs"
