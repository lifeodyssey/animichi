# CI checkpoints that pre-push does not run. Every entry needs a structured
# reason: `<class>: <CI-only resource> — …` with class one of
# secrets / OIDC / cloud / deploy. Identity is a discovered fingerprint
# (script/cmd/uses), not a job name.
exemptions:
  - id: cmd:$BUILD_FILTER::pnpm build
    reason: "deploy: staging/prod deploy path — reusable component build"
  - id: cmd:agent::pytest src/animichi/tests/eval/test_agent_eval.py::test_agent_trajectory integration
    reason: "secrets: ZEN_GO_API_KEY — paid model evals"
  - id: cmd:atlas migrate apply
    reason: "secrets: live Neon DSN — Atlas apply on the deploy/cutover path"
  - id: cmd:e2e::pnpm exec playwright test
    reason: "cloud: CI-built worker artifact — Playwright browsers against the emitted Worker"
  - id: cmd:infra/neon-secrets::pnpm typecheck
    reason: "cloud: terraform-provider kislerdm/neon — neon-secrets tsc needs the generated gitignored Neon SDK"
  - id: cmd:infra/neon-secrets::pulumi preview
    reason: "OIDC: Pulumi Cloud — neon-secrets credentialed preview"
  - id: cmd:infra::pulumi login
    reason: "secrets: production catalog still logs into the R2 DIY backend"
  - id: cmd:infra::pulumi preview
    reason: "OIDC: Pulumi Cloud — credentialed preview"
  - id: cmd:infra::pulumi stack
    reason: "secrets: production catalog still selects/exports R2 DIY state"
  - id: "cmd:python3 $CLI generate --component $TARGET_COMPONENT --source-sha $source_sha --artifact $artifact --sbom-format cyclonedx-1.5 --sbom-digest $digest --schema-provider atlas --schema-head 20260811000002 --schema-digest $digest --config-version 1 --config-commit $source_sha --dep catalog=$source_sha > $manifest"
    reason: "deploy: deploy-path artifact — promotion manifest generation"
  - id: cmd:sudo apt-get install -y postgresql-client
    reason: "cloud: ubuntu-latest runner — postgresql-client for neonctl psql on staging GRANT"
  - id: cmd:sudo apt-get update -qq
    reason: "cloud: ubuntu-latest runner — apt index for postgresql-client on staging GRANT"
  - id: cmd:uv tool run semgrep@$SEMGREP_VERSION --config p/python --config p/typescript --config p/javascript --config .semgrep --error .
    reason: "cloud: Semgrep registry (p/python, p/typescript, p/javascript)"
  - id: cmd:uvx zizmor@$ZIZMOR_VERSION --cache-dir ~/.cache/zizmor .
    reason: "secrets: GH_TOKEN — zizmor impostor-commit GitHub API audit"
  - id: script:.github/scripts/edge-showcase-mode.sh
    reason: "deploy: live worker environment — showcase-mode read on the post-deploy path"
  - id: script:.github/scripts/inject-web-runtime-config.mjs
    reason: "deploy: deploy-artifact — runtime-config injection"
  - id: script:.github/scripts/neon-secrets-adopt.sh
    reason: "secrets: Neon role DSNs — Cloudflare secrets store adoption"
  - id: script:.github/scripts/post-deploy-assert.sh
    reason: "deploy: live worker URL — post-deploy smoke against the deployed origin"
  - id: script:.github/scripts/promote_deployed.py
    reason: "deploy: platform deployed-version metadata — deploy credentials"
  - id: script:.github/scripts/request-github-oidc-token.sh
    reason: "OIDC: ACTIONS_ID_TOKEN_REQUEST_TOKEN — GitHub Actions OIDC mint for doorbell rings"
  - id: script:.github/scripts/release-eligibility.sh
    reason: "deploy: production eligibility — pinned revision gate"
  - id: script:.github/scripts/release-promotion-selfcheck.sh
    reason: "deploy: production promotion self-check"
  - id: script:.github/scripts/resolve-worker-url.sh
    reason: "deploy: Cloudflare API — resolve the deployed worker URL"
  - id: script:.github/scripts/vite-env-preflight.sh
    reason: "deploy: production VITE_* build env — secret-shape preflight on the deploy path"
  - id: script:.github/scripts/wrangler-secret-put.sh
    reason: "deploy: Cloudflare Worker secrets — wrangler secret put on the deploy path"
  - id: script:infra/neon-secrets/grant-migrator-ddl.sh
    reason: "secrets: NEON_API_KEY — staging-only owner GRANT on live Neon public schema"
  - id: script:scripts/local-gates/pr-review-check.sh
    reason: "secrets: GITHUB_TOKEN — PR review threads and statuses"
  - id: script:scripts/local-gates/pr-review-gate-step.sh
    reason: "secrets: GITHUB_TOKEN — PR head pin and review-gate status"
  - id: script:scripts/migration-head.sh
    reason: "secrets: live Atlas/Neon migration head"
  - id: script:scripts/vet-openapi.ts
    reason: "cloud: GitHub PR/merge-group base SHA — published-contract baseline"
  - id: uses:cloudflare/wrangler-action
    reason: "deploy: cloudflare/wrangler-action — ships workers to Cloudflare"
  - id: uses:codecov/codecov-action
    reason: "OIDC: codecov-action — coverage upload authenticates with GitHub OIDC"
  - id: uses:github/codeql-action/analyze
    reason: "cloud: GitHub-hosted CodeQL runners — analyze"
  - id: uses:github/codeql-action/init
    reason: "cloud: GitHub-hosted CodeQL runners — init"
  - id: uses:gitleaks/gitleaks-action
    reason: "secrets: GITHUB_TOKEN / GITLEAKS_LICENSE — gitleaks-action"
  - id: uses:google/osv-scanner-action/osv-scanner-action
    reason: "cloud: live OSV vulnerability API — osv-scanner-action"
  - id: uses:pulumi/actions
    reason: "deploy: pulumi/actions — deploy-path apply"
  - id: uses:pulumi/auth-actions
    reason: "OIDC: pulumi/auth-actions — GitHub OIDC exchange for Pulumi Cloud"
  - id: uses:pypa/gh-action-pip-audit
    reason: "cloud: pypa/gh-action-pip-audit — GitHub Action queries the live PyPI/OSV advisory API"
  - id: uses:trufflesecurity/trufflehog
    reason: "cloud: TruffleHog verified-secret detectors — live APIs"
