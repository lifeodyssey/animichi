# Migrator pipeline (S0-v2 B4, CI-1 union method): the workers/migrator suite
# lives in this lane like every other package. pull_request is pathless by
# design (merge_group runs ignore path filters); push paths are the read
# closure — the migrator worker reads @animichi/contract/oidc-github, and the
# bundled wrangler deploy is what actually ships the batch container.
name: pipeline-migrator

on:
  pull_request:
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/pipeline-migrator.yml"
      - ".oxlintrc.json"
      - "workers/migrator/**"
      - "migrations/neon/**"
      - "packages/contract/src/oidc-github.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Migrator / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-ci
        with:
          working-directory: workers/migrator
          lint-command: pnpm exec tsc --noEmit && pnpm run lint:oxlint

  test:
    name: Migrator / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-ci
        with:
          working-directory: workers/migrator
          test-command: pnpm run test

  build:
    name: Migrator / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Compile check without deploying (deploy is staging-CI only, gate
      # block-local-deploy). wrangler deploy --dry-run bundles the source and
      # validates the wrangler.toml + container wiring.
      - name: Bundle + config check (wrangler deploy dry-run)
        working-directory: workers/migrator
        run: pnpm exec wrangler deploy --dry-run --env=staging --outdir "$RUNNER_TEMP/migrator-bundle"
