name: _security
# Reusable cross-language security lane selected by pr-verification.yml.
on:
  workflow_call:
    inputs:
      expected_sha:
        description: "The commit SHA the caller is aggregating"
        required: true
        type: string

permissions:
  contents: read
jobs:
  codeql:
    timeout-minutes: 20
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"

  gitleaks:
    timeout-minutes: 15
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/secret-scan
        with:
          event-name: ${{ github.event_name }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

  trufflehog:
    timeout-minutes: 15
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # Lob misclassifies the repo's 35+-character test names as API keys.
          extra_args: --results=verified --only-verified --exclude-detectors=Lob
  osv-scanner:
    timeout-minutes: 15
    name: osv-scanner (lockfile CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

  dependabot-config:
    timeout-minutes: 15
    name: Dependabot pnpm coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pnpm lockfile domains stay covered
        run: python3 .github/scripts/test_dependabot_config.py

  config-read-sets:
    timeout-minutes: 5
    name: Config check read-set trigger coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          enable-cache: false
          prune-cache: true
      - name: Verify config checks run for every file they read
        run: uv run --script --locked --no-build .github/scripts/test_config_read_sets.py

  release-config-security:
    timeout-minutes: 10
    name: Release config rejects secret-shaped public values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify release config behavior and mutations
        run: |
          node .github/scripts/release-web-runtime-config.test.mjs
          node .github/scripts/release-web-runtime-config.mutation.test.mjs
          ruby .github/scripts/test_secret_provisioning_contract.rb

  zizmor:
    timeout-minutes: 15
    name: zizmor (GHA security)
    runs-on: ubuntu-latest
    env:
      ZIZMOR_VERSION: 1.5.2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PRs only restore this cache; trusted main pushes are its sole writers.
      - name: Restore zizmor audit cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zizmor
          key: zizmor-${{ runner.os }}-${{ env.ZIZMOR_VERSION }}-${{ hashFiles('.github/workflows/*.yml', '.github/actions/**') }}
          restore-keys: zizmor-${{ runner.os }}-${{ env.ZIZMOR_VERSION }}-
      - name: Install zizmor
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          enable-cache: false
          prune-cache: true
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-build zizmor@"$ZIZMOR_VERSION" --cache-dir ~/.cache/zizmor .
      - name: Save zizmor audit cache
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zizmor
          key: zizmor-${{ runner.os }}-${{ env.ZIZMOR_VERSION }}-${{ hashFiles('.github/workflows/*.yml', '.github/actions/**') }}

  semgrep:
    timeout-minutes: 15
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    env:
      SEMGREP_VERSION: "1.172.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - name: Install Semgrep
        run: uv tool install --no-build "semgrep==$SEMGREP_VERSION"
        shell: bash
      - name: Run Semgrep
        run: uv tool run --no-build semgrep@"$SEMGREP_VERSION" --config p/python --config p/typescript --config p/javascript --config .semgrep --error . # v1.172.0
        shell: bash
      - name: Verify raw-SQL ruleset self-test
        run: scripts/semgrep-raw-sql-test.sh
        shell: bash
  sqlfluff:
    timeout-minutes: 15
    name: sqlfluff (SQL lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - run: uv sync --frozen --all-extras --no-build --no-binary-package animichi
      - name: Lint migrations (postgres dialect)
        run: uv run --frozen --no-build --no-binary-package animichi sqlfluff lint ../../migrations/neon --dialect postgres --config ../../db/.sqlfluff
  runtime-promotion-security:
    timeout-minutes: 15
    name: immutable promotion and runtime secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runtime secret and immutable promotion behavior
        run: |
          shellcheck .github/scripts/sync-edge-runtime-secrets.sh .github/scripts/promote-release-unit.sh
          python3 .github/scripts/test_edge_runtime_secrets.py
          ruby .github/scripts/test_secret_provisioning_contract.rb
          ruby .github/scripts/test_secret_provisioning_mutation.rb
          bash .github/scripts/test_promote_release_unit.sh
          ruby .github/scripts/test_cd_worker_promotion_contract.rb
          ruby .github/scripts/test_production_safety_contract.rb
          bash .github/scripts/security-aggregate.test.sh
        shell: bash

  security-summary:
    timeout-minutes: 5
    name: security summary
    needs:
      - codeql
      - gitleaks
      - trufflehog
      - osv-scanner
      - dependabot-config
      - config-read-sets
      - release-config-security
      - zizmor
      - semgrep
      - sqlfluff
      - runtime-promotion-security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the aggregated head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the fail-closed aggregate
        run: |
          shellcheck .github/scripts/security-aggregate.sh .github/scripts/security-aggregate.test.sh
          bash .github/scripts/security-aggregate.test.sh
        shell: bash
      - name: Verify every scan and head
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          SECURITY_RESULT: success
          REQUIRE_CHILD_RESULTS: "true"
          SECURITY_RESULTS: |-
            codeql=${{ needs.codeql.result }}
            gitleaks=${{ needs.gitleaks.result }}
            trufflehog=${{ needs.trufflehog.result }}
            osv-scanner=${{ needs.osv-scanner.result }}
            dependabot-config=${{ needs.dependabot-config.result }}
            config-read-sets=${{ needs.config-read-sets.result }}
            release-config-security=${{ needs.release-config-security.result }}
            zizmor=${{ needs.zizmor.result }}
            semgrep=${{ needs.semgrep.result }}
            sqlfluff=${{ needs.sqlfluff.result }}
            runtime-promotion-security=${{ needs.runtime-promotion-security.result }}
        run: bash .github/scripts/security-aggregate.sh
