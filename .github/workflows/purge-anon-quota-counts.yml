# Standalone top-level workflow (see .claude/rules/ci.md: codeql.yml / dependabot-agent.yml
# precedent, mirrored from agent-eval-nightly.yml) — kept separate from ci.yml so this cron
# never rides along with every push/PR trigger in the main CI matrix.
name: Purge anon_daily_message_count (retention)

# Issue #282 review: anon_daily_message_count is a pure per-day aggregate counter with no
# dependent rows, so its retention policy is a nightly age-based DELETE, not a per-row purge
# with an FK backstop (contrast the anonymous-session purge precedent).
on:
  schedule:
    - cron: "37 19 * * *" # 19:37 UTC daily — off-hour, distinct minute from the eval nightly
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report eligible rows without deleting"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: purge-anon-quota-counts
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  purge:
    name: Purge stale per-identity quota counters
    runs-on: ubuntu-latest
    # This job holds a real secret (SUPABASE_DB_URL) — bound generously in
    # case of a hung connection pool, mirroring the anonymous-session precedent.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Purge rows past the retention window
        # The script writes "anon-quota-count purge: eligible|removed=N" to
        # $GITHUB_STEP_SUMMARY (agent.scripts.purge_anon_quota_counts._write_step_summary)
        # — GitHub Actions sets that path for every step automatically.
        run: |
          uv run --frozen python -m agent.scripts.purge_anon_quota_counts \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}
        env:
          # `anon_daily_message_count` (like `sessions`/`conversations`) is
          # read through the app's single shared connection pool
          # (`SupabaseClient`, wired from `settings.supabase_db_url`) — the
          # exact same DSN the anonymous-session purge uses. Previously this
          # read `secrets.NEON_DATABASE_URL` instead, a different secret than
          # the one the live app and its Atlas-migrated schema actually use
          # (issue #508 review round 2).
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
