# Reusable workflow (called by ci.yml; not triggered directly). '_' prefix = internal.
name: _ts-ci

# Reusable TypeScript Worker CI: tsc + strict type-aware oxlint + vitest.
# Called by ci.yml orchestrator. component = worker dir under workers/.

on:
  workflow_call:
    inputs:
      component:
        description: "Worker directory under workers/ to run CI against"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ts-ci:
    timeout-minutes: 20
    name: TS CI
    runs-on: ubuntu-latest
    # Codecov OIDC upload needs id-token: write; job-scoped so the workflow
    # default stays contents: read (S0-v2 B7 "permissions" assertion).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `./.github/actions/setup`'s `pnpm install` already resolves and links
      # packages/contract (workspace:* dep of every workers/* component) —
      # no separate install needed here. A prior `npm install` step in
      # packages/contract was redundant AND uncovered by Dependabot (only
      # "/" and "/infra" are registered npm ecosystems), so removed rather
      # than papering over it with a second, unmaintained lockfile.
      - uses: ./.github/actions/setup

      - name: Type check (tsc)
        run: pnpm exec tsc --noEmit
        working-directory: workers/${{ inputs.component }}

      - name: Oxlint (type-aware, strict)
        run: pnpm run lint:oxlint
        working-directory: workers/${{ inputs.component }}

      # TODO(type-coverage): type-coverage is not yet configured for this component.
      # Add `type-coverage --at-least 99 --strict` once a tsconfig + dep are wired.
      # No-op for now so the gate is visible but does not fail the build.
      - name: Type coverage (TODO — not configured)
        run: echo "type-coverage not configured yet; skipping (TODO)"

      - name: Worker tests (vitest, coverage gate)
        run: pnpm run test:worker
        working-directory: workers/${{ inputs.component }}

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: workers/${{ inputs.component }}/coverage/lcov.info
          flags: ${{ inputs.component }}
          fail_ci_if_error: true
          use_oidc: true
