# TEMPORARY diagnostic workflow for issue #527 — DO NOT MERGE AS-IS.
# Empirically determines, from a real workflow run (not documentation
# inference), how `secrets.<NAME>` resolves in four contexts:
#   1. A caller job with NO `environment:` (what ci.yml's deploy-* jobs are
#      today — cannot declare `environment:` because they `uses:` a
#      reusable workflow).
#   2. A plain job with `environment: staging` and no reusable-workflow
#      boundary at all (the textbook case environment secrets are built for).
#   3. A reusable-workflow job with job-level `environment: staging` AND
#      named `secrets:` passed explicitly from the caller (today's
#      _deploy-component.yml shape).
#   4. The same reusable-workflow + `environment: staging` shape, but the
#      caller uses `secrets: inherit` instead of naming secrets.
#
# Prints ONLY booleans (`!= ''`) and value lengths — never the secret value
# itself. Delete this workflow (and the two _diag-527-called*.yml files)
# once #527 is resolved.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case-1-caller-no-environment:
    name: "Case 1: caller job, no environment"
    runs-on: ubuntu-latest
    steps:
      - name: Report resolved secret shape (booleans/lengths only)
        env:
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          echo "case=caller-no-environment"
          echo "  NEON_AUTH_JWKS_URL   set=$([ -n "$NEON_AUTH_JWKS_URL" ] && echo true || echo false) len=${#NEON_AUTH_JWKS_URL}"
          echo "  CORS_ALLOWED_ORIGIN  set=$([ -n "$CORS_ALLOWED_ORIGIN" ] && echo true || echo false) len=${#CORS_ALLOWED_ORIGIN}"
          echo "  NEON_DATABASE_URL    set=$([ -n "$NEON_DATABASE_URL" ] && echo true || echo false) len=${#NEON_DATABASE_URL}"

  case-2-direct-job-environment-staging:
    name: "Case 2: direct job, environment=staging, no reusable-workflow boundary"
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Report resolved secret shape (booleans/lengths only)
        env:
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          echo "case=direct-job-environment-staging"
          echo "  NEON_AUTH_JWKS_URL   set=$([ -n "$NEON_AUTH_JWKS_URL" ] && echo true || echo false) len=${#NEON_AUTH_JWKS_URL}"
          echo "  CORS_ALLOWED_ORIGIN  set=$([ -n "$CORS_ALLOWED_ORIGIN" ] && echo true || echo false) len=${#CORS_ALLOWED_ORIGIN}"
          echo "  NEON_DATABASE_URL    set=$([ -n "$NEON_DATABASE_URL" ] && echo true || echo false) len=${#NEON_DATABASE_URL}"

  case-3-reusable-named-secrets-staging:
    name: "Case 3: reusable workflow, environment=staging, named secrets (today's shape)"
    uses: ./.github/workflows/_diag-527-called.yml
    with:
      environment: staging
    secrets:
      NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
      CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  case-4-reusable-inherit-staging:
    name: "Case 4: reusable workflow, environment=staging, secrets: inherit"
    uses: ./.github/workflows/_diag-527-called-inherit.yml
    with:
      environment: staging
    secrets: inherit
