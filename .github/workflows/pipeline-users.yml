# Users pipeline (S0-v2 B4): the workers/users suite moved out of ci.yml into
# this lane (CI-1 union method). pull_request is pathless by design (merge_group
# runs ignore path filters, so a filtered PR lane would diverge from the queue);
# the push paths carry the read closure: the eddsa-shared-primitive test READS
# packages/contract/src/jwt.ts + workers/edge/auth.ts, so a regression in either
# must re-run this lane (issue #647).
name: pipeline-users

on:
  pull_request:
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/pipeline-users.yml"
      - ".oxlintrc.json"
      - "workers/users/**"
      - "packages/contract/**"
      - "workers/edge/auth.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Users / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-ci
        with:
          working-directory: workers/users
          lint-command: pnpm exec tsc --noEmit && pnpm run lint:oxlint

  test:
    name: Users / test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-ci
        with:
          working-directory: workers/users
          test-command: pnpm run test:worker
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: workers/users/coverage/lcov.info
          flags: users
          fail_ci_if_error: true
          use_oidc: true

  build:
    name: Users / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Bundle check without deploying: the deploy path ships TS source through
      # `wrangler deploy` (bundled server-side), so this dry-run is the build
      # stage's closest hermetic proxy for "the worker still compiles".
      - name: Bundle check (wrangler deploy dry-run)
        run: pnpm exec wrangler deploy --dry-run --env="" --outdir "$RUNNER_TEMP/users-bundle"
        working-directory: workers/users
