name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Affected detection ────────────────────────────────────────

  changes:
    runs-on: ubuntu-latest
    outputs:
      catalog: ${{ steps.f.outputs.catalog }}
      agent: ${{ steps.f.outputs.agent }}
      frontend: ${{ steps.f.outputs.frontend }}
      contract: ${{ steps.f.outputs.contract }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          filters: |
            contract: ['packages/contract/**']
            catalog: ['workers/catalog/**', 'packages/contract/**']
            agent: ['apps/agent/**', 'packages/contract/**']
            frontend: ['frontend/**']

  # ── Stage 1: Component CI (reusable workflows, all parallel) ──
  # affected-only on PRs; full run on push/tag.

  ci-agent:
    name: Agent CI
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.agent == 'true' }}
    uses: ./.github/workflows/_python-ci.yml
    with:
      app: agent
    secrets: inherit

  ci-catalog:
    name: Catalog CI
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.catalog == 'true' }}
    uses: ./.github/workflows/_ts-ci.yml
    with:
      component: catalog
    secrets: inherit

  ci-frontend:
    name: Frontend CI
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/_web-ci.yml
    secrets: inherit

  # ── Security (cross-language; always runs, no affected gate) ──

  security:
    name: Security
    uses: ./.github/workflows/_security.yml
    secrets: inherit

  # ── DB migrations (dry-run) ──────────────────────────────────

  db-validate:
    name: DB Migrations (dry-run)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.catalog == 'true' || needs.changes.outputs.agent == 'true' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Validate migrations
        if: env.SUPABASE_DB_URL != ''
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

  # ── Agent eval (deferred — see `&& false`) ───────────────────

  agent-eval:
    name: Agent Eval (546 cases)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.agent == 'true') && false }}
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
        with:
          python: "true"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - run: uv sync --all-extras

      - name: Run agent eval
        run: uv run pytest agent/tests/eval/test_agent_eval.py -v -m integration --no-cov -x
        env:
          EVAL_MODEL: openai:deepseek-v4-pro@https://api.deepseek.com
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Run translation eval
        run: uv run pytest agent/tests/eval/test_translation.py -v -m integration --no-cov -x
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # ── Stage 3: Deploy (tag-triggered, all CI green) ────────────
  # TODO(Wave 5): migrate to _deploy-component.yml + deploy-needs-gate.

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci-agent, ci-catalog, ci-frontend, security, db-validate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      actions: read
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Apply database migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Deploy the catalog Worker FIRST: the main worker's [[services]] binding
      # (service = "catalog") only resolves once the catalog service exists.
      # The catalog Worker reaches Postgres via its [[hyperdrive]] binding in
      # prod; until that is provisioned, set DATABASE_URL with
      # `wrangler secret put DATABASE_URL` (add it to the `secrets:` block below).
      - uses: ./.github/actions/setup

      - name: Deploy catalog Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.79.0"
          workingDirectory: workers/catalog
          command: deploy
          # Catalog reaches Postgres via env.DATABASE_URL until a [[hyperdrive]]
          # binding is provisioned (src/index.ts falls back to DATABASE_URL).
          # Sourced from the existing SUPABASE_DB_URL secret.
          secrets: |
            DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy via Wrangler (edge + container)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.79.0"
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_DB_URL
            GEMINI_API_KEY
            ZETA_API_KEY
            OPENAI_COMPAT_BASE_URL
            OPENAI_COMPAT_API_KEY
            GOOGLE_MAPS_API_KEY
            LOGFIRE_TOKEN
            CORS_ALLOWED_ORIGIN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZETA_API_KEY: ${{ secrets.ZETA_API_KEY }}
          OPENAI_COMPAT_BASE_URL: ${{ vars.OPENAI_COMPAT_BASE_URL || 'https://api.univibe.cc/openai' }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}

  # ── Stage 4: Post-deploy smoke test (after successful deploy) ──

  smoke-test:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
        with:
          python: "true"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - run: uv sync --all-extras

      - name: Run E2E smoke tests
        run: >-
          uv run pytest
          agent/tests/integration/test_e2e_smoke.py
          agent/tests/integration/test_frontend_contracts.py
          -v --no-cov
        env:
          SEICHI_API_URL: ${{ secrets.SEICHI_API_URL }}
          SEICHI_API_KEY: ${{ secrets.SEICHI_API_KEY }}
