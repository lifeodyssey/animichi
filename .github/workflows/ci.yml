# Neon-backed test jobs are non-gating and stay outside every deploy `needs:` chain.
# Promote only after 10 consecutive greens on main-bound PRs; quota-class failures
# are excluded from the streak but tracked separately (the agnix precedent below).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # The six stable lanes below are branch-protection required contexts; a
  # merge queue waits on them, so they must also run on the queue's
  # temporary merge commit or a queued PR pends forever (S0-v2 B7).
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Scopes beyond contents: read live at job level (S0-v2 B7 "permissions"
  # assertion, ci.md "Least privilege"): the security job declares its own
  # `pull-requests: read`, as do the step-level dorny/paths-filter users
  # (agent-eval-smoke, python-integration, catalog-spikes).

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One in-flight run per PR: a new push to a PR cancels the previous
# run (wasted work), while pushes to main and queue runs queue instead of
# cancelling so a deploy is never killed mid-flight. Group expression is the
# design-CI-1 template: merge_group.head_ref keeps a PR's PR-run and its
# queue-run in different groups (same-group runs would cancel each other).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ── Stage 1: Cross-stack browser lane (see reusable-cross-stack-e2e.yml) ──
  # The component CI lanes moved out of this workflow into their own
  # pipeline-*.yml files (CI-1 union method, S0-v2 B4); the changes aggregation
  # job and the gate layer were retired with them. This workflow keeps the
  # non-gating verify lanes (credentialed eval/Neon), the security lane, and
  # the deploy promotion chain; the repo-hygiene checks moved into
  # pipeline-quality.yml (the unfiltered fixed point). Per-lane path gating on
  # PRs is now a step-level dorny filter inside each lane (the cross-workflow
  # tradeoff documented in docs/ops/deployment.md).

  security:
    name: Security
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-security.yml
    # Caller ceiling for the reusable: its gitleaks job declares
    # `pull-requests: read` at job level, and a reusable job cannot request
    # more than the calling job's token grants (zizmor precedent below) —
    # gitleaks lists PR commits via the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Agent eval: L0 smoke (SD-30 §① — report-only PR gate) ──
  # Path-filter scope = the SD-30 rule above (`agent_behavior`): prompt/model-config/
  # guardrail files only. EVAL_SMOKE=1 composes the L0 set explicitly (one case per
  # behavior path, locale-rotated across ja/zh/en, then the remaining budget spent on
  # the P0 trilingual fill — see src/animichi/tests/eval/l0_selection.py) and turns the
  # normally report-only capped run into an enforced one: zero agent-originated errors
  # plus the deterministic direct_gates (thrash), without ever touching the statistical
  # baseline. Provider transport errors are reported but do not gate (#434); the
  # trajectory assertions print every run and enforce under TRAJECTORY_ASSERT=1.
  # The uncapped L1 suite (baseline + statistical gate + translation eval)
  # runs nightly instead of on every PR — see agent-eval-nightly.yml.
  # With the changes aggregation job retired (S0-v2 B4) the gate is a step-level
  # dorny filter; the job itself always runs (report-only, never a required check).

  agent-eval-smoke:
    timeout-minutes: 45
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    name: Agent Eval (L0 smoke, ~80 cases)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On `push`, paths-filter diffs the event's `before` SHA against HEAD using
          # local git (the API listFiles path is pull_request-only), so `before` must
          # be locally reachable; full history keeps the credentials hardening.
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: f
        with:
          filters: |
            agent_behavior: ['apps/agent/src/animichi/agents/**', 'apps/agent/src/animichi/config/model_aliases.py', 'apps/agent/src/animichi/config/settings.py', 'apps/agent/src/animichi/tests/eval/**']
      - uses: ./.github/actions/setup
        with:
          python: "true"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      # --no-build rejected: this project's own editable package has no wheel
      # (see pipeline-agent.yml).
      - run: uv sync --frozen --all-extras

      - name: Run L0 smoke trajectory eval (zero-errored + direct gates)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.agent_behavior == 'true' }}
        run: uv run --frozen pytest src/animichi/tests/eval/test_agent_eval.py::test_agent_trajectory -v -m integration --no-cov -x
        env:
          EVAL_MODEL: openai:mimo-v2.5@https://opencode.ai/zen/go/v1
          ZEN_GO_API_KEY: ${{ secrets.ZEN_GO_API_KEY }}
          EVAL_SMOKE: "1"
          EVAL_MAX_CASES: "80"
          # Settings requires presence; the trajectory tier uses NullDatabase and
          # never opens this endpoint (mirrors the python-integration job).
          SUPABASE_DB_URL: postgresql://test:test@localhost:5432/test

  # ── Neon test infrastructure (non-gating during calibration) ──

  python-integration:
    timeout-minutes: 30
    name: Python integration (Neon)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # codecov OIDC upload needs id-token
    # Same-repo PRs only (fork PRs cannot reach the Neon credentials); push and
    # merge_group runs skip this lane entirely, as they did under the changes job.
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository))
      }}
    concurrency:
      group: neon-tests-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: apps/agent
    env:
      ATLAS_VERSION: "0.30.0"
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      # Settings requires presence; integration tests do not use these endpoints.
      SUPABASE_DB_URL: postgresql://test:test@localhost:5432/test
      MIMO_API_KEY: test-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: f
        with:
          filters: |
            neon_agent: ['apps/agent/**']
            neon_migrations: ['migrations/neon/**']

      - uses: ./.github/actions/setup
        with:
          python: "true"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      # --no-build rejected: this project's own editable package has no wheel
      # (see pipeline-agent.yml).
      - run: uv sync --frozen --all-extras

      - name: Install pinned Atlas CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-bin"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://release.ariga.io/atlas/atlas-community-linux-amd64-v0.30.0" \
            -o "$RUNNER_TEMP/atlas-bin/atlas"
          # Keep synchronized with apps/agent/src/animichi/tests/atlas_helper.py.
          echo "dbaaf350634304d4bf92753559261a67afb399fe4ff0ea6ae5bb5d1ce6e0011a  $RUNNER_TEMP/atlas-bin/atlas" \
            | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/atlas-bin/atlas"
          echo "$RUNNER_TEMP/atlas-bin" >> "$GITHUB_PATH"

      - name: Run Neon integration tests
        if: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.neon_agent == 'true' || steps.f.outputs.neon_migrations == 'true' }}
        env:
          TEST_DB: neon
        # No --cov-fail-under here: the enforced floor belongs to the unit arm
        # (apps/agent/pyproject.toml); the integration arm alone is legitimately
        # far below it. Coverage is uploaded to codecov under the integration flag.
        run: uv run --frozen --no-build --no-binary-package animichi pytest src/animichi/tests/integration -q --cov --cov-report=xml --cov-fail-under=0

      - name: Upload coverage (integration)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.neon_agent == 'true' || steps.f.outputs.neon_migrations == 'true' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/agent/coverage.xml
          fail_ci_if_error: true
          use_oidc: true
          flags: integration

  catalog-spikes:
    timeout-minutes: 30
    name: Catalog spikes (Neon)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    needs: [python-integration]
    if: >-
      ${{
        always() &&
        (needs.python-integration.result == 'success' ||
          needs.python-integration.result == 'skipped') &&
        (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository))
      }}
    concurrency:
      group: neon-tests-${{ github.ref }}
      cancel-in-progress: true
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: f
        with:
          filters: |
            neon_catalog: ['workers/catalog/**']
            neon_migrations: ['migrations/neon/**']

      - uses: ./.github/actions/setup

      - name: Install pinned Atlas CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-bin"
          curl --proto '=https' --tlsv1.2 -sSfL             "https://release.ariga.io/atlas/atlas-community-linux-amd64-v0.30.0"             -o "$RUNNER_TEMP/atlas-bin/atlas"
          # Keep synchronized with apps/agent/src/animichi/tests/atlas_helper.py.
          echo "dbaaf350634304d4bf92753559261a67afb399fe4ff0ea6ae5bb5d1ce6e0011a  $RUNNER_TEMP/atlas-bin/atlas"             | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/atlas-bin/atlas"
          echo "$RUNNER_TEMP/atlas-bin" >> "$GITHUB_PATH"

      - name: Run catalog spike tests
        if: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.neon_catalog == 'true' || steps.f.outputs.neon_migrations == 'true' }}
        run: pnpm run test:spike
        working-directory: workers/catalog

  # ── Cross-stack browser lane ──────────────────────────────────
  # The reusable workflow is intentionally broad and path-gates itself with a
  # step-level dorny filter (PRs that do not touch its scope skip the heavy
  # steps and report green; push/merge_group always run it in full).

  ci-cross-stack-e2e:
    # The reusable's job re-requests `pull-requests: read` at job level (B7
    # least-privilege), and a called workflow's job cannot exceed what the
    # calling job grants — so the caller must state the same scope explicitly
    # rather than relying on this workflow's top-level block.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-cross-stack-e2e.yml
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

  # ── Stage 3: Deploy (security/hygiene gated, push-main promotion path) ──
  # Promotion: push main → CI → staging → post-staging (api) → prod (human gate) → post-prod.
  # A single push to main drives the full pipeline; no separate tag trigger needed.
  # Human approval is enforced by `environment: production` in reusable-deploy-component.yml.
  # The per-package pipeline stages live in their own workflow files, so GitHub
  # cannot express them in `needs:` (the cross-workflow tradeoff documented in
  # docs/ops/deployment.md): protection for merges comes from the required
  # checks in the repository ruleset instead.

  # push main → staging: neon-secrets roles + Secrets Store DSNs must exist
  # BEFORE any Worker deploy consumes them (PR2's wrangler.toml bindings will
  # read the store; #926 CI wiring). Runs first in the staging chain:
  # deploy-staging (catalog) waits on it, so users/maintenance/root cascade
  # behind it. Production has no neon-secrets job: the stack is staging-only
  # today (no Pulumi.prod.yaml, no prod branch roles — #912 follow-up).
  deploy-neon-secrets-staging:
    name: Deploy neon-secrets staging
    needs: [security, ci-cross-stack-e2e]
    # `!failure() && !cancelled()` closes the implicit `success()` that GitHub
    # otherwise prepends: a *skipped* upstream propagates through the always()
    # gates and would silently skip every deploy — the bug that kept staging
    # undeployed for three runs. Gate failures still block: they surface as
    # failure(), not skipped.
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-deploy-neon-secrets.yml
    with:
      environment: staging
      pulumi_stack: staging
    secrets:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    concurrency: deploy-neon-secrets-staging

  # push main → staging
  deploy-staging:
    name: Deploy staging
    needs: [security, ci-cross-stack-e2e, deploy-neon-secrets-staging]
    # `!failure() && !cancelled()` closes the implicit `success()` that GitHub
    # otherwise prepends: a *skipped* upstream (agent-eval-smoke skips on pushes
    # that do not touch agent_behavior paths) propagates through the always()
    # gates and would silently skip every deploy — the bug that kept staging
    # undeployed for three runs. Gate failures still block: they surface as
    # failure(), not skipped.
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: catalog
      environment: staging
      pulumi_stack: staging
      working_directory: workers/catalog
    secrets:
      # #912 PR2: the staging DSN now arrives via the wrangler.toml Secrets
      # Store binding — no DATABASE_URL upload, no CATALOG_DATABASE_URL secret.
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    concurrency: deploy-staging

  deploy-web-staging:
    name: Deploy web staging
    needs: [security, ci-cross-stack-e2e]
    # `!failure() && !cancelled()` closes the implicit `success()` that GitHub
    # otherwise prepends: a *skipped* upstream (agent-eval-smoke skips on pushes
    # that do not touch agent_behavior paths) propagates through the always()
    # gates and would silently skip every deploy — the bug that kept staging
    # undeployed for three runs. Gate failures still block: they surface as
    # failure(), not skipped.
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: web
      environment: staging
      pulumi_stack: staging
      working_directory: apps/web
      build_filter: web
      run_pulumi: false
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # #826: the Smoke step sends this as `x-staging-key` past the staging
      # WAF gate. Must be passed (the name must appear here) for the called
      # workflow's job-level `environment: staging` to resolve its value.
      STAGING_GATE_TOKEN: ${{ secrets.STAGING_GATE_TOKEN }}
    concurrency: deploy-web-staging

  deploy-users-staging:
    name: Deploy users staging
    needs: [deploy-staging]
    # `!failure() && !cancelled()` closes the implicit `success()` that GitHub
    # otherwise prepends: a *skipped* upstream (agent-eval-smoke skips on pushes
    # that do not touch agent_behavior paths) propagates through the always()
    # gates and would silently skip every deploy — the bug that kept staging
    # undeployed for three runs. Gate failures still block: they surface as
    # failure(), not skipped.
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: users
      environment: staging
      pulumi_stack: staging
      working_directory: workers/users
      run_pulumi: false
      worker_secrets: |
        NEON_AUTH_JWKS_URL
    secrets:
      # #912 PR2: the staging DSN now arrives via the wrangler.toml Secrets
      # Store binding — no DATABASE_URL upload, no USERS_DATABASE_URL secret.
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
    concurrency: deploy-users-staging

  deploy-root-staging:
    name: Deploy root staging
    needs: [deploy-staging, deploy-users-staging]
    # `!failure() && !cancelled()` closes the implicit `success()` that GitHub
    # otherwise prepends: a *skipped* upstream (agent-eval-smoke skips on pushes
    # that do not touch agent_behavior paths) propagates through the always()
    # gates and would silently skip every deploy — the bug that kept staging
    # undeployed for three runs. Gate failures still block: they surface as
    # failure(), not skipped.
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: root
      environment: staging
      pulumi_stack: staging
      working_directory: "."
      run_pulumi: false
      # #527/#528 (P1-A): CORS_ALLOWED_ORIGIN is NOT listed here anymore, and
      # this is NOT "staging doesn't need CORS restriction" — that framing
      # was reasoned, not verified, and turned out wrong. It's provisioned
      # instead as `[env.staging.vars].CORS_ALLOWED_ORIGIN` in the edge
      # `workers/edge/wrangler.toml` (see the comment there for the full chain: no
      # wildcard fallback exists, the container hardcodes
      # `APP_ENV=production`, and an absent value reproducibly crashes the
      # container on boot via `settings.py`'s CORS validator — verified
      # locally, not assumed). A plain domain name belongs in `vars`, not a
      # GH secret nobody would think to look for.
      worker_secrets: |
        SUPABASE_URL
        SUPABASE_ANON_KEY
        SUPABASE_SERVICE_ROLE_KEY
        SUPABASE_DB_URL
        MIMO_API_KEY
        DEEPSEEK_API_KEY
        GOOGLE_MAPS_API_KEY
        LOGFIRE_TOKEN
      optional_worker_secrets: ""
      post_deploy_secrets: |
        TURNSTILE_SECRET
        ANON_ID_SECRET
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      ANON_ID_SECRET: ${{ secrets.ANON_ID_SECRET }}
      # #826: the Smoke step sends this as `x-staging-key` past the staging
      # WAF gate. Must be passed (the name must appear here) for the called
      # workflow's job-level `environment: staging` to resolve its value.
      STAGING_GATE_TOKEN: ${{ secrets.STAGING_GATE_TOKEN }}
    concurrency: deploy-root-staging

  post-staging:
    name: Post-deploy (staging)
    needs: [deploy-staging, deploy-web-staging, deploy-users-staging, deploy-root-staging]
    uses: ./.github/workflows/reusable-post-deploy-test.yml
    with:
      environment: staging
      suite: api
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # #826: every assertion step sends this as `x-staging-key` past the
      # staging WAF gate. Must be passed (the name must appear here) for the
      # called workflow's job-level `environment: staging` to resolve its
      # value — #886's "declare nothing, let the environment fill it" fix
      # left the name unfilled and every staging smoke 403'd.
      STAGING_GATE_TOKEN: ${{ secrets.STAGING_GATE_TOKEN }}

  # SAFE-1 (#937): production eligibility gate. Every production job depends on
  # this job and only runs when the candidate (github.sha) is the pinned
  # pre-campaign source revision. A campaign revision therefore records an
  # ineligible no-op here and every production job is skipped before checkout,
  # Atlas, Pulumi, or Wrangler can mutate production.
  production-eligibility:
    name: Production eligibility (SAFE-1)
    needs: post-staging
    uses: ./.github/workflows/reusable-production-eligibility.yml
    with:
      candidate_sha: ${{ github.sha }}
      component: root

  # staging validated → production (human approve via environment: production in
  # reusable-deploy-component.yml). needs: post-staging guarantees staging passed api tests.
  deploy-prod:
    name: Deploy production
    needs: [post-staging, production-eligibility]
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: catalog
      environment: production
      pulumi_stack: prod
      working_directory: workers/catalog
      worker_secrets: DATABASE_URL
    secrets:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    concurrency: deploy-prod

  deploy-web-prod:
    name: Deploy web production
    needs: [post-staging, production-eligibility]
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: web
      environment: production
      pulumi_stack: prod
      working_directory: apps/web
      build_filter: web
      run_pulumi: false
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    concurrency: deploy-web-prod

  deploy-users-prod:
    name: Deploy users production
    needs: [post-staging, production-eligibility, deploy-prod]
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: users
      environment: production
      pulumi_stack: prod
      working_directory: workers/users
      run_pulumi: false
      worker_secrets: |
        DATABASE_URL
        NEON_AUTH_JWKS_URL
    secrets:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
    concurrency: deploy-users-prod

  deploy-maintenance-prod:
    name: Deploy maintenance production
    needs: [post-staging, production-eligibility, deploy-prod]
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: maintenance
      environment: production
      pulumi_stack: prod
      working_directory: workers/jobs
      run_pulumi: false
      worker_secrets: AGENT_DATABASE_URL
    secrets:
      AGENT_DATABASE_URL: ${{ secrets.AGENT_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    concurrency: deploy-maintenance-prod

  deploy-root-prod:
    name: Deploy root production
    needs: [post-staging, production-eligibility, deploy-users-prod]
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: root
      environment: production
      pulumi_stack: prod
      working_directory: "."
      run_pulumi: false
      worker_secrets: |
        SUPABASE_URL
        SUPABASE_ANON_KEY
        SUPABASE_SERVICE_ROLE_KEY
        SUPABASE_DB_URL
        MIMO_API_KEY
        DEEPSEEK_API_KEY
        GOOGLE_MAPS_API_KEY
        LOGFIRE_TOKEN
        CORS_ALLOWED_ORIGIN
      optional_worker_secrets: ""
      post_deploy_secrets: |
        TURNSTILE_SECRET
        ANON_ID_SECRET
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
      CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      ANON_ID_SECRET: ${{ secrets.ANON_ID_SECRET }}
      # #826: passed for parity with deploy-root-staging (the environment-
      # consistency guard requires ci.yml and deploy.yml root jobs to carry
      # the same names). Production has no such environment secret, so the
      # called workflow resolves it empty — expected and fine.
      STAGING_GATE_TOKEN: ${{ secrets.STAGING_GATE_TOKEN }}
    concurrency: deploy-root-prod

  post-prod:
    name: Post-deploy (production)
    needs: [production-eligibility, deploy-prod, deploy-web-prod, deploy-users-prod, deploy-maintenance-prod, deploy-root-prod]
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-post-deploy-test.yml
    with:
      environment: production
      suite: smoke
      expected_source_revision: ${{ needs.production-eligibility.outputs.source_revision }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # STAGING_GATE_TOKEN is deliberately NOT passed here (unlike
      # post-staging): the production environment has no such secret, so the
      # called workflow resolves it empty — expected and fine, the WAF gate
      # ruleset only matches the staging hostname. It is `required: false`
      # in the called workflow precisely to allow this.
