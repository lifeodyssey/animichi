name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Affected detection ────────────────────────────────────────

  changes:
    runs-on: ubuntu-latest
    outputs:
      catalog: ${{ steps.f.outputs.catalog }}
      agent: ${{ steps.f.outputs.agent }}
      frontend: ${{ steps.f.outputs.frontend }}
      web: ${{ steps.f.outputs.web }}
      contract: ${{ steps.f.outputs.contract }}
      worker: ${{ steps.f.outputs.worker }}
      migrations: ${{ steps.f.outputs.migrations }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          filters: |
            contract: ['packages/contract/**']
            catalog: ['workers/catalog/**', 'packages/contract/**']
            agent: ['apps/agent/**', 'packages/contract/**']
            frontend: ['frontend/**']
            web: ['apps/web/**']
            worker: ['worker/**']
            migrations: ['supabase/migrations/**', 'db/**']

  # ── Stage 1: Component CI (reusable workflows, all parallel) ──
  # affected-only on PRs; full run on push/tag.

  ci-agent:
    name: Agent CI
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.agent == 'true' }}
    uses: ./.github/workflows/_python-ci.yml
    with:
      app: agent

  ci-catalog:
    name: Catalog CI
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.catalog == 'true' }}
    uses: ./.github/workflows/_ts-ci.yml
    with:
      component: catalog

  contract-openapi-drift:
    name: Contract OpenAPI drift
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Regenerate contract OpenAPI
        run: pnpm emit:openapi
        working-directory: packages/contract
      - name: Verify committed OpenAPI is current
        run: |
          git add -A packages/contract/openapi.json
          git diff --cached --exit-code -- packages/contract/openapi.json

  ci-frontend:
    name: Frontend CI
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/_web-ci.yml
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

  ci-web:
    name: Web app CI
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.web == 'true' }}
    uses: ./.github/workflows/_webapp-ci.yml

  ci-worker:
    name: Edge worker tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.worker == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run test:worker

  # ── Security (cross-language; always runs, no affected gate) ──

  security:
    name: Security
    uses: ./.github/workflows/_security.yml
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Agent-config lint (agnix, warn-only) ─────────────────────
  # Non-blocking drift gate for CLAUDE.md / AGENTS.md / .claude/rules / hooks / MCP.
  # `continue-on-error` is an intentional warn-only gate policy (not a code-quality
  # suppression): it surfaces context-doc rot without failing CI. Kept out of the
  # deploy `needs:` chain so it never gates a release. Promote to blocking once proven.

  agnix:
    name: Agent config lint (agnix, warn-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Lint AI agent configs
        run: npx --yes agnix@0.37.5 .

  # ── DB migrations (dry-run) ──────────────────────────────────

  db-validate:
    name: DB Migrations (dry-run)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.migrations == 'true' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.26.9"

      - name: Validate migrations
        if: env.SUPABASE_DB_URL != ''
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

  # ── Agent eval (deferred — see `&& false`) ───────────────────

  agent-eval:
    name: Agent Eval (546 cases)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.agent == 'true') && false }}
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - run: uv sync --all-extras

      - name: Run agent eval
        run: uv run pytest agent/tests/eval/test_agent_eval.py -v -m integration --no-cov -x
        env:
          EVAL_MODEL: openai:deepseek-v4-pro@https://api.deepseek.com
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Run translation eval
        run: uv run pytest agent/tests/eval/test_translation.py -v -m integration --no-cov -x
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # ── Stage 3: Deploy (CI-green gated, push-main promotion path) ──
  # Promotion: push main → CI → staging → post-staging (api) → prod (human gate) → post-prod.
  # A single push to main drives the full pipeline; no separate tag trigger needed.
  # Human approval is enforced by `environment: production` in _deploy-component.yml.

  # push main → staging
  deploy-staging:
    name: Deploy staging
    needs: [ci-agent, ci-catalog, ci-frontend, ci-worker, db-validate, security]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/_deploy-component.yml
    with:
      component: catalog
      environment: staging
      pulumi_stack: staging
    secrets:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    concurrency: deploy-staging

  post-staging:
    name: Post-deploy (staging)
    needs: deploy-staging
    uses: ./.github/workflows/_post-deploy-test.yml
    with:
      environment: staging
      suite: api

  # staging validated → production (human approve via environment: production in
  # _deploy-component.yml). needs: post-staging guarantees staging passed api tests.
  deploy-prod:
    name: Deploy production
    needs: post-staging
    uses: ./.github/workflows/_deploy-component.yml
    with:
      component: catalog
      environment: production
      pulumi_stack: prod
    secrets:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    concurrency: deploy-prod

  post-prod:
    name: Post-deploy (production)
    needs: deploy-prod
    uses: ./.github/workflows/_post-deploy-test.yml
    with:
      environment: production
      suite: smoke
