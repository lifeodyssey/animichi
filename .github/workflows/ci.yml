name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Affected detection ────────────────────────────────────────

  changes:
    runs-on: ubuntu-latest
    outputs:
      catalog: ${{ steps.f.outputs.catalog }}
      agent: ${{ steps.f.outputs.agent }}
      frontend: ${{ steps.f.outputs.frontend }}
      contract: ${{ steps.f.outputs.contract }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          filters: |
            contract: ['packages/contract/**']
            catalog: ['workers/catalog/**', 'packages/contract/**']
            agent: ['apps/agent/**', 'packages/contract/**']
            frontend: ['frontend/**']

  # ── Stage 1: Component CI (reusable workflows, all parallel) ──
  # affected-only on PRs; full run on push/tag.

  ci-agent:
    name: Agent CI
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.agent == 'true' }}
    uses: ./.github/workflows/_python-ci.yml
    with:
      app: agent
    secrets: inherit

  ci-catalog:
    name: Catalog CI
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.catalog == 'true' }}
    uses: ./.github/workflows/_ts-ci.yml
    with:
      component: catalog
    secrets: inherit

  ci-frontend:
    name: Frontend CI
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/_web-ci.yml
    secrets: inherit

  # ── Security (cross-language; always runs, no affected gate) ──

  security:
    name: Security
    uses: ./.github/workflows/_security.yml
    secrets: inherit

  # ── DB migrations (dry-run) ──────────────────────────────────

  db-validate:
    name: DB Migrations (dry-run)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.catalog == 'true' || needs.changes.outputs.agent == 'true' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.26.9"

      - name: Validate migrations
        if: env.SUPABASE_DB_URL != ''
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

  # ── Agent eval (deferred — see `&& false`) ───────────────────

  agent-eval:
    name: Agent Eval (546 cases)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.agent == 'true') && false }}
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
        with:
          python: "true"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - run: uv sync --all-extras

      - name: Run agent eval
        run: uv run pytest agent/tests/eval/test_agent_eval.py -v -m integration --no-cov -x
        env:
          EVAL_MODEL: openai:deepseek-v4-pro@https://api.deepseek.com
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Run translation eval
        run: uv run pytest agent/tests/eval/test_translation.py -v -m integration --no-cov -x
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # ── Stage 3: Deploy (CI-green gated, single-workflow needs gate) ──
  # All CI jobs are in `needs:` so CI-green gates CD. cd-staging.yml and
  # cd-prod.yml are deleted — their function lives here now.

  # push main → staging
  deploy-staging:
    name: Deploy staging
    needs: [ci-agent, ci-catalog, ci-frontend, db-validate, security]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/_deploy-component.yml
    with:
      component: catalog
      environment: staging
      pulumi_stack: staging
    secrets: inherit
    concurrency: deploy-staging

  post-staging:
    name: Post-deploy (staging)
    needs: deploy-staging
    uses: ./.github/workflows/_post-deploy-test.yml
    with:
      environment: staging
      suite: api
    secrets: inherit

  # tag v* → production (human approve via environment: production in
  # _deploy-component.yml)
  deploy-prod:
    name: Deploy production
    needs: [ci-agent, ci-catalog, ci-frontend, db-validate, security]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/_deploy-component.yml
    with:
      component: catalog
      environment: production
      pulumi_stack: prod
    secrets: inherit
    concurrency: deploy-prod

  post-prod:
    name: Post-deploy (production)
    needs: deploy-prod
    uses: ./.github/workflows/_post-deploy-test.yml
    with:
      environment: production
      suite: smoke
    secrets: inherit
