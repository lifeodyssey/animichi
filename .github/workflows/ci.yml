name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ── Stage 1: Quality Gates (all parallel) ────────────────────

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - run: uv sync --all-extras

      - name: Format check
        run: uv run ruff format --check agent/

      - name: Lint
        run: uv run ruff check agent/

      - name: Type check
        run: uv run mypy agent/agents/ agent/interfaces/ agent/domain/ agent/infrastructure/ agent/clients/

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint
        working-directory: frontend

      - name: Type check
        run: pnpm exec tsc --noEmit
        working-directory: frontend

  db-validate:
    name: DB Migrations (dry-run)
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Validate migrations
        if: env.SUPABASE_DB_URL != ''
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

  catalog-quality:
    name: Catalog Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit
        working-directory: workers/catalog

      - name: Worker tests (no-db)
        run: pnpm run test:worker
        working-directory: workers/catalog

  # ── Stage 2: Tests + Build (parallel, gated by Stage 1) ───

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-quality
    defaults:
      run:
        working-directory: apps/agent
    env:
      SUPABASE_DB_URL: "postgresql://postgres:postgres@localhost:54322/postgres"
      DEEPSEEK_API_KEY: "test-key"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - run: uv sync --all-extras

      - name: Unit tests (coverage >= 80%)
        run: uv run pytest agent/tests/unit/ -v --cov --cov-report=xml --cov-fail-under=80

      - name: Integration tests (testcontainer)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          uv run pytest agent/tests/integration/ -v --no-cov
          -k "not test_frontend_contracts and not test_e2e_smoke"
        env:
          ZETA_API_KEY: ${{ secrets.ZETA_API_KEY }}

      - name: Verify imports
        run: |
          uv run python -c "from agent.interfaces.fastapi_service import create_fastapi_app; print('fastapi OK')"
          uv run python -c "from agent.domain.entities import Point; print('domain OK')"
          uv run python -c "from agent.agents.pilgrimage_runner import run_pilgrimage_agent; print('pilgrimage_agent OK')"

      - name: Upload coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          files: apps/agent/coverage.xml
          fail_ci_if_error: false

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-quality
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Unit tests (coverage gate)
        run: pnpm exec vitest run --coverage
        working-directory: frontend

      - name: Upload coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-quality
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 1

  agent-eval:
    name: Agent Eval (546 cases)
    runs-on: ubuntu-latest
    needs: backend-quality
    # Disabled: costs ~$10/run. Enable per-release or manually.
    if: false
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - run: uv sync --all-extras

      - name: Run agent eval
        run: uv run pytest agent/tests/eval/test_agent_eval.py -v -m integration --no-cov -x
        env:
          EVAL_MODEL: openai:deepseek-v4-pro@https://api.deepseek.com
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Run translation eval
        run: uv run pytest agent/tests/eval/test_translation.py -v -m integration --no-cov -x
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # ── Stage 3: Deploy (tag-triggered, all tests green) ───────

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, frontend-build, db-validate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      actions: read
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: frontend-out
          path: frontend/out

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Apply database migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Deploy the catalog Worker FIRST: the main worker's [[services]] binding
      # (service = "catalog") only resolves once the catalog service exists.
      # The catalog Worker reaches Postgres via its [[hyperdrive]] binding in
      # prod; until that is provisioned, set DATABASE_URL with
      # `wrangler secret put DATABASE_URL` (add it to the `secrets:` block below).
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy catalog Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.79.0"
          workingDirectory: workers/catalog
          command: deploy
          # Catalog reaches Postgres via env.DATABASE_URL until a [[hyperdrive]]
          # binding is provisioned (src/index.ts falls back to DATABASE_URL).
          # Sourced from the existing SUPABASE_DB_URL secret.
          secrets: |
            DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy via Wrangler (edge + container)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.79.0"
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_DB_URL
            GEMINI_API_KEY
            ZETA_API_KEY
            OPENAI_COMPAT_BASE_URL
            OPENAI_COMPAT_API_KEY
            GOOGLE_MAPS_API_KEY
            LOGFIRE_TOKEN
            CORS_ALLOWED_ORIGIN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZETA_API_KEY: ${{ secrets.ZETA_API_KEY }}
          OPENAI_COMPAT_BASE_URL: ${{ vars.OPENAI_COMPAT_BASE_URL || 'https://api.univibe.cc/openai' }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}

  # ── Stage 4: Post-deploy smoke test (after successful deploy) ──

  smoke-test:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - run: uv sync --all-extras

      - name: Run E2E smoke tests
        run: >-
          uv run pytest
          agent/tests/integration/test_e2e_smoke.py
          agent/tests/integration/test_frontend_contracts.py
          -v --no-cov
        env:
          SEICHI_API_URL: ${{ secrets.SEICHI_API_URL }}
          SEICHI_API_KEY: ${{ secrets.SEICHI_API_KEY }}
