# Meta-quality lane (docs/iterations/iter6/design-CI-1-pipeline-refactor.md):
# machine-checked invariants over every workflow (step 1d) plus the actionlint
# gate that validates workflow syntax itself, moved here from
# reusable-security.yml so it stands as an independent required context.
# S0-v2 B4: the retired repository-quality-gate's contents (repo-hygiene checks,
# CI contract test, codecov patch policy) also live here — this lane is the
# fixed point of its own checks: it never filters by paths, and it must keep
# its own timeout-minutes / permissions / concurrency / merge_group or it fails
# on itself.
name: Quality

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  merge_group:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Template concurrency (design CI-1): every PR-bearing event — pull_request
# (synchronize and edited included), pull_request_review,
# pull_request_review_comment, and issue_comment — cancels the in-progress run
# so a newer review/thread/comment/finding can never wait behind an older run
# that posts a stale success (issue #1008 finding 2). Queue (merge_group) and
# main (push) runs never cancel: cancelling a queue run wedges the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || github.event_name == 'issue_comment' }}

jobs:
  invariants:
    name: Quality / invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Issue #1008 §7 head-bound review-gate status: the pending status is
      # posted at the very beginning of the PR-only path, before any expensive
      # quality step, so a PR comment/review change can never leave the previous
      # success merge-eligible while those steps run (finding 1). The head is
      # resolved once here and pinned through collect/check and the final
      # status (finding 2). Plain issue comments, push, and merge_group resolve
      # to no PR and post nothing (no fake PR-review status).
      - name: Resolve PR review-gate head
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || github.event_name == 'issue_comment' }}
        id: review-gate-head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.event.repository.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_PULL_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          set -euo pipefail
          PR_SHA="$(scripts/local-gates/pr-review-gate-step.sh resolve-head "$EVENT_NAME" "$REPO" "$PR_NUMBER" "$ISSUE_NUMBER" "$ISSUE_PULL_URL")"
          if [ -n "$PR_SHA" ]; then
            printf 'has_pr=true\n' >> "$GITHUB_OUTPUT"
            printf 'head_sha=%s\n' "$PR_SHA" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Post pending review-gate status on the PR head
        if: ${{ steps.review-gate-head.outputs.has_pr == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.repository.full_name }}
          HEAD_SHA: ${{ steps.review-gate-head.outputs.head_sha }}
        run: scripts/local-gates/pr-review-check.sh status "$REPO" "$HEAD_SHA" pending
        shell: bash
      - name: Ruby syntax check workflow meta scripts
        run: |
            for f in .github/scripts/assert-workflow-invariants.rb .github/scripts/assert-workflow-invariants-expression.rb .github/scripts/assert-workflow-invariants.test.rb .github/scripts/release-manifest-resolver.rb .github/scripts/release-manifest-resolver.test.rb .github/scripts/test_ci_contract.rb .github/scripts/test_ci_routing_consistency.rb .github/scripts/test_ci_contract_ruleset_migration.rb .github/scripts/test_ci_contract_ruleset_migration_mutation.rb .github/scripts/test_ci_contract_review_gate.rb .github/scripts/test_ci_contract_review_gate_mutation.rb .github/scripts/test_safe1_production_contract.rb .github/scripts/test_retention1_absence.rb .github/scripts/test_session3_staging_cutover.rb .github/scripts/test_promotion_ac5_contract.rb .github/scripts/test_promotion_ac5_mutation.rb .github/scripts/test_prod_dsn_store_contract.rb; do
            ruby -c "${f}"
            done
        shell: bash
      - name: Workflow invariant behavioral tests
        run: ruby .github/scripts/assert-workflow-invariants.test.rb
        shell: bash
      - name: Assert workflow invariants
        run: ruby .github/scripts/assert-workflow-invariants.rb
        shell: bash
      # SAFE-1 (#937): the production freeze contract — the eligibility gate on
      # every production entry point, the removed rollback version_id, and the
      # pinned manifest resolution (checkout, Atlas target, build metadata, and
      # smoke expectations). Unfiltered like every check in this lane, so any
      # PR or merge-group candidate that could change release code runs it.
      - name: SAFE-1 production freeze contract
        run: ruby .github/scripts/test_safe1_production_contract.rb
        shell: bash
      # RETENTION-1 (#940): the retired automated-retention surface may exist
      # only in immutable history and SAFE-1's pinned production allowlist.
      # Unfiltered like every check in this lane, so any PR or merge-group
      # candidate that could re-introduce a staging trigger, Worker, role,
      # credential, or runbook runs it.
      - name: RETENTION-1 absence contract
        run: ruby .github/scripts/test_retention1_absence.rb
        shell: bash
      # SESSION-3 (#961): the staging hard-cut contract — the fresh-schema
      # retained manifest, the sole-repository Session adapters, and the
      # cutover workflow-order state machine (reopen after every consumer
      # smokes, reset only after ingress closed + retention absent, every
      # consumer deployed from one source_revision). Unfiltered like every
      # check in this lane.
      - name: SESSION-3 staging cutover contract
        run: ruby .github/scripts/test_session3_staging_cutover.rb
        shell: bash
      # #1048: the production runtime DSN cutover contract — production catalog/users
      # consume catalog_svc/users_svc role DSNs from the Secrets Store bindings and
      # no deploy job uploads DATABASE_URL as a worker secret. Unfiltered like every
      # check in this lane, so any PR touching the deploy path runs it.
      - name: PROD DSN store contract
        run: ruby .github/scripts/test_prod_dsn_store_contract.rb
        shell: bash
      - name: SAFE-1 release manifest resolver self-tests
        run: ruby .github/scripts/release-manifest-resolver.test.rb
        shell: bash
      - name: SAFE-1 release eligibility self-tests
        run: bash .github/scripts/release-eligibility.test.sh
        shell: bash
      # #1007: build-once promotion manifest + AC4 rejection matrix. The
      # primitive is produced at build time, consumed at staging, and checked
      # at production eligibility; these tests run unfiltered in every quality
      # lane so a regression in schema/digest/evidence/dependency handling
      # fails closed.
      - name: Build-once promotion manifest unit tests
        run: python3 .github/scripts/test_promotion_manifest.py
        shell: bash
      - name: Build-once promotion flow (AC2/AC3/AC4)
        run: bash scripts/local-gates/promotion-manifest-e2e.test.sh
        shell: bash
      # #1013 (AC4): the deployed-version-metadata read + approval gate fails
      # closed on a deployed digest/config-schema mismatch and never fakes a
      # green read for a component with no platform metadata; the platform read
      # is mocked so this proves the AC4 gate unfiltered in every quality lane.
      - name: Deployed-version AC4 gate (mocked platform read)
        run: python3 .github/scripts/test_promote_deployed.py
        shell: bash
      # #1013 (AC5): production workflow holds no build command for a promoted
      # component and tag creation cannot trigger a deploy. This runs unfiltered
      # so a build step leaking back into the promoted path (or a tag trigger
      # sneaking into a deploy workflow) fails closed in every quality lane.
      - name: Promotion AC5 contract (no prod build + no tag deploy)
        run: ruby .github/scripts/test_promotion_ac5_contract.rb
        shell: bash
      # #1013 AC5 mutation hardening (owner commitment #5): the promotion-lane
      # mutation probes prove each hazard is rejected and the pristine set
      # passes (red/restore/green).
      - name: Promotion AC5 mutation probes
        run: ruby .github/scripts/test_promotion_ac5_mutation.rb
        shell: bash
      # S0-v2 B4: the retired repository-quality-gate's contents moved here —
      # this lane is the fixed point that never path-filters, so the checks
      # that test the CI contract itself must live here (a gate that cannot
      # test itself is not a gate).
      - name: AGENTS.md reference check self-tests
        run: bash .github/scripts/check-agents-refs.test.sh
      - name: AGENTS.md reference check
        run: bash .github/scripts/check-agents-refs.sh
      # #913 (close-out W5): every docs/-prefixed string in tracked files must
      # resolve — extends the reference-check surface to code comments and all
      # docs (archive/ exempt: read-only history).
      - name: Docs path check self-tests
        run: bash .github/scripts/check-docs-paths.test.sh
      - name: Docs path check
        run: bash .github/scripts/check-docs-paths.sh
      - name: Root allowlist check self-tests
        run: bash .github/scripts/check-root-allowlist.test.sh
      - name: Root allowlist check
        run: bash .github/scripts/check-root-allowlist.sh
      - name: E2E promotion guard self-tests
        run: bash .github/scripts/check-e2e-promotion.test.sh
      - name: E2E promotion guard
        run: bash .github/scripts/check-e2e-promotion.sh
      # S0-v2 B3 (supply chain): every `uses:` must be pinned to a full 40-char
      # SHA; local `./` action/workflow paths are allowed and `docker://` images
      # must be digest-pinned (documented exception in check-actions-pinned.sh).
      - name: Actions pinning check self-tests
        run: bash .github/scripts/check-actions-pinned.test.sh
      - name: Actions pinning check
        run: bash .github/scripts/check-actions-pinned.sh
      # #1013: web runtime-config payload recursion guard (self-test + check).
      - name: Web runtime-config payload recursion guard (self-test + check)
        run: bash .github/scripts/check-web-runtime-config-payloads.test.sh && bash .github/scripts/check-web-runtime-config-payloads.sh
        shell: bash
      # #680 deploy-gate sanity: the edge ratelimit-namespace placeholder
      # precheck (wired fail-closed into the edge build lane) is mechanically
      # self-tested here so the quality lane covers the script's behavior.
      - name: Edge ratelimit namespace precheck self-tests
        run: bash .github/scripts/check-edge-ratelimit-namespace.test.sh
      - name: Verify CI contract
        run: ruby .github/scripts/test_ci_contract.rb
      # AC6 (#679): the ruleset migration contract — a new required check must
      # be added (and producible on merge_group) before old names are retired;
      # the mutation probes prove each hazard is rejected and the pristine
      # snapshot passes (red/restore/green).
      - name: Verify ruleset migration contract
        run: ruby .github/scripts/test_ci_contract_ruleset_migration_mutation.rb
      - name: Verify patch coverage policy
        run: ruby .github/scripts/test_codecov_patch.rb
      # AC3 (#679): the changed-component router (pre-push) must fan out to the
      # same lanes CI's pipeline-*.yml push paths do — a local pass cannot be
      # skipped by CI path filtering and vice-versa.
      - name: Verify CI routing consistency
        run: ruby .github/scripts/test_ci_routing_consistency.rb
      # The head pinned by the early resolve step now runs collect + check. The
      # step exits non-zero when the live PR head advanced past the pin, when
      # collect cannot read GitHub state, or when check rejects — the required
      # job fails and GitHub blocks merges (fail closed, no continue-on-error).
      - name: Required PR review gate (collect + check)
        if: ${{ steps.review-gate-head.outputs.has_pr == 'true' }}
        id: review-gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.repository.full_name }}
          HEAD_SHA: ${{ steps.review-gate-head.outputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_PULL_URL: ${{ github.event.issue.pull_request.url }}
        run: scripts/local-gates/pr-review-gate-step.sh collect-check "$REPO" "$HEAD_SHA" "$EVENT_NAME" "$PR_NUMBER" "$ISSUE_NUMBER" "$ISSUE_PULL_URL"
        shell: bash
      - name: Download actionlint
        run: |
          ACTIONLINT_VERSION="1.7.7"
          ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          ACTIONLINT_CHECKSUMS="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          ACTIONLINT_BASE_URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSfL --proto '=https' --proto-redir '=https' -o "${ACTIONLINT_ARCHIVE}" "${ACTIONLINT_BASE_URL}/${ACTIONLINT_ARCHIVE}"
          curl -sSfL --proto '=https' --proto-redir '=https' -o "${ACTIONLINT_CHECKSUMS}" "${ACTIONLINT_BASE_URL}/${ACTIONLINT_CHECKSUMS}"
          grep -F "  ${ACTIONLINT_ARCHIVE}" "${ACTIONLINT_CHECKSUMS}" > actionlint.sha256
          sha256sum -c actionlint.sha256
          tar -xzf "${ACTIONLINT_ARCHIVE}" actionlint
          chmod +x actionlint
        shell: bash
      - name: Run actionlint
        run: ./actionlint -color
        shell: bash
      # The final head-bound status posts with `if: always()` semantics, so a
      # failed/cancelled collect-check (or any earlier failure) can never leave
      # the pinned head stale-green. It is the LAST step of the job and derives
      # success from the whole-job outcome (`job.status`), not just the gate
      # step: success only when every earlier quality step, collect/check, and
      # the actionlint gate all succeeded, otherwise failure on the exact
      # pinned head (issue #1008 finding 1).
      - name: Post final review-gate status on the PR head
        if: ${{ always() && steps.review-gate-head.outputs.has_pr == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.repository.full_name }}
          HEAD_SHA: ${{ steps.review-gate-head.outputs.head_sha }}
          JOB_STATUS: ${{ job.status }}
        run: scripts/local-gates/pr-review-gate-step.sh final-status "$REPO" "$HEAD_SHA" "$JOB_STATUS"
        shell: bash
