# Trusted main controller: release source and controller source are distinct.
name: CD
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Complete release snapshot artifact ID
        required: true
        type: string
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  select:
    name: CD / select artifact
    if: ${{ github.repository == 'lifeodyssey/animichi' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cd-select-${{ github.run_id }}
      cancel-in-progress: false
    permissions: {contents: read, actions: read} # inspect and download cross-run artifacts
    outputs:
      artifact_id: ${{ steps.selection.outputs.artifact_id }}
      artifact_digest: ${{ steps.selection.outputs.artifact_digest }}
      source_sha: ${{ steps.selection.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the selected artifact
        id: selection
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: ruby .github/scripts/release/resolve.rb
      - name: Verify the selected snapshot
        uses: $/.github/actions/hydrate-release
        with:
          artifact-id: ${{ steps.selection.outputs.artifact_id }}
          run-id: ${{ steps.selection.outputs.run_id }}
  stage:
    name: CD / staging
    needs: [select]
    if: ${{ !failure() && !cancelled() && github.repository == 'lifeodyssey/animichi' && github.ref == 'refs/heads/main' && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 120
    concurrency:
      group: cd-staging
      cancel-in-progress: false
    permissions: {contents: read, actions: read, id-token: write} # artifact reads; environment-scoped Pulumi and migrator OIDC
    outputs:
      receipt_id: ${{ steps.receipt.outputs.artifact-id }}
      receipt_digest: ${{ steps.receipt.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the selected artifact
        id: selection
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.select.outputs.artifact_digest }}
        run: ruby .github/scripts/release/resolve.rb
      - name: Verify the selected snapshot
        uses: $/.github/actions/hydrate-release
        with:
          artifact-id: ${{ steps.selection.outputs.artifact_id }}
          run-id: ${{ steps.selection.outputs.run_id }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify selected deploy configurations
        run: node .github/scripts/release/verify-config.mjs
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version-file: .pulumi.version
      - name: Log into Pulumi Cloud
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: lifeodyssey
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:lifeodyssey
      - name: Resolve the pinned Pulumi CLI version
        id: pulumi-cli
        run: printf 'version=%s\n' "$(cat .pulumi.version)" >> "$GITHUB_OUTPUT"
      - name: Open the environment configuration
        uses: pulumi/esc-action@32dda43ffe7a2ab21e6bce11c781b44a3e5623cf # v3.2.0
        with:
          version: ${{ steps.pulumi-cli.outputs.version }}
          environment: lifeodyssey/animichi/staging
          export-environment-variables: CLOUDFLARE_API_TOKEN,CF_ACCESS_CLIENT_ID,CF_ACCESS_CLIENT_SECRET
      - name: Require environment credentials
        run: |
          for key in CLOUDFLARE_API_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            [ -n "${!key:-}" ] || { echo "::error::$key is missing"; exit 1; }
          done
      - run: bash .github/scripts/release/registry-login.sh pull
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Inspect remote image manifests
        run: ruby .github/scripts/release/inspect-images.rb
      - name: Read applied migration compatibility
        env:
          MIGRATOR_URL: ${{ vars.MIGRATOR_STAGING_URL }}
        run: bash .github/scripts/release/schema-preflight.sh staging --atlas-only
      - name: Retire the migrator container application
        run: bash scripts/delivery/retire-migrator-container.sh staging
      - name: Publish the selected migrator
        env: {SOURCE_SHA: "${{ needs.select.outputs.source_sha }}"}
        run: pnpm exec wrangler deploy --no-bundle --config release/migrator/wrangler.json --env staging --tag "sha-$SOURCE_SHA"
      - name: Preview the selected native migration graph
        env:
          MIGRATOR_URL: ${{ vars.MIGRATOR_STAGING_URL }}
        run: bash .github/scripts/release/schema-preflight.sh staging
      - name: Install sealed foundation dependencies
        run: |
          pnpm install --dir release/foundation --frozen-lockfile --ignore-scripts
          pnpm install --dir release/foundation/infra/database-access --frozen-lockfile --ignore-scripts
      - name: Apply database access
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: lifeodyssey/staging
          work-dir: release/foundation/infra/database-access
      - name: Apply topology
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: lifeodyssey/staging
          work-dir: release/foundation/infra
      - name: Apply the selected migration chain
        env:
          MIGRATOR_URL: ${{ vars.MIGRATOR_STAGING_URL }}
        run: bash scripts/delivery/migrate-through-worker.sh staging
      - name: Publish the selected services
        env: {SOURCE_SHA: "${{ needs.select.outputs.source_sha }}"}
        run: bash .github/scripts/release/publish-services.sh staging
      - name: Smoke the release
        env:
          SMOKE_ATTEMPTS: "8"
          SMOKE_RETRY_DELAY: "15"
        run: bash .github/scripts/staging-smoke-check.sh https://animichi-staging.zhenjiazhou0127.workers.dev https://animichi-web-staging.zhenjiazhou0127.workers.dev
      - name: Record observed deployment identities
        env:
          MIGRATOR_URL: ${{ vars.MIGRATOR_STAGING_URL }}
        run: |
          bash .github/scripts/release/schema-preflight.sh staging
          node .github/scripts/release/record-receipt.mjs staging
      - name: Publish the immutable staging receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 14
  promote-production:
    name: CD / production
    needs: [select, stage]
    if: ${{ !failure() && !cancelled() && github.repository == 'lifeodyssey/animichi' && github.ref == 'refs/heads/main' && needs.select.result == 'success' && needs.stage.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    concurrency:
      group: cd-production
      cancel-in-progress: false
    permissions: {contents: read, actions: read, id-token: write} # artifact reads; environment-scoped Pulumi and migrator OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the selected artifact
        id: selection
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.select.outputs.artifact_digest }}
        run: ruby .github/scripts/release/resolve.rb
      - name: Verify the selected snapshot
        uses: $/.github/actions/hydrate-release
        with:
          artifact-id: ${{ steps.selection.outputs.artifact_id }}
          run-id: ${{ steps.selection.outputs.run_id }}
      - name: Refuse a staging-only baseline
        run: bash infra/database-access/production-baseline-guard.sh release/migrations/STAGING_ONLY_BASELINE
      - name: Download the staging receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.stage.outputs.receipt_id }}
          run-id: ${{ github.run_id }}
          repository: lifeodyssey/animichi
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: staging-receipt
      - name: Verify the staging receipt
        env:
          RECEIPT_ID: ${{ needs.stage.outputs.receipt_id }}
          RECEIPT_DIGEST: ${{ needs.stage.outputs.receipt_digest }}
        run: ruby .github/scripts/release/verify-receipt.rb
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify selected deploy configurations
        run: node .github/scripts/release/verify-config.mjs
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version-file: .pulumi.version
      - name: Log into Pulumi Cloud
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: lifeodyssey
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:lifeodyssey
      - name: Resolve the pinned Pulumi CLI version
        id: pulumi-cli
        run: printf 'version=%s\n' "$(cat .pulumi.version)" >> "$GITHUB_OUTPUT"
      - name: Open the environment configuration
        uses: pulumi/esc-action@32dda43ffe7a2ab21e6bce11c781b44a3e5623cf # v3.2.0
        with:
          version: ${{ steps.pulumi-cli.outputs.version }}
          environment: lifeodyssey/animichi/prod
          export-environment-variables: CLOUDFLARE_API_TOKEN
      - name: Require environment credentials
        run: |
          for key in CLOUDFLARE_API_TOKEN; do
            [ -n "${!key:-}" ] || { echo "::error::$key is missing"; exit 1; }
          done
      - run: bash .github/scripts/release/registry-login.sh pull
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Inspect remote image manifests
        run: ruby .github/scripts/release/inspect-images.rb
      - name: Read applied migration compatibility
        env:
          MIGRATOR_URL: ${{ vars.MIGRATOR_PRODUCTION_URL }}
        run: bash .github/scripts/release/schema-preflight.sh production --atlas-only
      - name: Retire the migrator container application
        run: bash scripts/delivery/retire-migrator-container.sh production
      - name: Publish the selected migrator
        env: {SOURCE_SHA: "${{ needs.select.outputs.source_sha }}"}
        run: pnpm exec wrangler deploy --no-bundle --config release/migrator/wrangler.json --env production --tag "sha-$SOURCE_SHA"
      - name: Preview the selected native migration graph
        env:
          MIGRATOR_URL: ${{ vars.MIGRATOR_PRODUCTION_URL }}
        run: bash .github/scripts/release/schema-preflight.sh production
      - name: Install sealed foundation dependencies
        run: |
          pnpm install --dir release/foundation --frozen-lockfile --ignore-scripts
          pnpm install --dir release/foundation/infra/database-access --frozen-lockfile --ignore-scripts
      - name: Apply database access
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: lifeodyssey/prod
          work-dir: release/foundation/infra/database-access
      - name: Apply topology
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: lifeodyssey/prod
          work-dir: release/foundation/infra
      - name: Apply the selected migration chain
        env:
          MIGRATOR_URL: ${{ vars.MIGRATOR_PRODUCTION_URL }}
        run: bash scripts/delivery/migrate-through-worker.sh production
      - name: Publish the selected services
        env: {SOURCE_SHA: "${{ needs.select.outputs.source_sha }}"}
        run: bash .github/scripts/release/publish-services.sh production
      - name: Smoke the release
        env:
          SMOKE_ATTEMPTS: "8"
          SMOKE_RETRY_DELAY: "15"
        run: bash .github/scripts/staging-smoke-check.sh https://animichi.com https://animichi.com
      - name: Record observed deployment identities
        env:
          MIGRATOR_URL: ${{ vars.MIGRATOR_PRODUCTION_URL }}
        run: |
          bash .github/scripts/release/schema-preflight.sh production
          node .github/scripts/release/record-receipt.mjs production
      - name: Publish the immutable production receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 14
