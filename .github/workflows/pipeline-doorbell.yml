# Doorbell pipeline (S0-v2 B4, CI-1 union method): the workers/doorbell suite
# lives in this lane like every other package. pull_request is pathless by
# design (merge_group runs ignore path filters); push paths are the read
# closure — the doorbell worker reads @animichi/contract/oidc-github.
name: pipeline-doorbell

on:
  pull_request:
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/pipeline-doorbell.yml"
      - ".oxlintrc.json"
      - "workers/doorbell/**"
      - "packages/contract/src/oidc-github.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Doorbell / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-ci
        with:
          working-directory: workers/doorbell
          lint-command: pnpm exec tsc --noEmit && pnpm run lint:oxlint

  test:
    name: Doorbell / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-ci
        with:
          working-directory: workers/doorbell
          test-command: pnpm run test

  build:
    name: Doorbell / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Compile check without deploying (deploy is staging-CI only, gate
      # block-local-deploy). wrangler deploy --dry-run bundles the source.
      - name: Bundle + config check (wrangler deploy dry-run)
        working-directory: workers/doorbell
        run: pnpm exec wrangler deploy --dry-run --env=staging --outdir "$RUNNER_TEMP/doorbell-bundle"
