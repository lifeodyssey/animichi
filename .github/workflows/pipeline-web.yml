name: pipeline-web

on:
  # pull_request is pathless by design (CI-1, commit 688bfacc): merge_group
  # runs ignore path filters, so a filtered PR lane would diverge from the queue.
  pull_request:
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/pipeline-web.yml"
      - ".oxlintrc.json"
      - "apps/web/**"
      # Read-closure of the web lane: the turnstile-constants-guard test reads
      # this file, and it is not under apps/web/** (the pathless PR trigger
      # already runs it on every PR; this keeps push-to-main honest).
      - "workers/edge/src/protect/turnstile.ts"
      - "e2e/**"
      - "package.json"
      - "packages/contract/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Web / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Type check (tsc)
        run: pnpm --filter web typecheck
      - name: Oxlint (type-aware, strict)
        run: pnpm --filter web run lint:oxlint

  test:
    name: Web / test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit tests (vitest, coverage gate)
        run: pnpm --filter web test
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: true
          use_oidc: true

  build:
    name: Web / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB_ARTIFACT_NAME: bundle-web-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build + output-layout integration test
        env:
          # CI-only test key (Cloudflare's published always-passing TEST site
          # key, not a secret — see TurnstileGate.tsx's TURNSTILE_TEST_SITE_KEY)
          # so the a11y states suite can arm an anonymous turn against the
          # built worker. Deploy builds set the real key from vars
          # (reusable-deploy-component.yml).
          VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
          # showcase.ts fails closed at module init — CI builds are never showcase.
          VITE_SHOWCASE_MODE: "false"
        run: pnpm --filter web test:integration
      - name: Package build artifact
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/bundle-web"
          mkdir -p "$ARTIFACT_DIR"
          tar -C apps/web -czf "$ARTIFACT_DIR/web-output.tar.gz" .output
          ARTIFACT_SHA256="$(sha256sum "$ARTIFACT_DIR/web-output.tar.gz" | cut -d ' ' -f1)"
          printf '{"commit_sha":"%s","sha256":"%s"}\n' "$GITHUB_SHA" "$ARTIFACT_SHA256" \
            > "$ARTIFACT_DIR/.artifact-meta.json"
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: |
            ${{ runner.temp }}/bundle-web/web-output.tar.gz
            ${{ runner.temp }}/bundle-web/.artifact-meta.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Isolate original build output
        run: mv apps/web/.output "$RUNNER_TEMP/original-web-output"
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/downloaded-web-artifact
      - name: Verify and restore build artifact
        run: |
          META_PATH="$RUNNER_TEMP/downloaded-web-artifact/.artifact-meta.json"
          BUNDLE_PATH="$RUNNER_TEMP/downloaded-web-artifact/web-output.tar.gz"
          META_COMMIT_SHA="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit_sha"])' "$META_PATH")"
          META_SHA256="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["sha256"])' "$META_PATH")"
          test "$META_COMMIT_SHA" = "$GITHUB_SHA"
          printf '%s  %s\n' "$META_SHA256" "$BUNDLE_PATH" | sha256sum --check --strict
          tar -C apps/web -xzf "$BUNDLE_PATH"

      # PR and merge-queue runs may only restore this release-reachable cache.
      # The trusted push-to-main run is the sole writer.
      - name: Resolve Playwright version
        run: |
          PLAYWRIGHT_VERSION="$(pnpm --dir e2e exec playwright --version)"
          echo "PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION#Version }" >> "$GITHUB_ENV"
        shell: bash
      - name: Restore Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: Install Playwright browser
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: Save Playwright browser cache
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: Browser test (branded 404, maplibre canary, state ownership on downloaded worker)
        run: |
          pnpm --filter web exec wrangler dev --port 8799 &
          WRANGLER_PID=$!
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8799/ && break; sleep 1; done
          E2E_WEB_BASE_URL=http://localhost:8799 pnpm --dir e2e exec playwright test web-404.spec.ts web-maplibre-canary.spec.ts web-state-ownership.spec.ts
          kill "$WRANGLER_PID"

  accessibility:
    # Issue #1015 AC6: WCAG 2.2 AA on the critical journeys is a required
    # check. Runs the axe + keyboard + state suites against the built worker
    # (the same artifact `build` uploads), so the gate touches real SSR output.
    # Register `Web / accessibility` in the branch required-checks ruleset
    # alongside `Web / lint`, `Web / test` and `Web / build`.
    name: Web / accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-web-${{ github.sha }}
          path: ${{ runner.temp }}/downloaded-web-artifact
      - name: Verify and restore build output
        run: |
          META_PATH="$RUNNER_TEMP/downloaded-web-artifact/.artifact-meta.json"
          BUNDLE_PATH="$RUNNER_TEMP/downloaded-web-artifact/web-output.tar.gz"
          META_COMMIT_SHA="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit_sha"])' "$META_PATH")"
          META_SHA256="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["sha256"])' "$META_PATH")"
          test "$META_COMMIT_SHA" = "$GITHUB_SHA"
          printf '%s  %s\n' "$META_SHA256" "$BUNDLE_PATH" | sha256sum --check --strict
          tar -C apps/web -xzf "$BUNDLE_PATH"
      - name: Resolve Playwright version
        run: |
          PLAYWRIGHT_VERSION="$(pnpm --dir e2e exec playwright --version)"
          echo "PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION#Version }" >> "$GITHUB_ENV"
        shell: bash
      - name: Restore Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: Install Playwright browser
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: WCAG 2.2 AA gate (axe + keyboard + states)
        env:
          VITE_SHOWCASE_MODE: "false"
        run: |
          pnpm --filter web exec wrangler dev --port 8799 &
          WRANGLER_PID=$!
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8799/ && break; sleep 1; done
          E2E_WEB_BASE_URL=http://localhost:8799 pnpm --dir e2e exec playwright test web-a11y-axe.spec.ts web-a11y-keyboard.spec.ts web-a11y-states.spec.ts
          kill "$WRANGLER_PID"

  lighthouse:
    name: Web / lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Reuses the build artifact; the Playwright CWV spec (e2e/web-cwv.spec.ts)
    # asserts CLS (blocking at 0.1) and warns on LCP (2500ms) per the shared
    # thresholds in apps/web/web-cwv.config.ts. Not in any required-checks
    # ruleset yet — report-only until real-world numbers exist (S0-v2 C5).
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-web-${{ github.sha }}
          path: ${{ runner.temp }}/downloaded-web-artifact
      - name: Verify and restore build output
        run: |
          META_PATH="$RUNNER_TEMP/downloaded-web-artifact/.artifact-meta.json"
          BUNDLE_PATH="$RUNNER_TEMP/downloaded-web-artifact/web-output.tar.gz"
          META_COMMIT_SHA="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit_sha"])' "$META_PATH")"
          META_SHA256="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["sha256"])' "$META_PATH")"
          test "$META_COMMIT_SHA" = "$GITHUB_SHA"
          printf '%s  %s\n' "$META_SHA256" "$BUNDLE_PATH" | sha256sum --check --strict
          tar -C apps/web -xzf "$BUNDLE_PATH"

      # PR and merge-queue runs may only restore this release-reachable cache.
      # The trusted push-to-main run is the sole writer.
      - name: Resolve Playwright version
        run: |
          PLAYWRIGHT_VERSION="$(pnpm --dir e2e exec playwright --version)"
          echo "PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION#Version }" >> "$GITHUB_ENV"
        shell: bash
      - name: Restore Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: Install Playwright browser
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: Core Web Vitals (CLS gate, LCP warn)
        env:
          # showcase.ts fails closed at module init — CI serves are never showcase.
          VITE_SHOWCASE_MODE: "false"
        run: |
          pnpm --filter web exec wrangler dev --port 8799 &
          WRANGLER_PID=$!
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8799/ && break; sleep 1; done
          E2E_WEB_BASE_URL=http://localhost:8799 pnpm --dir e2e exec playwright test web-cwv.spec.ts
          kill "$WRANGLER_PID"
      - name: Upload CWV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report-${{ github.sha }}
          path: apps/web/lighthouse-reports/**
          retention-days: 7
