# The pull-request pipeline (CI/CD redesign spec §3.1, card B1 / #1359).
#
# The affected set is pnpm's, not ours: `--filter "...[<merge-base>]"` selects
# every workspace project whose files changed plus every dependent of one, so
# there is no components.json, no change-plan.py and no second router to drift
# from. Two projects are subtracted from the matrix because they own a job of
# their own or have nothing to run: the root project `animichi-cloudflare-worker`
# (docs/**, .github/** and the root lockfile land in it by directory containment,
# and it has no lint/typecheck/test scripts) and `animichi-e2e`, whose `test` builds apps/web
# and serves the emitted Worker before it runs a browser spec, and the `e2e` job
# owns that lane, browser binary and all (B4 / #1362).
#
# The transitional `db` / `e2e` / `codeql` jobs are all gone: B2,
# B5, B4 and B3 (#1361) rewrote or replaced each in place — CodeQL analysis
# is GitHub's default setup now, and the ruleset's code_scanning rule consumes
# its results directly.
#
# The merged-commit lane (#1715). `merge_group` never fires here — there is no
# merge queue — so without a `push` trigger nothing ran against the commit a squash
# merge produces.
#
# The ruleset's `strict_required_status_checks_policy` is what makes the ordinary
# case safe: a branch must contain the current `main` tip before it can merge, so a
# normal squash merge produces exactly the tree its pull_request run gated. This
# lane exists for what can still diverge from that — an owner-bypass merge or a
# direct push to `main`, a verdict that changes with time (the osv advisory data),
# and a run cut short before it reported. #1695's workflow and #678's whole-tree
# contract each passed their own gate and failed eight tests once they met; the
# strict policy forces the rebase that surfaces that class of collision, and this
# lane covers the merges that never rebase.
#
# A merged commit cannot be amended, so this lane runs the whole matrix except
# `commits`: the whole-repository lanes — `contracts`, `docs`, and the six security
# jobs behind `Security` — the lanes `plan` routes by the merged diff — `affected`,
# `e2e`, `db` — and the two aggregates that carry the required contexts.
# When the merge's bytes differ from the pull request's, it is exactly what those
# diff-selected lanes read that changed, so gating them off would leave their
# failure with no verdict at all. `plan` therefore routes the merge's own diff: on
# a push `github.event.before` is the trunk tip it landed on and `github.sha` is
# the squash commit. Only `commits` is gated off, and it has no subject here at all
# (no PR title, and a merge-base range of zero commits).
#
# The one gate is `github.event_name != 'push'`.
# `.github/test/merged-commit-lane.test.rb` pins the trigger and that selection,
# and its tables must cover every job in this file, so a job added later cannot
# reach a merged commit by default.
#
# What happens when this lane goes red: `alert-failure` below publishes one
# deduplicated issue, because a `push` run is unattended by
# `.github/test/failure-alert.test.rb`'s own definition — the same job, entry,
# permissions and (workflow, ref) concurrency group the three existing unattended
# workflows use, with its `if:` narrowed to the push event so a pull-request
# failure stays on the pull request. A run the concurrency group supersedes while
# it is still pending is cancelled and alerts nothing; the run that replaced it
# reads a tree containing the same bytes. Recovery is a reviewed revert on `main`
# (docs/ops/deployment.md, "After any recovery"), which `release-build.yml` turns
# into a new immutable snapshot. Nothing reverts `main` automatically: a red lane
# can be the fault of either of the two changes that landed together, and an
# unreviewed write to `main` is what the ruleset exists to prevent.
#
# A red run here does not stop the deploy. `release-build.yml` fires on the same
# push, builds that commit and dispatches `cd.yml`, which stages it and waits for
# the production approval; nothing in CD reads this run. The approver has to check
# the alert or this run for the SHA before approving.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    branches: [main]
  # The merged-commit lane: the squash result on trunk, which `merge_group` would
  # have covered had this repository a merge queue.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Routing only: it answers which packages a diff touches. On a push the diff it
  # routes is the merge's own — `github.event.before` to `github.sha` — so a merge
  # whose bytes differ from the pull request's still reaches the package lanes it
  # changed.
  plan:
    name: CI / plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.pnpm.outputs.packages }}
      web: ${{ steps.paths.outputs.web }}
      e2e: ${{ steps.paths.outputs.e2e }}
      migrations: ${{ steps.paths.outputs.migrations }}
      workflows: ${{ steps.paths.outputs.workflows }}
      deps: ${{ steps.paths.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No `cache: pnpm` here: plan never installs, so on any lockfile-changing
      # PR the store path never exists and setup-node's save phase fails the
      # job. The cached installs live in the jobs that actually install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # The paths outside any pnpm project (migrations/, .github/) and the root
      # dependency files, which pnpm answers with the root project alone.
      # base/ref are read on merge_group and on push — the action special-cases
      # pull_request, where it asks the API for the PR's file list and ignores
      # them. On a push the pair is the merged diff, before..sha.
      - id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.before }}
          ref: ${{ github.event.merge_group.head_sha || github.sha }}
          filters: |
            web:
              - 'apps/web/**'
            e2e:
              - 'e2e/**'
              - 'packages/contract/**'
              - 'workers/edge/**'
              - 'packages/agent/**'
              - 'packages/pi-session-neon/**'
              - 'packages/test-postgres/**'
            migrations:
              - 'packages/pi-session-neon/migrations/**'
              - 'packages/pi-session-neon/src/contract.prisma'
              - 'infra/database-access/reset-staging-baseline*'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/lib/**'
              - '.github/test/**'
            deps:
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
      - id: pnpm
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          DEPS_CHANGED: ${{ steps.paths.outputs.deps }}
          WORKFLOWS_CHANGED: ${{ steps.paths.outputs.workflows }}
        run: |
          set -euo pipefail
          # A root dependency change selects the root project and nothing else
          # (`...` adds no dependents of it), so it has to mean "every package".
          if [ "$DEPS_CHANGED" = true ]; then
            projects="$(pnpm ls -r --depth -1 --json)"
          else
            # On a push BASE_SHA is the trunk tip the merge landed on — a `push`
            # into `main` has the previous tip as its `before` — so this merge base
            # is BASE_SHA, and the filter selects exactly the merged diff.
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            projects="$(pnpm ls -r --depth -1 --json --filter "...[$merge_base]")"
          fi
          packages="$(jq -c '[.[].name] - ["animichi-cloudflare-worker", "animichi-e2e"]' <<< "$projects")"
          # `.github/**` lands in the root project, which is subtracted — so a
          # workflow-only change selects nothing. `edge-worker`'s suite is where
          # the tests that read deployment workflow text live, and some of them
          # extract shipped shell blocks and RUN them (the migrator DSN
          # redaction). Add it back explicitly, or a cd.yml rewrite ships with
          # those guards never run.
          if [ "$WORKFLOWS_CHANGED" = true ]; then
            packages="$(jq -c '. + ["edge-worker"] | unique' <<< "$packages")"
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Affected packages: $packages" >> "$GITHUB_STEP_SUMMARY"

  affected:
    name: CI / affected (${{ matrix.package }})
    needs: plan
    # An empty array in strategy.matrix is a workflow error, not a skip.
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write  # tokenless coverage upload (codecov `use_oidc`)
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      # Full history: the contract package's `test` resolves a merge base for
      # the published-document compat baseline, and CONTRACT_BASE_REF below
      # names the base commit rather than a remote-tracking ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Shared setup owns only Node/pnpm/cache/install; package-specific tools stay below.
      - uses: $/.github/actions/setup-workspace
      # Every binary below is provisioned because one package's own gates shell
      # out to it. `pr-verification-affected.test.rb` pins the pairing, so a
      # dropped step fails a test instead of that package's lane.
      #   infra          -> pulumi (test:program-load loads the program through
      #                             the real language host, infra-check.sh:83-88)
      - name: Install the pinned Pulumi CLI for the infra program load
        if: ${{ matrix.package == 'infra' }}
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version-file: .pulumi.version
      # The tag has one declaration (packages/test-postgres/postgres-image.env),
      # which this builder sources rather than naming a copy of — the shape the
      # `e2e` job's builder already uses.
      - name: Build the hermetic Postgres+PostGIS+pgvector test image
        if: ${{ contains(fromJSON('["catalog", "edge-worker", "@animichi/agent", "@animichi/test-postgres", "migrator", "@animichi/pi-session-neon", "@animichi/prisma-geography"]'), matrix.package) }}
        run: |
          set -euo pipefail
          . packages/test-postgres/postgres-image.env
          docker build -f packages/test-postgres/Dockerfile -t "$TEST_POSTGRES_IMAGE" .
      - name: Run the package's own gates
        env:
          PACKAGE: ${{ matrix.package }}
          # The baseline is the merge base's copy of the published documents. Both
          # PR-only operands are absent on a push, so the fallback is the trunk tip
          # the merge landed on — the same one `plan`'s routing reads.
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
          VITE_SHOWCASE_MODE: "false"
          VITE_NEON_AUTH_BASE_URL: "http://127.0.0.1:9"
        run: |
          set -euo pipefail
          for script in lint typecheck test test:integration; do
            pnpm --filter "$PACKAGE" run --if-present "$script"
          done
      - name: Resolve this package's coverage report
        id: coverage
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            @animichi/agent) file=packages/agent/coverage/lcov.info ;;
            web) file=apps/web/coverage/lcov.info ;;
            catalog) file=workers/catalog/coverage/lcov.info ;;
            users) file=workers/users/coverage/lcov.info ;;
            @animichi/pi-session-neon) file=packages/pi-session-neon/coverage/lcov.info ;;
            @animichi/prisma-geography) file=packages/prisma-geography/coverage/lcov.info ;;
            *) file="" ;;
          esac
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Publish coverage
        if: ${{ steps.coverage.outputs.file != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ steps.coverage.outputs.file }}
          flags: ${{ matrix.package }}
          fail_ci_if_error: true
          use_oidc: true

  contracts:
    name: CI / repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bundle-release-worker.test.sh drives a real `wrangler deploy --dry-run`,
      # so this job needs the same installed workspace as the application lanes.
      - uses: $/.github/actions/setup-workspace
      - name: Verify workflow and action responsibilities
        run: |
          set -euo pipefail
          ruby .github/test/cd-artifact.test.rb
          ruby .github/test/cd-credentials.test.rb
          ruby .github/test/cd-post-deploy-evidence.test.rb
          ruby .github/test/cd-delivery-jobs.test.rb
          ruby .github/test/cd-migrations.test.rb
          ruby .github/test/migrator-container-retirement.test.rb
          ruby .github/test/edge-container-retirement.test.rb
          ruby .github/test/cd-publish.test.rb
          ruby .github/test/cd-receipt.test.rb
          ruby .github/test/cd-schema-verification.test.rb
          ruby .github/test/cd-selection.test.rb
          ruby .github/test/cd-stage-smoke.test.rb
          ruby .github/test/cd-stage.test.rb
          ruby .github/test/failure-alert-behavior.test.rb
          ruby .github/test/failure-alert-ledger.test.rb
          ruby .github/test/failure-alert-mutation.test.rb
          ruby .github/test/failure-alert-recipient-mutation.test.rb
          ruby .github/test/failure-alert-recipient.test.rb
          ruby .github/test/failure-alert.test.rb
          ruby .github/test/merged-commit-lane.test.rb
          ruby .github/test/post-deploy-evidence-mutation.test.rb
          ruby .github/test/post-deploy-evidence-refusals.test.rb
          ruby .github/test/post-deploy-evidence-smoke-interval.test.rb
          ruby .github/test/post-deploy-evidence-verifier.test.rb
          ruby .github/test/post-deploy-evidence.test.rb
          ruby .github/test/pr-verification-affected.test.rb
          ruby .github/test/pr-verification-browser.test.rb
          ruby .github/test/pr-verification-gates.test.rb
          ruby .github/test/pr-verification-login.test.rb
          ruby .github/test/pr-verification-plan.test.rb
          ruby .github/test/pr-verification-schema.test.rb
          ruby .github/test/pr-verification-workspace.test.rb
          ruby .github/test/pr-verification-zizmor.test.rb
          ruby .github/test/release-archive.test.rb
          ruby .github/test/release-build.test.rb
          ruby .github/test/release-config.test.rb
          ruby .github/test/release-consumer-cli.test.rb
          ruby .github/test/release-container-observation.test.rb
          ruby .github/test/release-receipt-record.test.rb
          ruby .github/test/release-dispatch.test.rb
          ruby .github/test/release-migration-request.test.rb
          ruby .github/test/release-observation.test.rb
          ruby .github/test/release-publish-services.test.rb
          ruby .github/test/release-receipt-cli.test.rb
          ruby .github/test/release-receipt.test.rb
          ruby .github/test/release-registry-cli.test.rb
          ruby .github/test/release-registry.test.rb
          ruby .github/test/release-resolver.test.rb
          ruby .github/test/release-schema-gate.test.rb
          ruby .github/test/release-selection.test.rb
          ruby .github/test/release-snapshot.test.rb
          ruby .github/test/release-source-closure.test.rb
          ruby .github/test/setup-workspace-action.test.rb
          ruby .github/test/workflow-credentials.test.rb
          ruby .github/test/workflow-execution.test.rb
          ruby .github/test/workflow-invocations.test.rb
          ruby .github/test/workflow-python-toolchain.test.rb
          ruby .github/test/workflow-variables.test.rb
          ruby .github/test/workflow-workspace.test.rb
      - name: Verify Orca delivery tools
        run: |
          set -euo pipefail
          ruby scripts/orca/test/run.rb
          ruby scripts/orca-headless/test/run.rb
      - name: Verify repository configuration
        run: |
          set -euo pipefail
          ruby test/repo-config/dependency-hold-backs-mutation.test.rb
          ruby test/repo-config/dependency-hold-backs.test.rb
          ruby test/repo-config/e2e-spec-coverage.test.rb
          ruby test/repo-config/e2e-spec-coverage-mutation.test.rb
          ruby test/repo-config/gitleaks-mutation.test.rb
          ruby test/repo-config/gitleaks-pin-mutation.test.rb
          ruby test/repo-config/gitleaks.test.rb
          ruby test/repo-config/e2e-no-skip.test.rb
          ruby test/repo-config/e2e-no-skip-mutation.test.rb
          ruby test/repo-config/lint-scope.test.rb
          ruby test/repo-config/no-real-clock-sleep-mutation.test.rb
          ruby test/repo-config/no-real-clock-sleep.test.rb
          ruby test/repo-config/package-test-segments.test.rb
          ruby test/repo-config/playwright.test.rb
          ruby test/repo-config/pre-push-routing.test.rb
          ruby test/repo-config/pnpm-workspace-settings-mutation.test.rb
          ruby test/repo-config/pnpm-workspace-settings.test.rb
          ruby test/repo-config/refresh-hold-backs.test.rb
          ruby test/repo-config/retired-migration-authority-refs.test.rb
          ruby test/repo-config/retired-python-agent-refs.test.rb
          ruby test/repo-config/wrangler-path-claims.test.rb
      # The behavioral self-tests of the repository's own shell gates. Their
      # only runner was quality.sh, which #1371 deleted with the pre-push
      # orchestrator; neither the affected matrix nor any package script can
      # see scripts/local-gates or scripts/delivery, so without this step they
      # would be committed tests nothing runs. Each is hermetic (stubbed PATH,
      # throwaway git trees) with one deliberate exception: pre-push-commitlint's
      # cases run the workspace's real commitlint. All six take about twenty
      # seconds.
      - name: Verify the local gate scripts' own behavioral tests
        run: |
          set -euo pipefail
          bash scripts/local-gates/pre-push-affected.test.sh
          bash scripts/local-gates/pre-push-commitlint.test.sh
          bash scripts/local-gates/db-fresh-schema.test.sh
          bash scripts/local-gates/infra-check.test.sh
          bash scripts/local-gates/infra-check-unauthorized.test.sh
          bash scripts/local-gates/contract-drift.test.sh
      # The delivery shell scripts cd.yml ships, and the promotion guard that
      # reads the committed tree rather than a workflow.
      - name: Verify the delivery scripts' own behavioral tests
        run: |
          set -euo pipefail
          bash scripts/delivery/migrate-through-worker.test.sh
          bash scripts/delivery/verify-catalog-schema.test.sh
          bash .github/scripts/bundle-release-worker.test.sh
          bash .github/scripts/staging-smoke-check.test.sh
          bash .github/scripts/release/schema-preflight.test.sh
          bash .github/scripts/release/schema-preflight-log-hygiene.test.sh
          bash .github/scripts/check-e2e-promotion.test.sh
          bash .github/scripts/check-e2e-promotion.sh

  docs:
    name: CI / documentation hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the documentation hygiene checks themselves
        run: |
          set -euo pipefail
          bash scripts/local-gates/check-agents-refs.test.sh
          bash scripts/local-gates/check-docs-paths.test.sh
          bash scripts/local-gates/check-root-allowlist.test.sh
          bash scripts/local-gates/check-spec-references.test.sh
      - name: Check AGENTS.md references, docs paths, the root allowlist and docs/specs liveness
        run: |
          set -euo pipefail
          bash scripts/local-gates/check-agents-refs.sh
          bash scripts/local-gates/check-docs-paths.sh
          bash scripts/local-gates/check-root-allowlist.sh
          bash scripts/local-gates/check-spec-references.sh

  e2e:
    name: CI / browser
    needs: plan
    if: ${{ needs.plan.result == 'success' && (needs.plan.outputs.web == 'true' || needs.plan.outputs.e2e == 'true' || needs.plan.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      # The combined action, matching the only other cache here — setup-node's
      # pnpm store: restore in the step, save in the post step.
      # `actions/cache/restore` has no post step, so nothing ever wrote this key
      # and every runner re-downloaded chromium.
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium
      - name: Install the Playwright browser
        run: |
          set -euo pipefail
          test -x node_modules/.bin/playwright
          node_modules/.bin/playwright install --with-deps chromium
      - name: Build the native browser's hermetic database image
        run: |
          set -euo pipefail
          . packages/test-postgres/postgres-image.env
          docker build -f packages/test-postgres/Dockerfile -t "$TEST_POSTGRES_IMAGE" .
      # `animichi-e2e` is outside the affected matrix because its `test` is the
      # served-Worker lane: it builds apps/web and starts `wrangler dev` itself
      # (e2e/playwright.config.ts `webServer`). Everything this job needs is
      # therefore the package's own scripts, run the way the matrix runs every
      # other package's.
      - name: Run the browser package's own gates
        run: |
          set -euo pipefail
          for script in lint typecheck test; do
            pnpm --filter animichi-e2e run "$script"
          done
      # The live login proof is NOT in this lane, and this is where that is
      # reported rather than left to look like coverage (#1690). The lane owns
      # only `lint typecheck test`, and `test` is hermetic (every transport
      # stubbed, an unroutable Neon Auth stand-in): it never selects
      # `web-neon-login.spec.ts`, so nothing here is skipping — the proof simply
      # does not run in PR CI. It cannot: this workflow holds no credentials of
      # any kind, by committed contract (`.github/test/workflow-credentials.test.rb`
      # rejects `secrets.*` anywhere under `.github/`), and the login proof needs
      # the staging QA identity. The spec itself is fail-closed — selecting it
      # without those variables fails and names them — so the unrun proof is
      # reported here instead of being counted as a pass. Nothing in this step
      # can fail the lane: it reports a fact about the lane, not a verdict.
      - name: Report the live login proof as not-run in this lane
        run: |
          set -euo pipefail
          {
            echo "### Live login proof: NOT RUN in PR CI"
            echo ""
            echo "\`e2e/web-neon-login.spec.ts\` is the only end-to-end proof of the Neon Auth"
            echo "login chain, and it does not run here. It needs the staging QA identity"
            echo "(\`QA_NEON_USER_EMAIL\` + \`QA_NEON_USER_PASSWORD\`), and this workflow holds no"
            echo "credentials — pinned by \`.github/test/workflow-credentials.test.rb\`, which rejects"
            echo "any \`secrets.*\` under \`.github/\`. The spec is fail-closed, so it cannot skip"
            echo "its way to green; its lane simply is not this one."
            echo ""
            echo "Run it locally: \`pnpm --filter animichi-e2e run test:login\`"
            echo "(\`.env.test\` supplies the credentials; see docs/ops/auth-migration-neon.md §4 Path A)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Live login proof not run::e2e/web-neon-login.spec.ts does not run in PR CI (this workflow holds no credentials). Locally: pnpm --filter animichi-e2e run test:login"

  # The schema gate (card B5 / #1363). The chain now lives inside a pnpm project, so the
  # affected matrix does see it — but that lane runs the package's own scripts, and neither of
  # the two questions below is one of them. They are separate steps on purpose: each answers a
  # different question, and a collapsed `run:` block would hide which one failed.
  #
  #   check          every emitted artifact still matches its authored migration, and the
  #                  graph is connected (static; no database)
  #   fresh-schema   the chain still applies, in order, to a pristine database
  db:
    name: CI / schema
    needs: plan
    if: ${{ needs.plan.result == 'success' && (needs.plan.outputs.migrations == 'true' || needs.plan.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      - name: Check the migration graph's integrity
        run: pnpm --filter @animichi/pi-session-neon exec prisma migration check
      # db-fresh-schema.sh fails closed without the offline image, and it reads
      # the tag from the same declaration this builder sources.
      - name: Build the hermetic Postgres+PostGIS+pgvector test image
        run: |
          set -euo pipefail
          . packages/test-postgres/postgres-image.env
          docker build -f packages/test-postgres/Dockerfile -t "$TEST_POSTGRES_IMAGE" .
      - name: Apply the whole chain to a disposable database
        run: bash scripts/local-gates/db-fresh-schema.sh
      # CD's staging job runs the rebuild on every deploy; its gate is SQL, so it is proven
      # against a disposable database on the same image, with only the Neon CLI stubbed.
      - name: Rehearse the staging rebuild's gate on disposable databases
        run: bash infra/database-access/reset-staging-baseline.test.sh

  gitleaks:
    name: CI / security (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # gitleaks-action scans `<base>^..<head>`, so the base commit's parent has
      # to be in the clone; a shallow checkout makes the scan fail or go blind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # gitleaks-action v3.0.0 defaults to 8.24.3 when this is unset — not
          # the release .pre-commit-config.yaml runs, and not the one whose
          # default-rule inventory test/repo-config/gitleaks.test.rb binds to.
          GITLEAKS_VERSION: "8.30.1"
          # No GITLEAKS_LICENSE: the key is required for organization-owned
          # repositories only, and this one belongs to a user account.
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  trufflehog:
    name: CI / security (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified --only-verified --exclude-detectors=Lob

  osv:
    name: CI / security (osv)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

  semgrep:
    name: CI / security (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          enable-cache: false
          prune-cache: "true"
      # The ruleset's self-test resolves one executable name, so semgrep is
      # installed onto PATH rather than invoked through `uv tool run`.
      - name: Install the pinned Semgrep
        env:
          SEMGREP_VERSION: 1.172.0
        run: |
          set -euo pipefail
          uv tool install --no-build "semgrep==$SEMGREP_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The repository's own three ORM-boundary rules only (#999): the public
      # packs are CodeQL's job, and `semgrep ci` refuses `--config` anyway.
      - name: Run the repository's Semgrep ruleset
        run: |
          set -euo pipefail
          semgrep scan --config .semgrep --error .
          bash scripts/semgrep-raw-sql-test.sh

  zizmor:
    name: CI / security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SARIF upload stays off: CodeQL default setup (B3) blocks third-party
      # code-scanning uploads, and a red job is the signal this lane needs.
      #
      # persona pedantic, because two of the audits the three committed
      # workflows are written to satisfy only run there — measured 2026-09-08
      # with 1.30.0 offline: `concurrency-limits`, which wants every job
      # covered by a concurrency group, and `undocumented-permissions`, which
      # wants a comment on the line of every permission wider than the default.
      # The pin gate no longer depends on the persona: 1.30.0 hash-pins under a
      # blanket policy, so an unpinned `actions/checkout@v4` is a high
      # `unpinned-uses` finding at `regular` too. `pedantic` is kept because it
      # is strictly wider and the workflows are clean at it.
      #
      # `annotations: true` is spelled out because the action's own default is
      # `false` (v0.6.3 action.yml) — dropping the input would leave them off,
      # not turn them on. It becomes `--format github`, which is why this job
      # ran without annotations while it was pinned to 1.5.2: that build knew
      # only `plain`, `json` and `sarif` and exited 2 on anything else (run
      # 34001151283). 1.30.0 accepts it, so a finding lands on the diff instead
      # of only in the job log. `advanced-security: false` above is the
      # precondition the action requires before it will honour the input.
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: "1.30.0"
          persona: pedantic
          advanced-security: false
          annotations: true

  # No subject on a merged commit: the PR title expression is empty, and
  # `merge-base origin/main HEAD` is `HEAD`, so the range commitlint would lint is
  # the zero commits the squash already resolved into one.
  commits:
    name: CI / commits
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup-workspace
      - name: Lint the PR's commits
        run: |
          set -euo pipefail
          pnpm exec commitlint --from "$(git merge-base origin/main HEAD)" --to HEAD
      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        if: ${{ env.PR_TITLE != '' }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  security:
    name: Security
    needs: [gitleaks, trufflehog, osv, semgrep, zizmor]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any security check failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  aggregate:
    name: PR Verification
    needs: [plan, affected, contracts, docs, e2e, db, commits, security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any selected gate failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # A merged commit is unattended: a `push` run has no pull request to show its
  # failure on, so it reaches the same alerter the release build, the nightly and
  # CD already use (#678 AC1, #1715) — one deduplicated issue per failing-job set,
  # through the run's own token and no new credential. The `github.event_name`
  # term keeps a pull-request failure where it belongs, on the pull request. Every
  # other job is in `needs` so a failure in any of them reaches it.
  alert-failure:
    name: Ops / failure alert
    needs: [plan, affected, contracts, docs, e2e, db, gitleaks, trufflehog, osv, semgrep, zizmor, commits, security, aggregate]
    if: ${{ always() && github.event_name == 'push' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The key's own (workflow, ref) prefix: two runs that could share an alert
    # must not interleave their read-then-create, and never cancel each other.
    concurrency:
      group: ops-alert-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions: {contents: read, actions: read, issues: write} # read this run's jobs; publish the alert issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the failure alert
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_SELF_JOB: Ops / failure alert
        run: ruby .github/scripts/alert/failure-alert.rb
