# DB pipeline (S0-v2 B4): the db-validate lane moved out of ci.yml into this
# workflow (CI-1 union method). pull_request is pathless by design (merge_group
# runs ignore path filters, so a filtered PR lane would diverge from the queue).
# lint validates the Atlas migration directory (hermetic); build runs the
# migration boundary guard (node:test, hermetic — also part of the edge suite,
# matching the retired db-validate job) plus the optional credentialed
# dry-run against real Neon when the environment secret exists.
# The push paths carry the old migrations filter's read closure: the boundary
# guard reads ci.yml/deploy.yml, docs/ops/migrations.md, README*, Makefile and
# migrations/neon/atlas.sum itself.
name: pipeline-db

on:
  pull_request:
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/pipeline-db.yml"
      - "migrations/**"
      - "docs/ops/migrations.md"
      - "docs/ops/deployment.md"
      - "README*"
      - "Makefile"
      - "workers/edge/test/migration-boundary.test.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

jobs:
  lint:
    name: DB / lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: ./.github/actions/install-atlas
      - name: Validate Atlas migration directory
        run: atlas migrate validate --dir file://migrations/neon

  build:
    name: DB / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run migration boundary guard
        run: node --test workers/edge/test/migration-boundary.test.ts
      - uses: ./.github/actions/install-atlas
      - name: Dry-run Neon migrations
        if: env.NEON_DATABASE_URL != ''
        run: |
          case "$NEON_DATABASE_URL" in
            *\?*) scoped_url="${NEON_DATABASE_URL}&search_path=public" ;;
            *) scoped_url="${NEON_DATABASE_URL}?search_path=public" ;;
          esac
          atlas migrate apply --dry-run --dir "file://migrations/neon" \
            --url "$scoped_url" --revisions-schema public
