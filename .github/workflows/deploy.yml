# Manual production deploy — thin caller of reusable-deploy-component.yml (issue #486).
#
# Six jobs mirror the production promotion stage of ci.yml (deploy-prod … post-prod)
# so the manual path and the CI path exercise identical inputs. Every `with:` /
# `secrets:` / `concurrency:` line here must stay verbatim-identical to ci.yml's
# corresponding job (the guard apps/agent/src/animichi/tests/unit/
# test_deploy_model_env_consistency.py enforces the root job's secret lists).
# Allowed deltas: `needs:` / `if:` that reference ci.yml-only jobs are dropped;
# post-prod keeps needs on the five deploy jobs.
#
# The GitHub `production` environment approval gate lives inside
# reusable-deploy-component.yml (`environment: ${{ inputs.environment }}` at the job
# level), so no separate approval block is needed here.
#
# Concurrency groups are shared with ci.yml's prod jobs: a manual dispatch and a
# CI promotion of the same component can never deploy concurrently.
#
# Deliberately no neon-secrets job here: the infra/neon-secrets stack is
# staging-only today (single branch, no Pulumi.prod.yaml — #912 follow-up
# tracks the production stack). Production branch roles are untouched by it.
name: Deploy (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # SAFE-1 (#937): production eligibility gate. The manual path mirrors the CI
  # promotion path: the dispatch's github.sha is judged against the pinned
  # pre-campaign source revision. Once a campaign revision lands on main, this
  # resolves ineligible and every production job is skipped before checkout,
  # Atlas, Pulumi, or Wrangler can mutate production. Only an explicit
  # pre-campaign invocation (dispatch while main == source_revision) resolves
  # the manifest, and the GitHub `production` environment approval remains
  # mandatory inside reusable-deploy-component.yml.
  production-eligibility:
    name: Production eligibility (SAFE-1)
    uses: ./.github/workflows/reusable-production-eligibility.yml
    with:
      candidate_sha: ${{ github.sha }}
      component: root

  deploy-prod:
    name: Deploy production
    needs: production-eligibility
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: catalog
      environment: production
      pulumi_stack: prod
      working_directory: workers/catalog
      worker_secrets: DATABASE_URL
    secrets:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    concurrency: deploy-prod

  deploy-web-prod:
    name: Deploy web production
    needs: production-eligibility
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: web
      environment: production
      pulumi_stack: prod
      working_directory: apps/web
      build_filter: web
      run_pulumi: false
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    concurrency: deploy-web-prod

  deploy-users-prod:
    name: Deploy users production
    # mirrors ci.yml's intra-prod ordering (root routes to users; users must be live first)
    needs: [production-eligibility, deploy-prod]
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: users
      environment: production
      pulumi_stack: prod
      working_directory: workers/users
      run_pulumi: false
      worker_secrets: |
        DATABASE_URL
        NEON_AUTH_JWKS_URL
    secrets:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
    concurrency: deploy-users-prod

  deploy-maintenance-prod:
    name: Deploy maintenance production
    # mirrors ci.yml's intra-prod ordering (root routes to users; users must be live first)
    needs: [production-eligibility, deploy-prod]
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: maintenance
      environment: production
      pulumi_stack: prod
      working_directory: workers/jobs
      run_pulumi: false
      worker_secrets: AGENT_DATABASE_URL
    secrets:
      AGENT_DATABASE_URL: ${{ secrets.AGENT_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    concurrency: deploy-maintenance-prod

  deploy-root-prod:
    name: Deploy root production
    # mirrors ci.yml's intra-prod ordering (root routes to users; users must be live first)
    needs: [production-eligibility, deploy-users-prod]
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-deploy-component.yml
    with:
      component: root
      environment: production
      pulumi_stack: prod
      working_directory: "."
      run_pulumi: false
      worker_secrets: |
        SUPABASE_DB_URL
        MIMO_API_KEY
        DEEPSEEK_API_KEY
        GOOGLE_MAPS_API_KEY
        LOGFIRE_TOKEN
        CORS_ALLOWED_ORIGIN
      optional_worker_secrets: ""
      post_deploy_secrets: |
        TURNSTILE_SECRET
        ANON_ID_SECRET
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
      CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      ANON_ID_SECRET: ${{ secrets.ANON_ID_SECRET }}
      # #826: name present for parity with ci.yml's deploy-root-prod (the
      # environment-consistency guard enforces identical names across the
      # two). Production has no such environment secret, so the called
      # workflow resolves it empty — expected and fine.
      STAGING_GATE_TOKEN: ${{ secrets.STAGING_GATE_TOKEN }}
    concurrency: deploy-root-prod

  post-prod:
    name: Post-deploy (production)
    needs: [production-eligibility, deploy-prod, deploy-web-prod, deploy-users-prod, deploy-maintenance-prod, deploy-root-prod]
    if: ${{ needs.production-eligibility.outputs.eligible == 'true' }}
    uses: ./.github/workflows/reusable-post-deploy-test.yml
    with:
      environment: production
      suite: smoke
      expected_source_revision: ${{ needs.production-eligibility.outputs.source_revision }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # STAGING_GATE_TOKEN is deliberately NOT passed here (unlike ci.yml's
      # post-staging): the production environment has no such secret, so the
      # called workflow resolves it empty — expected and fine, the WAF gate
      # ruleset only matches the staging hostname. It is `required: false`
      # in the called workflow precisely to allow this.
