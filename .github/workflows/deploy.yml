name: Deploy (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # ── Build frontend ──
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        # Justification: workflow_dispatch only — no untrusted code can trigger this. cache: "" disables caching.
        with:
          node-version: "24"
          cache: ""

      - run: pnpm install --frozen-lockfile

      - name: Build frontend (OpenNext-SSR)
        run: pnpm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

      # ── Apply DB migrations ──
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.26.9"

      - name: Apply database migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # ── Deploy catalog Worker FIRST (before root, as root's [[services]] binding depends on it) ──
      - name: Deploy catalog Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.79.0"
          workingDirectory: workers/catalog
          command: deploy
          environment: production
          # Catalog reaches Postgres via env.DATABASE_URL until a [[hyperdrive]]
          # binding is provisioned (src/index.ts falls back to DATABASE_URL).
          # Sourced from the existing SUPABASE_DB_URL secret.
          secrets: |
            DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

      # ── Deploy users Worker (before root — root's USERS [[services]] binding depends on it) ──
      - name: Deploy users Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.79.0"
          workingDirectory: workers/users
          command: deploy
          environment: production
          secrets: |
            DATABASE_URL
            NEON_AUTH_JWKS_URL
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}

      # ── Verify Dockerfile exists before root deploy ──
      - run: test -f Dockerfile

      # ── Deploy root (edge + container) ──
      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.79.0"
          command: deploy
          environment: production
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_DB_URL
            GEMINI_API_KEY
            GOOGLE_MAPS_API_KEY
            LOGFIRE_TOKEN
            CORS_ALLOWED_ORIGIN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
