# Infra pipeline (S0-v2 B4): the infra/ suite moved out of ci.yml into this
# lane (CI-1 union method). pull_request is pathless by design (merge_group
# runs ignore path filters, so a filtered PR lane would diverge from the queue).
# #911: infra/ IS a pnpm workspace member; installs run against the root
# workspace (root pnpm-lock.yaml, same as the deploy path consumes), so the
# per-job setup installs here are plain `pnpm install --frozen-lockfile`
# from the repo root. The build stage is the Pulumi preview: it is
# credentialed (environment-level secrets) and degrades to a warning when the
# prerequisites are absent, exactly like the retired ci-infra job. Unlike the
# lint/test stages, the preview steps carry a step-level dorny path gate on
# pull_request (equivalent to the retired needs.changes.outputs.infra gate):
# an unrelated PR must not touch the real staging state backend with live
# credentials. push/merge_group always run the preview in full; the job itself
# always runs so the Infra / build check-run is always produced (a skipped job
# would leave a required context permanently pending).
name: pipeline-infra

on:
  pull_request:
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/pipeline-infra.yml"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Infra / lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # #911: infra is a workspace member; root frozen install covers it.
      # Kept as its own step so the typecheck/test steps below can rely on a
      # completed install regardless of job-level working-directory.
      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck infra
        run: npm run typecheck

  test:
    name: Infra / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Infra topology tests
        run: npm test

  # infra/neon-secrets (#912 PR1) is its own standalone pnpm workspace with
  # its own lockfile — NOT a root-workspace member, so the infra jobs above
  # never cover it. This job typechecks it: generate the gitignored Neon
  # provider SDK (pulumi package add — then revert the package.json rewrite
  # it does, see reusable-deploy-neon-secrets.yml for why), install (plain
  # frozen install; the project's workspace yaml `packages: []` makes it
  # self-contained; the SDK's postinstall compiles it because the committed
  # pnpm-workspace.yaml allows '@pulumi/neon' builds), then tsc --noEmit.
  neon-secrets:
    name: Infra / neon-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/neon-secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: infra/neon-secrets/pnpm-lock.yaml
      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      - name: Generate Neon provider SDK
        run: |
          pulumi package add terraform-provider kislerdm/neon
          git checkout -- package.json
      - name: Install neon-secrets dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck neon-secrets
        run: pnpm run typecheck

  build:
    name: Infra / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # dorny/paths-filter lists PR commits/files via the API; a bare
    # contents-read block zeroes that scope and the filter dies with
    # "Resource not accessible by integration" (2026-07-28). Read-only.
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: infra
    env:
      PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      CLOUDFLARE_PULUMI_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On `push`, paths-filter diffs the event's `before` SHA against HEAD
          # using local git (the API listFiles path is pull_request-only), so
          # `before` must be locally reachable; full history keeps the
          # credentials hardening.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Path gate for the credentialed preview (S0-v2 B4 fix round 2, BLOCK-2b):
      # equivalent of the retired needs.changes.outputs.infra gate, at step
      # granularity so the Infra / build check-run is always produced (a
      # path-skipped job emits no check-run, which would strand a required
      # context). Unrelated PRs skip the preview entirely — no live credentials
      # touch the staging state backend; push and merge_group always run it.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: f
        with:
          filters: |
            infra: ['.github/actions/**', '.github/scripts/**', '.github/workflows/pipeline-infra.yml', 'infra/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml']
      - name: Check Pulumi preview prerequisites
        id: pulumi_gate
        run: |
          missing=()
          for name in \
            PULUMI_BACKEND_URL \
            PULUMI_CONFIG_PASSPHRASE \
            CLOUDFLARE_PULUMI_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=pulumi preview skipped::Pulumi preview prerequisites are not fully configured; missing: ${missing[*]}. The deploy path will still take a pre-up state backup, but infra changes merge without a plan diff."
          fi
      # Installs the Pulumi CLI onto PATH without running a command (omitting
      # `command:` is the documented install-only mode) so the plain `pulumi`
      # steps below can use it.
      - name: Install Pulumi CLI
        if: ${{ steps.pulumi_gate.outputs.ready == 'true' && (github.event_name != 'pull_request' || steps.f.outputs.infra == 'true') }}
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      - name: Pulumi preview (staging)
        if: ${{ steps.pulumi_gate.outputs.ready == 'true' && (github.event_name != 'pull_request' || steps.f.outputs.infra == 'true') }}
        # pulumi/actions' automation-api login chokes on the query-string s3:// R2
        # backend URL ('unknown backend cloudUrl format'); the CLI login is the same proven path the deploy uses.
        run: |
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select staging
          pulumi preview --non-interactive --diff
        env:
          # infra/index.ts has no explicit provider: the Cloudflare provider takes
          # credentials from CLOUDFLARE_API_TOKEN and the R2 state backend from the
          # AWS_* pair, so these are rename mappings (CLOUDFLARE_PULUMI_API_TOKEN →
          # CLOUDFLARE_API_TOKEN, R2_* → AWS_*), not the same-named job env above.
          # Dropping them made the preview fail on every run that reached the
          # pulumi_gate (the six gate secrets all exist). Same shape as retired ci-infra.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
      # neon-secrets (#912 PR1): same credential-gated preview for the
      # infra/neon-secrets stack, sharing the infra path gate. The stack does
      # not exist on the R2 backend until the first staging deploy creates it
      # (select-or-init happens only on push; PR previews must stay read-only),
      # so until then this step degrades to a warning — the first plan diff
      # appears after the first deploy.
      - name: Generate Neon provider SDK (neon-secrets preview)
        if: ${{ steps.pulumi_gate.outputs.ready == 'true' && (github.event_name != 'pull_request' || steps.f.outputs.infra == 'true') }}
        working-directory: infra/neon-secrets
        run: |
          pulumi package add terraform-provider kislerdm/neon
          git checkout -- package.json
          pnpm install --frozen-lockfile
      - name: Pulumi preview (neon-secrets staging)
        if: ${{ steps.pulumi_gate.outputs.ready == 'true' && (github.event_name != 'pull_request' || steps.f.outputs.infra == 'true') }}
        working-directory: infra/neon-secrets
        run: |
          pulumi login "$PULUMI_BACKEND_URL"
          if ! pulumi stack select staging 2>/dev/null; then
            echo "::warning::neon-secrets stack 'staging' does not exist yet on the R2 backend (it is created by the first staging deploy on push to main). Skipping preview; the first plan diff appears after that deploy."
            exit 0
          fi
          pulumi preview --non-interactive --diff
        env:
          # Same rename mappings as the infra preview: the Cloudflare
          # provider reads CLOUDFLARE_API_TOKEN, the R2 backend the AWS_* pair.
          # The Neon API key needs no secret — it decrypts from the committed
          # stack config with PULUMI_CONFIG_PASSPHRASE.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
