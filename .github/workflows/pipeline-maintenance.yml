# Maintenance pipeline (S0-v2 B4): the workers/jobs suite moved out of
# ci.yml into this lane (CI-1 union method). pull_request is pathless by design
# (merge_group runs ignore path filters, so a filtered PR lane would diverge
# from the queue); the push paths carry the read closure:
# config.worker.test.ts asserts against the deploy wiring itself — ci.yml,
# deploy.yml, reusable-deploy-component.yml, both deprecated fallback workflows
# and docs/ops/secrets.md are read verbatim by that test, so a change to any of
# those files must re-run this lane (the "a gate that cannot test itself"
# failure the agent_behavior filter already had to fix).
name: pipeline-maintenance

on:
  pull_request:
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/pipeline-maintenance.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/reusable-deploy-component.yml"
      - ".github/workflows/purge-anon-quota-counts.yml"
      - ".github/workflows/purge-anonymous-sessions.yml"
      - ".oxlintrc.json"
      - "docs/ops/secrets.md"
      - "workers/jobs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Maintenance / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Type check (tsc)
        run: pnpm exec tsc --noEmit
        working-directory: workers/jobs
      - name: Oxlint (type-aware, strict)
        run: pnpm run lint:oxlint
        working-directory: workers/jobs

  test:
    name: Maintenance / test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Worker tests (vitest, coverage gate)
        run: pnpm run test:worker
        working-directory: workers/jobs
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: workers/jobs/coverage/lcov.info
          flags: maintenance
          fail_ci_if_error: true
          use_oidc: true

  build:
    name: Maintenance / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Bundle check without deploying: the deploy path ships TS source through
      # `wrangler deploy` (bundled server-side), so this dry-run is the build
      # stage's closest hermetic proxy for "the worker still compiles".
      - name: Bundle check (wrangler deploy dry-run)
        run: pnpm exec wrangler deploy --dry-run --env="" --outdir "$RUNNER_TEMP/maintenance-bundle"
        working-directory: workers/jobs
