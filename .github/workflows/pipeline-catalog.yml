# Catalog pipeline (S0-v2 B4): the workers/catalog suite moved out of ci.yml
# into this lane (CI-1 union method). pull_request is pathless by design
# (merge_group runs ignore path filters, so a filtered PR lane would diverge
# from the queue); the push paths carry the read closure (workers/catalog/** +
# packages/contract/** workspace dependency).
name: pipeline-catalog

on:
  pull_request:
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/pipeline-catalog.yml"
      - ".oxlintrc.json"
      - "migrations/neon/**"
      - "workers/catalog/**"
      - "packages/contract/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Catalog / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Type check (tsc)
        run: pnpm exec tsc --noEmit
        working-directory: workers/catalog
      - name: Oxlint (type-aware, strict)
        run: pnpm run lint:oxlint
        working-directory: workers/catalog

  test:
    name: Catalog / test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Worker tests (vitest, coverage gate)
        run: pnpm run test:worker
        working-directory: workers/catalog
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: workers/catalog/coverage/lcov.info
          flags: catalog
          fail_ci_if_error: true
          use_oidc: true


  spike:
    name: Catalog / spike (Docker Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/install-atlas
      # Reuse the agent's offline arm image (postgis + pgvector, pinned digest);
      # the spike global setup boots it and applies migrations/neon to a clean DB.
      - name: Build hermetic Postgres+PostGIS test image
        run: docker build -f apps/agent/docker/test-postgres/Dockerfile -t animichi-test-postgres:18-3.6-pgvector-0.8.5 .
      - name: Spike suite (PostGIS, atomic publish, schema contract)
        run: pnpm run test:spike
        working-directory: workers/catalog


  # Boots the REAL deploy bundle in workerd (wrangler dev + /healthz). The
  # vitest worker pool evaluates unbundled modules, so bundle-only startup
  # failures (the StringChunk TDZ that blocked staging deploys, 2026-08-05)
  # are invisible to every unit test — only a bundled boot catches them.
  # Ported verbatim from the retired catalog-startup-smoke job in ci.yml
  # (P0 startup smoke; main 836e761f).
  startup-smoke:
    name: Catalog startup smoke (bundled boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Startup smoke (bundled Worker boot + /healthz)
        run: pnpm run test:smoke
        working-directory: workers/catalog

  build:
    name: Catalog / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Bundle check without deploying: the deploy path ships TS source through
      # `wrangler deploy` (bundled server-side), so this dry-run is the build
      # stage's closest hermetic proxy for "the worker still compiles".
      - name: Bundle check (wrangler deploy dry-run)
        run: pnpm exec wrangler deploy --dry-run --env="" --outdir "$RUNNER_TEMP/catalog-bundle"
        working-directory: workers/catalog
