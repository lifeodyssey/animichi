# Reusable workflow (called by ci.yml; not triggered directly).
# #1075 — ring the Builds doorbell. No Wrangler, no Pulumi, no ESC, no secrets.
name: ring-doorbell
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      component: { required: true, type: string }
      environment: { required: true, type: string }
jobs:
  ring:
    timeout-minutes: 30
    name: Ring doorbell
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      # Staging URL only (#1075). Empty for any other environment — fail closed.
      DOORBELL_URL: ${{ inputs.environment == 'staging' && vars.DOORBELL_STAGING_URL || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Request OIDC token for the doorbell audience
        env:
          AUDIENCE: "animichi:github-actions:doorbell"
        run: |
          curl -sSfL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
            | jq -r .value > "$RUNNER_TEMP/oidc-token"
      - name: Ring doorbell and wait for the build
        env:
          # zizmor: do not expand ${{ }} inside run.
          COMPONENT: ${{ inputs.component }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DOORBELL_URL" ]; then
            echo "::error::vars.DOORBELL_STAGING_URL is empty (staging doorbell URL required)"
            exit 1
          fi
          body="$(printf '{"component":"%s","commit":"%s"}' "$COMPONENT" "$COMMIT")"
          code="$(curl -sS -o "$RUNNER_TEMP/doorbell-start.json" -w '%{http_code}' -X POST \
            "$DOORBELL_URL/builds" \
            -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc-token")" \
            -H 'content-type: application/json' \
            -d "$body")"
          if [ "$code" != "200" ]; then
            echo "::error::doorbell returned HTTP $code"
            cat "$RUNNER_TEMP/doorbell-start.json"
            exit 1
          fi
          id="$(jq -r .buildId "$RUNNER_TEMP/doorbell-start.json")"
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::doorbell response missing buildId"
            cat "$RUNNER_TEMP/doorbell-start.json"
            exit 1
          fi
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code="$(curl -sS -o "$RUNNER_TEMP/doorbell-status.json" -w '%{http_code}' \
              "$DOORBELL_URL/builds/$id" \
              -H "Authorization: Bearer $(cat "$RUNNER_TEMP/oidc-token")")"
            if [ "$code" != "200" ]; then
              echo "::error::doorbell status returned HTTP $code"
              cat "$RUNNER_TEMP/doorbell-status.json"
              exit 1
            fi
            status="$(jq -r .status "$RUNNER_TEMP/doorbell-status.json")"
            case "$status" in
              success)
                echo "doorbell build $id succeeded"
                exit 0
                ;;
              failed|failure|cancelled|error)
                echo "::error::doorbell build $id $status"
                cat "$RUNNER_TEMP/doorbell-status.json"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::doorbell build $id timed out after 20 minutes"
          cat "$RUNNER_TEMP/doorbell-status.json"
          exit 1
