# Reusable workflow (called by ci.yml; not triggered directly). '_' prefix = internal.
name: deploy-component
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      component: { required: true, type: string }
      working_directory: { required: true, type: string }
      environment: { required: true, type: string }
      pulumi_stack: { required: true, type: string }
      build_filter: { required: false, type: string, default: "" }
      run_pulumi: { required: false, type: boolean, default: true }
      worker_secrets: { required: false, type: string, default: "" }
      optional_worker_secrets:
        description: >-
          Newline list of secret NAMES that are uploaded only when their value
          is non-empty. For diagnostic-only secrets: a missing value must
          never fail the deploy — the post-deploy check reports it loudly
          instead. Names listed here must NOT also appear in worker_secrets.
        type: string
        required: false
        default: ""
      # Newline-separated list of secret names that must be pushed via a raw
      # `wrangler secret put` step AFTER "Deploy Worker" (see that step for
      # why). Each name here must also have a matching entry in `secrets:`
      # below and in the `env:` map of the "Push post-deploy secrets" step —
      # adding a new post-deploy secret means adding it in those three places.
      post_deploy_secrets: { required: false, type: string, default: "" }
    secrets:
      NEON_DATABASE_URL:
        required: false
      # #912 PR2: production-only — the maintenance Worker's AGENT_DATABASE_URL
      # is still uploaded from the same-named GitHub environment secret until
      # the production-role cutover. Staging reads its DSN from the Secrets
      # Store binding in workers/jobs/wrangler.toml and passes nothing.
      AGENT_DATABASE_URL:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_PULUMI_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      PULUMI_CONFIG_PASSPHRASE:
        required: false
      PULUMI_BACKEND_URL:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      NEON_AUTH_JWKS_URL:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_ANON_KEY:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      SUPABASE_DB_URL:
        required: false
      MIMO_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      GOOGLE_MAPS_API_KEY:
        required: false
      LOGFIRE_TOKEN:
        required: false
      CORS_ALLOWED_ORIGIN:
        required: false
      TURNSTILE_SECRET:
        required: false
      ANON_ID_SECRET:
        required: false
      # #826 mechanism — this secret MUST be declared here AND passed by
      # staging callers in ci.yml (see below); the job-level `environment:`
      # then supplies the value. Declaring alone is not enough — the name
      # must also appear in the caller's `secrets:` map — but omitting the
      # declaration while expecting the environment to fill the name was
      # #886's fix and left it empty, 403ing every staging smoke.
      STAGING_GATE_TOKEN:
        required: false
      # STAGING_GATE_TOKEN is sent as the `x-staging-key` header by the
      # Smoke step so the staging WAF gate (#529/#559, `stagingGateEnabled`
      # in infra) lets web/root smokes through on staging (#826).
      #
      # Resolution mechanism — DECLARE + CALLER-PASS, then the job-level
      # `environment:` overrides the value: GitHub fills a name in the
      # callable-workflow secrets context ONLY for names that appear BOTH
      # under `on.workflow_call.secrets` AND in the caller's `secrets:` map.
      # When
      # the name is present, the job's `environment:` wins over whatever the
      # caller passed (verified: users' NEON_AUTH_JWKS_URL resolves to the
      # staging-environment value, not the caller's, under exactly this
      # pattern — see the "Report resolved secret shape" step's #527 note).
      # With the declaration absent (#886's fix), the environment secret
      # NEVER fills the name, and the `STAGING_GATE_TOKEN` lookup is empty,
      # and the staging WAF 403s the smoke. So: staging callers in ci.yml
      # pass it explicitly (they are the only ones that need it), and this
      # job's `environment: ${{ inputs.environment }}` resolves the
      # staging-environment value. `required: false` keeps production
      # callers (no such environment secret — empty is expected and fine)
      # free to omit it.
jobs:
  deploy:
    timeout-minutes: 30
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the production path can detach onto the pinned
          # pre-campaign source revision without a second network fetch.
          fetch-depth: 0
      # SAFE-1 (#937): production only — resolve the pinned pre-campaign
      # release manifest (content-addressed GitHub blob, never the working
      # tree), then detach the worktree onto the pinned source revision and
      # verify HEAD and atlas.sum BEFORE any mutation can start. A campaign
      # revision is ineligible and fails here, before Atlas/Pulumi/Wrangler.
      # Staging keeps the caller-SHA behavior (no resolve, implicit checkout).
      - name: Resolve pinned production release manifest
        if: ${{ inputs.environment == 'production' }}
        id: release
        shell: bash
        env:
          TARGET_COMPONENT: ${{ inputs.component }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          verdict="$(bash .github/scripts/release-eligibility.sh "$TARGET_COMPONENT" "${{ github.sha }}")"
          deploy="$(echo "$verdict" | python3 -c 'import json,sys; print(json.load(sys.stdin)["eligibility"]["deploy"])')"
          if [ "$deploy" != "true" ]; then
            echo "::error::production ineligible: candidate ${{ github.sha }} is not the pinned pre-campaign source revision (SAFE-1). Refusing to deploy before any production mutation."
            exit 1
          fi
          {
            echo "source_revision=$(echo "$verdict" | python3 -c 'import json,sys; print(json.load(sys.stdin)["source_revision"])')"
            echo "atlas_target=$(echo "$verdict" | python3 -c 'import json,sys; print(json.load(sys.stdin)["atlas"]["target"])')"
            echo "atlas_digest=$(echo "$verdict" | python3 -c 'import json,sys; print(json.load(sys.stdin)["atlas"]["digest_sha256"])')"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout pinned production source
        if: ${{ inputs.environment == 'production' }}
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_REVISION"
          head="$(git rev-parse HEAD)"
          test "$head" = "$SOURCE_REVISION" || {
            echo "::error::production HEAD $head does not match pinned source revision $SOURCE_REVISION"
            exit 1
          }
          echo "Checked out pinned pre-campaign source $SOURCE_REVISION (detached)"
      - name: Verify pinned atlas.sum
        if: ${{ inputs.environment == 'production' }}
        shell: bash
        env:
          ATLAS_DIGEST: ${{ steps.release.outputs.atlas_digest }}
        run: |
          set -euo pipefail
          cd migrations/neon
          shasum -a 256 -c atlas.sum
          actual="$(shasum -a 256 atlas.sum | awk '{print $1}')"
          test "$actual" = "$ATLAS_DIGEST" || {
            echo "::error::atlas.sum SHA-256 $actual does not match pinned manifest digest $ATLAS_DIGEST"
            exit 1
          }
      - uses: ./.github/actions/setup
      # #527/#528: this job declares `environment: ${{ inputs.environment }}`
      # above, which is what makes environment-scoped secrets resolve here
      # at all (GitHub: "If you include environment in the reusable workflow
      # at the job level, the environment secret will be used, and not the
      # secret passed from the caller workflow" —
      # https://docs.github.com/en/actions/using-workflows/reusing-workflows#access-to-secrets).
      # #527's original diagnosis assumed this resolution was broken; a real
      # workflow_dispatch diagnostic run (staging) proved it already works —
      # NEON_AUTH_JWKS_URL and NEON_DATABASE_URL both resolved to their
      # staging-environment values even when the caller job (which has no
      # environment context of its own) passed an empty stand-in.
      #
      # This step keeps that verification live on every future deploy —
      # staging AND production — WITHOUT ever printing a raw value:
      #   - NEON_DATABASE_URL / NEON_AUTH_JWKS_URL / PULUMI_BACKEND_URL /
      #     LOGFIRE_TOKEN are high-entropy, arbitrary-content secrets where
      #     length carries no meaning of its own. For these, print the first
      #     8 hex chars of a sha256 of the value instead of its length: two
      #     runs with the SAME hash prefix are, for all practical purposes,
      #     the same secret; two DIFFERENT prefixes are provably different
      #     values — genuine discriminating power a length check does not
      #     have (our own earlier diagnostic run showed repo-level and
      #     staging-environment NEON_DATABASE_URL both at len=146 — a
      #     collision length tells you nothing). For a HIGH-ENTROPY value,
      #     32 bits of a preimage-resistant hash cannot be brute-forced back
      #     to the secret.
      #   - This is NOT a pattern to extend to every secret without
      #     thinking: decide per variable, twice, before ever printing
      #     anything about it —
      #       (1) does its LENGTH carry semantic meaning on its own?
      #           `TURNSTILE_SECRET` is the standing counter-example already
      #           documented in the "Preflight - post-deploy secrets" step
      #           below — Site Key (24 chars) vs. Secret Key (35 chars) is
      #           itself sensitive information, so that secret must never
      #           get a length (or hash) line here or anywhere else in a
      #           public log.
      #       (2) is the value actually HIGH-ENTROPY / unenumerable? The
      #           hash trick above only works because a Neon connection
      #           string or a Logfire token is drawn from a space too large
      #           to brute-force. An enumerable value — an origin, a
      #           hostname, a boolean-ish flag — has a small, guessable
      #           value space; hashing it doesn't protect it, it just hands
      #           an attacker a dictionary-attackable commitment to the
      #           value. Never apply this pattern to that class of secret.
      #   - CORS_ALLOWED_ORIGIN is deliberately excluded from this step
      #     entirely: as of #528 (P1-A) it is a plain `vars` entry in
      #     `wrangler.toml` for staging (a domain name, not a secret) and
      #     only remains a GH environment secret for production — mixing
      #     the two sources here would need per-environment branching for
      #     no real benefit.
      #
      # None of this claims the two environments hold different VALUES on
      # its own — a matching hash prefix is strong (not certain, given
      # truncation) evidence of equality, and a GitHub secret's content can
      # never be read back once set, by design. What this step reliably
      # proves is per-environment RESOLUTION (each environment's own secret,
      # not a caller-passed one, is what gets used here); the hash prefixes
      # additionally let a human compare two runs' output without needing
      # the raw values. Whether staging and production were actually
      # provisioned with distinct values remains a provisioning fact -- see
      # the PR description's explicit "unverified" note on that point.
      - name: Report resolved secret shape (hash prefixes / booleans only — never raw values)
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_COMPONENT: ${{ inputs.component }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
        run: |
          hash8() {
            if [ -z "$1" ]; then echo "unset"; return; fi
            printf '%s' "$1" | sha256sum | cut -c1-8
          }
          echo "environment=$TARGET_ENVIRONMENT component=$TARGET_COMPONENT"
          echo "  NEON_DATABASE_URL   set=$([ -n "$NEON_DATABASE_URL" ] && echo true || echo false) sha256_8=$(hash8 "$NEON_DATABASE_URL")"
          echo "  NEON_AUTH_JWKS_URL  set=$([ -n "$NEON_AUTH_JWKS_URL" ] && echo true || echo false) sha256_8=$(hash8 "$NEON_AUTH_JWKS_URL")"
          echo "  PULUMI_BACKEND_URL  set=$([ -n "$PULUMI_BACKEND_URL" ] && echo true || echo false) sha256_8=$(hash8 "$PULUMI_BACKEND_URL")"
          echo "  LOGFIRE_TOKEN       set=$([ -n "$LOGFIRE_TOKEN" ] && echo true || echo false) sha256_8=$(hash8 "$LOGFIRE_TOKEN")"
      # Validates BEFORE anything deploys — including before "Atlas migrate"
      # below, which is the whole point: a failure here must land before any
      # side effect (DB migration OR Worker deploy) exists to half-apply. A
      # failure in "Push post-deploy secrets to Worker" further down, by
      # contrast, necessarily runs after "Deploy Worker" and so cannot
      # un-deploy a Worker that already shipped — this step is what actually
      # backs the "validates before anything deploys" claim.
      #
      # TURNSTILE_SECRET and ANON_ID_SECRET are both only read from inside
      # `handleAnonymousV1` (workers/edge/src/app.ts), which `resolveAnonymous` only
      # reaches when this environment's `ANON_ACCESS_ENABLED` var is "true"
      # (workers/edge/src/identity/auth.ts:anonymousEnabled — both flag AND secret are required).
      # `wrangler.toml`'s `env.production.vars` currently sets it to "false",
      # so both secrets are genuinely inert there today; hard-failing
      # deploy-root-prod over a secret production doesn't read would be a
      # self-inflicted outage. Read the live flag out of the checked-out
      # `workers/edge/wrangler.toml` instead of hardcoding prod=off/staging=on, so this
      # adapts automatically if the flag value changes. (If a future
      # post_deploy_secrets entry is NOT gated by this same flag, this
      # all-or-nothing check needs to move from "gate the whole list" to
      # "gate per secret name.")
      - name: Preflight - post-deploy secrets
        if: ${{ inputs.post_deploy_secrets != '' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          TARGET_COMPONENT: ${{ inputs.component }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          POST_DEPLOY_SECRETS: ${{ inputs.post_deploy_secrets }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          ANON_ID_SECRET: ${{ secrets.ANON_ID_SECRET }}
        run: |
          # Always attempted, not just for component == root: gating this on
          # the component name meant every OTHER component was permanently
          # stuck on the soft-warn branch below with no way to ever hard-fail
          # — the gate loses its own basis for judgment (and silently
          # disarms) the instant it stops being root-specific. Today only
          # root ever populates post_deploy_secrets (this whole step is
          # skipped otherwise via the `if:` above), so this has no live
          # effect yet, but the check itself must not depend on component to
          # be correct.
          # component/root keeps its config at workers/edge/wrangler.toml
          # (#853); every other component finds its own wrangler.toml in its
          # working directory. Resolve by existence so this never depends on
          # the component name.
          toml="wrangler.toml"
          [ -f "workers/edge/wrangler.toml" ] && toml="workers/edge/wrangler.toml"
          anon_flag=$(awk -F'"' -v want="[env.${TARGET_ENVIRONMENT}.vars]" '
            $0 == want { in_block=1; next }
            /^\[/ { in_block=0 }
            in_block && $1 ~ /^ANON_ACCESS_ENABLED[ \t]*=/ { print $2 }
          ' "$toml" 2>/dev/null || true)
          # Ambiguity is fail-closed, not fail-open: this parser only
          # understands one exact TOML shape (double-quoted string inside an
          # `[env.<name>.vars]` block in wrangler.toml). Any drift from that —
          # single-quoted or unquoted TOML values, a trailing-space section
          # header, a wrangler.toml that doesn't exist here at all (e.g.
          # apps/web is already wrangler.jsonc), or the root config moving to
          # jsonc too — must NOT silently read as "" and fall through to the
          # soft-warn branch below, which would quietly turn a hard gate into
          # a warning exactly like the failure modes this repo has already
          # been bitten by. Treat anything other than a clean "true"/"false"
          # as a parse failure and stop.
          if [ "$anon_flag" != "true" ] && [ "$anon_flag" != "false" ]; then
            echo "::error::Could not determine ANON_ACCESS_ENABLED for component=$TARGET_COMPONENT, environment=$TARGET_ENVIRONMENT from wrangler.toml (parsed value: '$anon_flag', expected exactly \"true\" or \"false\"). This gates whether TURNSTILE_SECRET/ANON_ID_SECRET are load-bearing here — refusing to guess. Fix the parser (or this check) if the config shape changed (e.g. moved to wrangler.jsonc, or the TOML value is no longer a plain double-quoted true/false)."
            exit 1
          fi
          missing=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            value="${!name-}"
            if [ -z "$value" ]; then
              if [ "$anon_flag" = "true" ]; then
                echo "::error::$name is empty/unset for component=$TARGET_COMPONENT, environment=$TARGET_ENVIRONMENT, where ANON_ACCESS_ENABLED=\"true\" makes it load-bearing (workers/edge/src/protect/turnstile.ts fails CLOSED — every anonymous request 403s without TURNSTILE_SECRET once ANON_ID_SECRET lets resolveAnonymous through at all). Refusing to start the deploy without it. Set it with: gh secret set $name"
                missing=1
              else
                echo "::warning::$name is empty/unset for component=$TARGET_COMPONENT, environment=$TARGET_ENVIRONMENT, but ANON_ACCESS_ENABLED is not \"true\" there, so this environment's code path never reads it (see workers/edge/src/identity/auth.ts:anonymousEnabled). Soft warning only; the post-deploy push step will skip it."
              fi
              continue
            fi
            # TURNSTILE_SECRET-specific: a GitHub secret is write-only — once
            # set, nobody (not even this workflow, on a later run) can read it
            # back to eyeball whether it's actually the Turnstile Secret Key
            # (35 chars) rather than the public Site Key (24 chars, meant to
            # ship to the client — see apps/web/src/components/
            # TurnstileGate.tsx). This step is the only place that ever holds
            # the raw value, so it's the only place that can ever answer that
            # question. Cloudflare's siteverify endpoint doubles as a
            # validity check: probing it with a deliberately-wrong response
            # token distinguishes "bad secret" (`invalid-input-secret`) from
            # "secret is fine, token just wasn't real" (`invalid-input-response`)
            # without ever needing a real Turnstile widget solve.
            #
            # This is deliberately NOT treated with the same fail-closed rule
            # as the ANON_ACCESS_ENABLED parser above: a local TOML parse
            # failure is a semantic ambiguity that never self-heals, but a
            # failed network call to a third party is overwhelmingly a
            # transient blip — retry with backoff, and only `invalid-input-
            # secret` (an unambiguous, non-transient verdict) hard-fails.
            # Exhausting retries with no verdict either way means the
            # validator was unreachable, which is not evidence the secret
            # itself is wrong — warn and let the deploy proceed rather than
            # blocking, say, an unrelated production hotfix (this same check
            # also runs in deploy.yml's manual production path) on a
            # siteverify outage that would leave guardTurnstile 403ing every
            # anonymous request regardless of whether this deploy happens.
            if [ "$name" = "TURNSTILE_SECRET" ] && [ "$anon_flag" = "true" ]; then
              turnstile_verdict=""
              shape_seen="false"
              attempt=1
              while [ "$attempt" -le 3 ]; do
                # Secret piped via stdin (`secret@-`), never as a curl argv
                # value — argv can leak through process listings on the
                # runner; stdin doesn't. Never echo $value or the raw
                # response: the response carries no secret field, but only
                # the parsed verdict is printed, on principle.
                turnstile_probe=$(printf '%s' "$value" | curl -sS --max-time 10 \
                  --data-urlencode "secret@-" \
                  --data-urlencode "response=preflight-probe-not-a-real-token" \
                  https://challenges.cloudflare.com/turnstile/v0/siteverify 2>/dev/null || true)
                # Shape sentinel: siteverify's response always has a
                # top-level "success" boolean today. If we never see it
                # across every retry, that's not (only) a transient network
                # blip — it's a sign Cloudflare's response shape changed
                # under us, which would otherwise degrade this whole check to
                # a permanently silent warning with no way to notice.
                printf '%s' "$turnstile_probe" | grep -q '"success"' && shape_seen="true"
                if printf '%s' "$turnstile_probe" | grep -q '"invalid-input-secret"'; then
                  turnstile_verdict="invalid"
                  break
                elif printf '%s' "$turnstile_probe" | grep -q '"invalid-input-response"'; then
                  turnstile_verdict="valid"
                  break
                fi
                attempt=$((attempt + 1))
                [ "$attempt" -le 3 ] && sleep $((attempt * 2))
              done
              if [ "$turnstile_verdict" = "invalid" ]; then
                echo "::error::TURNSTILE_SECRET failed Cloudflare siteverify validation for component=$TARGET_COMPONENT, environment=$TARGET_ENVIRONMENT (error-code: invalid-input-secret). This is what happens when the stored value is a Site Key (24 chars, public, meant for the client) instead of the Secret Key (35 chars, private) — or any other string siteverify doesn't recognize as a real secret. Refusing to deploy with it. Re-provision with: gh secret set TURNSTILE_SECRET"
                missing=1
              elif [ "$turnstile_verdict" = "valid" ]; then
                echo "TURNSTILE_SECRET passed Cloudflare siteverify validation for component=$TARGET_COMPONENT, environment=$TARGET_ENVIRONMENT (probe token was correctly rejected as invalid-input-response, meaning the secret itself was accepted)."
              elif [ "$shape_seen" = "true" ]; then
                echo "::warning::Could not reach Cloudflare's siteverify endpoint to validate TURNSTILE_SECRET after 3 attempts for component=$TARGET_COMPONENT, environment=$TARGET_ENVIRONMENT (network failure or endpoint outage) — treating this as validator unavailability, not evidence the secret itself is wrong. Proceeding without this specific check; the empty-value check above still applies."
              else
                echo "::warning::Cloudflare's siteverify response never contained a \"success\" field across 3 attempts for component=$TARGET_COMPONENT, environment=$TARGET_ENVIRONMENT — this looks like the response SHAPE changed, not just a network blip (this check's grep patterns assume today's known shape). Treating as validator-unavailable for now, but this needs someone to look at whether the probe logic itself is stale, not just retry later. Proceeding without this specific check; the empty-value check above still applies."
              fi
            fi
          done <<< "$POST_DEPLOY_SECRETS"
          if [ "$missing" = "1" ]; then
            exit 1
          fi
      # B5 (2026-08-05): a 35-character Turnstile SECRET key was once stored in
      # the VITE_TURNSTILE_SITE_KEY variable, and Vite inlined it into the
      # public client bundle at build time. The shape rules now live in
      # .github/scripts/vite-env-preflight.sh (with behavioral tests in
      # vite-env-preflight.test.sh, run by reusable-security.yml) — never
      # inline shell in the YAML, or no test can ever exercise it. The script
      # validates shapes, not just presence: VITE_TURNSTILE_SITE_KEY must be
      # exactly 24 chars (35 = the SECRET, refused with a dedicated error; any
      # other length is fail-closed), every other VITE_* value is checked by
      # three predicates: the Turnstile-specific shape, PEM/private-key
      # markers, and the universal looks_like_secret_material rule (known
      # credential prefixes, exactly-35-character values — the Turnstile
      # SECRET-key length by the repo's length-only contract, whatever the
      # character set — and long base64/hex blobs; fail-closed, with an
      # explicit per-variable secret_shape_allowlist in the script for known
      # false-positive shapes like the 36-char Cloudflare beacon UUID), and
      # VITE_NEON_AUTH_BASE_URL / VITE_SHOWCASE_MODE keep their presence/value
      # rules. Names only in the log, never values: these are not secrets
      # (Vite puts them in a public bundle by definition), but there is no
      # reason to copy deploy configuration into a world-readable Actions log.
      - name: Preflight - Vite build environment
        if: ${{ inputs.build_filter != '' }}
        env:
          TARGET_COMPONENT: ${{ inputs.component }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
          VITE_CATALOG_URL: ${{ vars.VITE_CATALOG_URL }}
          VITE_USERS_URL: ${{ vars.VITE_USERS_URL }}
          VITE_AGENT_URL: ${{ vars.VITE_AGENT_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_NEON_AUTH_BASE_URL: ${{ vars.VITE_NEON_AUTH_BASE_URL }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
          VITE_SHOWCASE_MODE: ${{ vars.VITE_SHOWCASE_MODE }}
        run: bash .github/scripts/vite-env-preflight.sh VITE_SITE_ORIGIN VITE_CATALOG_URL VITE_USERS_URL VITE_AGENT_URL VITE_TURNSTILE_SITE_KEY VITE_NEON_AUTH_BASE_URL VITE_CF_BEACON_TOKEN VITE_SHOWCASE_MODE
      - name: Build component
        if: ${{ inputs.build_filter != '' }}
        env:
          BUILD_FILTER: ${{ inputs.build_filter }}
          VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
          VITE_CATALOG_URL: ${{ vars.VITE_CATALOG_URL }}
          VITE_USERS_URL: ${{ vars.VITE_USERS_URL }}
          VITE_AGENT_URL: ${{ vars.VITE_AGENT_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_NEON_AUTH_BASE_URL: ${{ vars.VITE_NEON_AUTH_BASE_URL }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
          VITE_SHOWCASE_MODE: ${{ vars.VITE_SHOWCASE_MODE }}
        run: pnpm --filter "$BUILD_FILTER" build
      - name: Atlas migrate
        # NOTE: secrets context is NOT allowed in step `if:` (GitHub compile-time
        # error → startup_failure). Guard inside run via the env var instead.
        #
        # #516: this Neon database also hosts `neon_auth` (9 tables Neon Auth
        # itself provisions and owns — Atlas must never touch them) alongside
        # `public` (the schema Atlas actually manages). Without scoping,
        # Atlas's "is this database clean" check inspects EVERY schema it can
        # see, finds `neon_auth` unaccounted for by migrations/neon, and aborts
        # with "connected database is not clean: found schema ...". The fix
        # is `search_path=<schema>` on the connection URL — confirmed
        # empirically against the exact pinned v0.30.0 binary (not guessed):
        # a local Postgres with an extra `neon_auth`-shaped schema (+ a table
        # in it) reproduced the identical error without this param, and
        # applying with `search_path=public` both (a) fixed it and (b) left
        # the other schema's table completely untouched afterward (verified
        # with \dt). Also confirmed it tolerates the specific leftover this
        # database has: an empty, orphaned `atlas_schema_revisions` SCHEMA
        # (as opposed to the `public.atlas_schema_revisions` TABLE this
        # `--revisions-schema public` flag expects) from an earlier
        # apply that ran without this flag — `search_path=public` scopes past
        # that stray schema too, with no separate DROP SCHEMA cleanup step
        # needed. Deliberately NOT `--allow-dirty`: that flag suppresses the
        # cleanliness check for the whole database, including future genuine
        # dirtiness in `public` itself — scoping the URL only removes
        # `neon_auth` (something Atlas was never supposed to see) from
        # consideration, not the safety check itself.
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL not set — skipping atlas migrate"; exit 0
          fi
          curl -sSfL --proto '=https' --proto-redir '=https' "https://release.ariga.io/atlas/atlas-community-linux-amd64-v0.30.0" -o /usr/local/bin/atlas
          # Hardcoded, not fetched alongside the binary from the same channel
          # (that would only prove the download wasn't corrupted in transit,
          # not that the upstream artifact itself is the one this repo
          # reviewed). Keep synchronized with
          # apps/agent/src/animichi/tests/atlas_helper.py's ATLAS_LINUX_AMD64_SHA256
          # and ci.yml's two "Install pinned Atlas CLI" steps — all four
          # pin the same v0.30.0 linux/amd64 artifact.
          echo "dbaaf350634304d4bf92753559261a67afb399fe4ff0ea6ae5bb5d1ce6e0011a  /usr/local/bin/atlas" \
            | sha256sum --check --strict
          chmod +x /usr/local/bin/atlas
          case "$NEON_DATABASE_URL" in
            *\?*) scoped_url="${NEON_DATABASE_URL}&search_path=public" ;;
            *) scoped_url="${NEON_DATABASE_URL}?search_path=public" ;;
          esac
          # 486: the manual thin-caller path has no db-validate job, so validate here (cheap, seconds) before mutating.
          atlas migrate validate --dir "file://migrations/neon"
          # SAFE-1 (#937): production applies the PINNED pre-campaign Atlas
          # target from the release manifest (never the campaign head); staging
          # keeps applying the caller SHA's migrations as before.
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            atlas migrate apply --dir "file://migrations/neon" --url "$scoped_url" \
              --revisions-schema public --to-version "$ATLAS_TARGET"
          else
            atlas migrate apply --dir "file://migrations/neon" --url "$scoped_url" --revisions-schema public
          fi
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          ATLAS_TARGET: ${{ steps.release.outputs.atlas_target }}
      # Installs the Pulumi CLI onto PATH without running a command (omitting
      # `command:` is the documented install-only mode) so the plain `pulumi`
      # steps below can use it.
      - name: Install Pulumi CLI
        if: ${{ inputs.run_pulumi }}
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      # #522: `pulumi up` below failed on every run with "It looks like the
      # Pulumi SDK has not been installed" because infra/node_modules never
      # existed. pulumi/actions@v7 stopped auto-installing project
      # dependencies — verified against the v7 README, which states the
      # action "will no longer run npm ci | npm install | pip3 install |
      # pipenv install" and that this is now deferred to a dedicated
      # dependency-installation step. `pulumi stack export` just above does
      # NOT need this (it only serializes existing state, it never executes
      # the Pulumi *program*), so placing the install here — after the CLI
      # install, before `up` — changes nothing about the #485/#492 ordering
      # guarantee that the rollback backup always lands before `up` mutates
      # anything.
      #
      # #911: `infra/` IS a pnpm-workspace member now (listed in
      # `pnpm-workspace.yaml`, deps absorbed into the root `pnpm-lock.yaml`),
      # so this install runs against the root workspace exactly like the
      # checkout's `setup` action does — no `--ignore-workspace`, no
      # `infra/pnpm-lock.yaml`. It is kept as a run_pulumi-gated step (rather
      # than removed) so the "deps installed before `up`" invariant stays
      # explicit; it is a fast no-op once the root store is cached.
      #
      # `--ignore-scripts` disables package lifecycle scripts (pre/postinstall)
      # for this install (SonarCloud githubactions:S6505, a real finding, not
      # a false positive — flagged the un-flagged install on this exact PR).
      # Verified this does NOT break the Pulumi runtime: re-ran this same
      # install with the flag added and `pulumi preview` against it still got
      # past SDK loading to the identical downstream config error as without
      # the flag (neither `@pulumi/pulumi` nor `@pulumi/cloudflare` needs a
      # lifecycle script — pnpm's own build-script gate already no-ops here
      # too, logging "Ignored build scripts: protobufjs@7.6.5" on a plain
      # install with no flag at all).
      - name: Install infra dependencies (root workspace)
        if: ${{ inputs.run_pulumi }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pulumi stack export (rollback backup)
        # Snapshot state BEFORE `up` mutates it, so a bad apply can be rolled
        # back with `pulumi stack import` from the R2 object this step writes.
        # #485.
        #
        # Deliberately NOT a GitHub Actions artifact: this repo is a PUBLIC
        # repository (verified — `gh repo view --json visibility`), and a
        # public repo's workflow artifacts are downloadable by ANY logged-in
        # GitHub account, not just people with repo access. `infra/index.ts`
        # exports `cloudflareAccountId`/`cloudflareZoneId`/`webDomain` in
        # PLAINTEXT and `catalogDatabaseUrl` as `secure:` ciphertext — an
        # artifact would mean publishing the plaintext identifiers (a
        # targeted-abuse/social-engineering surface, even though not
        # credentials themselves) and an offline-crackable Neon connection
        # string on every catalog deploy. Writing to the SAME R2 bucket the
        # Pulumi backend already lives in (derived from `PULUMI_BACKEND_URL`,
        # which is `s3://<bucket>?...` — see `pulumi login` below) keeps this
        # exactly as private as the Pulumi state itself already is, with zero
        # new exposure surface, using credentials (`R2_ACCESS_KEY_ID`/
        # `R2_SECRET_ACCESS_KEY`) already present in this step's env.
        #
        # NOTE: `run_pulumi` defaults to true and only `component: catalog`
        # jobs leave it at that default — web/users/root all pass
        # `run_pulumi: false` (see ci.yml). So in practice this step only ever
        # runs under the catalog deploy jobs; look there for the backup, not
        # under a root/web/users run.
        if: ${{ inputs.run_pulumi }}
        # #933: `pulumi stack select "$PULUMI_STACK"` must run from inside the
        # `infra/` project directory. From the repo root there is no
        # Pulumi.yaml for pulumi to resolve the bare "staging" stack name
        # against, so every run died with "pass the fully qualified name
        # (organization/project/stack)" and the rollback backup (and the
        # subsequent `up`) never ran. Mirroring the "Pulumi up" step's
        # work-dir: infra makes `staging` resolve to seichijunrei-infra/staging
        # exactly like the deploy action does.
        working-directory: infra
        env:
          # Least-privilege split (#674): Pulumi only touches R2/DNS/Routes/
          # Rulesets — it gets its own token instead of the wrangler CI token.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          PULUMI_STACK: ${{ inputs.pulumi_stack }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          # Same empty-guard pattern as the "Atlas migrate" step above: this
          # secret is `required: false` at the workflow_call boundary, so a
          # caller that omits it must not crash `pulumi login` with an empty
          # backend URL.
          if [ -z "$PULUMI_BACKEND_URL" ]; then
            echo "PULUMI_BACKEND_URL not set — skipping stack export"; exit 0
          fi
          # Same reasoning, different failure shape: CLOUDFLARE_ACCOUNT_ID is
          # also `required: false` at the workflow_call boundary. Without
          # this guard, an empty value would silently build the endpoint URL
          # as "https://.r2.cloudflarestorage.com" and let `aws s3 cp` fail
          # with an opaque DNS/connection error instead of a clear message —
          # fail-closed either way, but this is the readable version.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID not set — cannot derive the R2 endpoint for the rollback backup upload. Refusing to proceed to 'pulumi up' without a rollback snapshot."
            exit 1
          fi
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select "$PULUMI_STACK"
          backup_file="$RUNNER_TEMP/pulumi-$PULUMI_STACK-backup.json"
          pulumi stack export --file "$backup_file"
          if [ ! -s "$backup_file" ]; then
            echo "::error::pulumi stack export produced no (or an empty) backup file despite PULUMI_BACKEND_URL being set. Refusing to silently proceed to 'pulumi up' without a rollback snapshot."
            exit 1
          fi
          # Same bucket as the Pulumi state backend, different prefix —
          # `s3://<bucket>?query...` -> just the bucket name, ignoring
          # whatever query params (endpoint/region/style) happen to be in
          # this secret's value, since we derive the R2 endpoint from
          # CLOUDFLARE_ACCOUNT_ID instead of parsing that.
          bucket="${PULUMI_BACKEND_URL#s3://}"
          bucket="${bucket%%\?*}"
          aws s3 cp --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            "$backup_file" "s3://$bucket/rollback-backups/pulumi-$PULUMI_STACK-$GITHUB_RUN_ID.json"
      - name: Pulumi up
        if: ${{ inputs.run_pulumi }}
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: ${{ inputs.pulumi_stack }}
          work-dir: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Verify root container Dockerfile
        if: ${{ inputs.component == 'root' }}
        run: test -f apps/agent/Dockerfile
      - name: Resolve effective worker secrets
        id: effective_secrets
        # Optional secrets are appended to the upload list only when their
        # value is present. wrangler-action's uploadSecrets() hard-fails on
        # any listed name whose env value is empty — which is correct for
        # load-bearing secrets and wrong for optional ones: on 2026-08-04 an
        # unconfigured optional secret blocked every staging deploy (run
        # 30895422110). An optional secret must not be able to block
        # delivery.
        shell: bash
        env:
          REQUIRED_LIST: ${{ inputs.worker_secrets }}
          OPTIONAL_LIST: ${{ inputs.optional_worker_secrets }}
          # Same env block as the Deploy Worker step below — the indirect
          # `${!name}` expansion above looks up OPTIONAL_LIST names here, so
          # every secret that could be optional must be present in env.
          # #912 PR2: catalog/users staging read their DSN from a Secrets Store
          # binding (wrangler.toml [[env.staging.secrets_store_secrets]]) and
          # never list DATABASE_URL here; production still uploads the owner
          # DSN as the DATABASE_URL worker secret until the #912 cutover.
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          AGENT_DATABASE_URL: ${{ secrets.AGENT_DATABASE_URL }}
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
        run: |
          effective="$REQUIRED_LIST"
          while IFS= read -r name; do
            name="${name//$'\r'/}"          # tolerate CRLF checkouts
            name="${name#"${name%%[![:space:]]*}"}"   # ltrim
            name="${name%"${name##*[![:space:]]}"}"   # rtrim
            [ -z "$name" ] && continue
            if ! [[ "$name" =~ ^[A-Z][A-Z0-9_]*$ ]]; then
              echo "::warning title=optional secret ignored::'$name' is not a valid secret name (expected ^[A-Z][A-Z0-9_]*$); skipping"
              continue
            fi
            if [ -n "${!name:-}" ]; then
              effective="$effective"$'\n'"$name"
            else
              echo "::warning title=optional secret skipped::$name is unset; deploy continues without it"
            fi
          done <<< "$OPTIONAL_LIST"
          {
            echo "list<<EOF"
            printf '%s\n' "$effective" | sed '/^[[:space:]]*$/d'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # #494: bake git metadata into the container image. The root image is
      # built by the "Deploy Worker" step below (`wrangler deploy`, driven by
      # workers/edge/wrangler.toml's [[containers]] image =
      # "../../apps/agent/Dockerfile"), and wrangler
      # cannot pass `--build-arg` through to docker (workers-sdk #12991). So we
      # write apps/agent/src/animichi/build_info.py into the build context instead;
      # the Dockerfile's existing `COPY apps/agent/src/animichi /app/src/animichi` ships it
      # into the image at build time. The file is gitignored (#494) and
      # regenerated on every deploy, so it never goes stale in a PR.
      - name: Bake git build info for root container
        if: ${{ inputs.component == 'root' }}
        shell: bash
        env:
          # SAFE-1 (#937): production bakes the pinned pre-campaign revision,
          # never the campaign github.sha; staging keeps the caller SHA.
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # Whitelist-sanitize: a ref name may contain characters that break a
          # quoted Python literal; a full hex SHA is safe as-is.
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            baked_commit="${SOURCE_REVISION:0:7}"
            branch="pinned-pre-campaign"
          else
            baked_commit="${GITHUB_SHA::7}"
            branch="${GITHUB_REF_NAME//[^A-Za-z0-9._\/-]/-}"
          fi
          mkdir -p apps/agent/src/animichi
          cat > apps/agent/src/animichi/build_info.py <<EOF
          """Build-time git metadata baked by CI (#494). Do not edit."""

          GIT_COMMIT = "${baked_commit}"
          GIT_BRANCH = "${branch}"
          EOF
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The setup action already installed the Wrangler declared by this
          # workspace package. The pinned wrangler-action reuses that version
          # when this input is omitted; duplicating it here made a Dependabot
          # update fall into the action's mutating `pnpm add` fallback.
          # #516: without this, the action's own lockfile-based
          # auto-detection (dist/index.mjs:detectPackageManager) only looks
          # for a lockfile INSIDE `workingDirectory` — every pnpm workspace
          # member (apps/web, workers/catalog, workers/users) has its
          # lockfile at the repo ROOT, not in its own directory, so detection
          # silently falls back to "npm". That's harmless until the fallback
          # install path (`npm i wrangler@...`) runs inside a directory whose
          # package.json has a `workspace:*` dependency (apps/web,
          # workers/catalog, workers/users all do, via
          # `@animichi/contract`) — npm doesn't understand that pnpm-only
          # protocol and dies with EUNSUPPORTEDPROTOCOL before wrangler ever
          # runs. Confirmed by reading dist/index.mjs at the pinned SHA below
          # (not just the docs): `packageManager` input is read verbatim via
          # `core.getInput("packageManager")` and, when set, is used directly
          # instead of falling through to `detectPackageManager()`.
          packageManager: pnpm
          workingDirectory: ${{ inputs.working_directory }}
          # root's config lives at workers/edge/wrangler.toml (#853) while its
          # working_directory stays "." — the container image is built from
          # the directory wrangler is invoked in, so the build context must
          # remain the repo root for the Dockerfile's `COPY apps/agent/...`
          # lines to resolve. Point wrangler at the moved config explicitly.
          command: ${{ inputs.component == 'root' && 'deploy -c workers/edge/wrangler.toml' || 'deploy' }}
          environment: ${{ inputs.environment }}
          secrets: ${{ steps.effective_secrets.outputs.list }}
        env:
          # #912 PR2: mirror of the "Resolve effective worker secrets" map —
          # staging catalog/users take their DSN from the Secrets Store binding
          # (no upload); production keeps uploading the owner DSN as
          # DATABASE_URL until the #912 cutover.
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          AGENT_DATABASE_URL: ${{ secrets.AGENT_DATABASE_URL }}
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
      # Deliberately NOT part of the wrangler-action `secrets:` list above (the
      # one populating `worker_secrets`): that list is uploaded via
      # wrangler-action's own `uploadSecrets()`, which runs `wrangler secret
      # bulk` BEFORE the `deploy` command internally (confirmed by reading
      # cloudflare/wrangler-action's dist/index.mjs at the pinned SHA below —
      # `uploadSecrets(...)` is called ahead of `wranglerCommands(...)`), so
      # those 10 secrets do face the non-interactive "Worker does not exist,
      # create it?" fallback-to-yes prompt on a first-ever deploy to a new
      # environment. This step is different because it is a separate step we
      # control the order of: placed after "Deploy Worker", so by the time it
      # runs, the same job has already deployed (or updated) this exact
      # Worker/environment — narrowing that fallback-to-yes risk for the two
      # secrets this step manages, though it does not retroactively fix it for
      # wrangler-action's own bulk upload of `worker_secrets`.
      #
      # List-driven: `inputs.post_deploy_secrets` is a newline list of secret
      # names for THIS component/environment's Worker (e.g. root's
      # TURNSTILE_SECRET + ANON_ID_SECRET). Adding a new one means: add the
      # name to the caller's `post_deploy_secrets` list, add it to `secrets:`
      # above, and add one line to the `env:` map immediately below so the
      # bash indirect-expansion lookup (`${!name}`) can find its value —
      # GitHub Actions has no dynamic `secrets.<computed-name>` lookup, so this
      # env map is the one place that still needs a per-secret line.
      #
      # Empty values are skipped, not failed, here — the "Preflight" step
      # above already decided whether an empty value is fatal (flag-gated
      # secret whose feature is off in this environment) or fine to proceed
      # past. If this step still fails, it is a real, unexpected condition:
      # the Worker has already been deployed by the step above and this
      # failure does NOT undo that — it only means the secret push itself
      # didn't complete, which is a real (if narrow) gap between deploy and
      # push worth re-running by hand.
      - name: Push post-deploy secrets to Worker
        if: ${{ inputs.post_deploy_secrets != '' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          TARGET_COMPONENT: ${{ inputs.component }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          POST_DEPLOY_SECRETS: ${{ inputs.post_deploy_secrets }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          ANON_ID_SECRET: ${{ secrets.ANON_ID_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            value="${!name-}"
            if [ -z "$value" ]; then
              echo "::warning::$name is empty/unset for component=$TARGET_COMPONENT, environment=$TARGET_ENVIRONMENT — skipping the push (the preflight step already validated it is safe to skip here)."
              continue
            fi
            config_flag=""
            [ "$TARGET_COMPONENT" = "root" ] && config_flag="-c workers/edge/wrangler.toml"
            read -r -a config_args <<< "$config_flag"
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" "${config_args[@]}" --env "$TARGET_ENVIRONMENT"
          done <<< "$POST_DEPLOY_SECRETS"
      # Real per-component smoke checks (issue #484). `web` and `root` are
      # each self-contained (no dependency on other components in the same
      # environment) so they get a direct HTTP assertion right after their
      # own deploy. `catalog` and `users` have NO public route in any
      # environment by design (private, service-binding only) — their
      # reachability through the edge is instead verified end-to-end by
      # reusable-post-deploy-test.yml (`catalog-probe` / `users-probe`) once every
      # component in the environment, including `root`, is deployed.
      - name: Smoke
        env:
          COMPONENT: ${{ inputs.component }}
          ENVIRONMENT: ${{ inputs.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # #826 mechanism: declared under `workflow_call.secrets` above AND
          # passed by the staging callers in ci.yml — this job's
          # `environment:` then resolves the staging-environment value.
          # Without the caller pass-through the name never fills and the
          # staging WAF 403s this smoke. Empty on production (no such
          # environment secret — post-prod omits the mapping, while
          # deploy-root-prod passes the name only for parity) is fine:
          # post-deploy-assert.sh only sends the header when the var is
          # non-empty, and the gate ruleset only matches the staging
          # hostname anyway.
          STAGING_GATE_TOKEN: ${{ secrets.STAGING_GATE_TOKEN }}
          # #494: the healthz probe hard-asserts git_commit equals this
          # run's SHA (baked by the "Bake git build info" step) — the P7
          # deploy-verification proof. `github.sha` in a workflow_call is
          # the caller's commit, i.e. exactly what the bake wrote.
          # SAFE-1 (#937): production expects the PINNED pre-campaign
          # revision (the bake wrote that), never the campaign github.sha.
          EXPECTED_GIT_COMMIT: ${{ inputs.environment == 'production' && steps.release.outputs.source_revision || github.sha }}
          # First cold start after an image change takes minutes; base 12 →
          # sleep budget 12*(1+2+3+4)=120s plus 5×20s request timeouts ≈ 220s ceiling, still bounded.
          POST_DEPLOY_ASSERT_RETRY_BACKOFF_BASE_SECONDS: "12"
        shell: bash
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            web)
              url="$(bash .github/scripts/resolve-worker-url.sh web "$ENVIRONMENT")"
              echo "Resolved web@$ENVIRONMENT -> $url"
              WEB_URL="$url" bash .github/scripts/post-deploy-assert.sh web-landing
              ;;
            root)
              url="$(bash .github/scripts/resolve-worker-url.sh root "$ENVIRONMENT")"
              echo "Resolved root@$ENVIRONMENT -> $url"
              ROOT_URL="$url" bash .github/scripts/post-deploy-assert.sh healthz
              ;;
            catalog)
              echo "::notice title=post-deploy smoke::catalog has no public route in any environment by design (private, CATALOG service binding only); reachability is verified end-to-end by reusable-post-deploy-test.yml's catalog-probe once root is deployed in the same environment"
              ;;
            users)
              echo "::notice title=post-deploy smoke::users has no public route in any environment by design (private, USERS service binding only); reachability is verified end-to-end by reusable-post-deploy-test.yml's users-probe once root is deployed in the same environment"
              ;;
            maintenance)
              echo "::notice title=post-deploy smoke::maintenance is scheduled-only with no public route; verify its first staging invocation in Cloudflare Cron Trigger Past Events before deleting the deprecated GHA fallbacks"
              ;;
            *)
              echo "::error title=post-deploy smoke::unknown component '$COMPONENT'"
              exit 1
              ;;
          esac
