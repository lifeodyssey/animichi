# Reusable workflow (called by ci.yml; not triggered directly). '_' prefix = internal.
name: deploy-component
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      component: { required: true, type: string }
      working_directory: { required: true, type: string }
      environment: { required: true, type: string }
      pulumi_stack: { required: true, type: string }
      build_filter: { required: false, type: string, default: "" }
      run_pulumi: { required: false, type: boolean, default: true }
      worker_secrets: { required: false, type: string, default: "" }
    secrets:
      NEON_DATABASE_URL:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      PULUMI_CONFIG_PASSPHRASE:
        required: false
      PULUMI_BACKEND_URL:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      NEON_AUTH_JWKS_URL:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_ANON_KEY:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      SUPABASE_DB_URL:
        required: false
      MIMO_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      GOOGLE_MAPS_API_KEY:
        required: false
      LOGFIRE_TOKEN:
        required: false
      CORS_ALLOWED_ORIGIN:
        required: false
      NEXT_PUBLIC_MAPBOX_TOKEN:
        required: false
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build component
        if: ${{ inputs.build_filter != '' }}
        env:
          BUILD_FILTER: ${{ inputs.build_filter }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: pnpm --filter "$BUILD_FILTER" build
      - name: Atlas migrate
        # NOTE: secrets context is NOT allowed in step `if:` (GitHub compile-time
        # error → startup_failure). Guard inside run via the env var instead.
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL not set — skipping atlas migrate"; exit 0
          fi
          curl -sSfL "https://release.ariga.io/atlas/atlas-community-linux-amd64-v0.30.0" -o /usr/local/bin/atlas
          chmod +x /usr/local/bin/atlas
          atlas migrate apply --dir "file://db/migrations" --url "$NEON_DATABASE_URL" --revisions-schema public
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Pulumi up
        if: ${{ inputs.run_pulumi }}
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: ${{ inputs.pulumi_stack }}
          work-dir: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Verify root container Dockerfile
        if: ${{ inputs.component == 'root' }}
        run: test -f Dockerfile
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.79.0"
          workingDirectory: ${{ inputs.working_directory }}
          command: deploy
          environment: ${{ inputs.environment }}
          secrets: ${{ inputs.worker_secrets }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
      # Real per-component smoke checks (issue #484). `web` and `root` are
      # each self-contained (no dependency on other components in the same
      # environment) so they get a direct HTTP assertion right after their
      # own deploy. `catalog` and `users` have NO public route in any
      # environment by design (private, service-binding only) — their
      # reachability through the edge is instead verified end-to-end by
      # _post-deploy-test.yml (`catalog-probe` / `users-probe`) once every
      # component in the environment, including `root`, is deployed.
      - name: Smoke
        env:
          COMPONENT: ${{ inputs.component }}
          ENVIRONMENT: ${{ inputs.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            web)
              url="$(bash .github/scripts/resolve-worker-url.sh web "$ENVIRONMENT")"
              echo "Resolved web@$ENVIRONMENT -> $url"
              WEB_URL="$url" bash .github/scripts/post-deploy-assert.sh web-landing
              ;;
            root)
              url="$(bash .github/scripts/resolve-worker-url.sh root "$ENVIRONMENT")"
              echo "Resolved root@$ENVIRONMENT -> $url"
              ROOT_URL="$url" bash .github/scripts/post-deploy-assert.sh healthz
              ;;
            catalog)
              echo "::notice title=post-deploy smoke::catalog has no public route in any environment by design (private, CATALOG service binding only); reachability is verified end-to-end by _post-deploy-test.yml's catalog-probe once root is deployed in the same environment"
              ;;
            users)
              echo "::notice title=post-deploy smoke::users has no public route in any environment by design (private, USERS service binding only); reachability is verified end-to-end by _post-deploy-test.yml's users-probe once root is deployed in the same environment"
              ;;
            *)
              echo "::error title=post-deploy smoke::unknown component '$COMPONENT'"
              exit 1
              ;;
          esac
