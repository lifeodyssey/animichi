# Reusable workflow (called by ci.yml / deploy.yml; not triggered directly).
# Deploy path for the infra/neon-secrets Pulumi project (#926 CI wiring):
# Neon service-role passwords + Cloudflare Secrets Store DSN secrets (ADR 0003).
#
# #1077: login is GitHub OIDC → Pulumi Cloud. State lives in Pulumi Cloud
# history, not the R2 DIY backend. Stacks must already exist there (imported
# by migrate-pulumi-to-cloud.yml); this job fails closed rather than
# `stack init` an empty Cloud stack on top of live Neon roles.
#
# Adoption (.github/scripts/neon-secrets-adopt.sh) stays as a no-op once the
# Cloud stack owns the roles. NEON_API_KEY still feeds first-run imports and
# the staging GRANT.
name: deploy-neon-secrets
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      pulumi_stack: { required: true, type: string }
    secrets:
      CLOUDFLARE_PULUMI_API_TOKEN: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: false }
      NEON_API_KEY: { required: false }
jobs:
  deploy:
    timeout-minutes: 30
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: infra/neon-secrets/pnpm-lock.yaml
      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version-file: .pulumi.version
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: lifeodyssey
          requested-token-type: urn:pulumi:token-type:access_token:organization
      - name: Generate Neon provider SDK
        working-directory: infra/neon-secrets
        run: |
          pulumi package add terraform-provider kislerdm/neon
          git checkout -- package.json
      - name: Install neon-secrets dependencies
        working-directory: infra/neon-secrets
        run: pnpm install --frozen-lockfile
      - name: Select Pulumi Cloud stack
        working-directory: infra/neon-secrets
        env:
          PULUMI_STACK: ${{ inputs.pulumi_stack }}
        run: |
          if ! pulumi stack select "$PULUMI_STACK"; then
            echo "::error::Stack $PULUMI_STACK is not on Pulumi Cloud. Import it with migrate-pulumi-to-cloud.yml before this job can apply."
            exit 1
          fi
      - name: Adopt live Neon roles if the Cloud stack is still empty
        working-directory: infra/neon-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_STACK: ${{ inputs.pulumi_stack }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bash ../../.github/scripts/neon-secrets-adopt.sh
      - name: Pulumi up (neon-secrets)
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: lifeodyssey/${{ inputs.pulumi_stack }}
          work-dir: infra/neon-secrets
          pulumi-version-file: .pulumi.version
          upsert: false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Grant migrator DDL on staging public
        if: ${{ inputs.environment == 'staging' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          bash infra/neon-secrets/grant-migrator-ddl.sh
