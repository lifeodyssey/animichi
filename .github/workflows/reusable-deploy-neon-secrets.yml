# Reusable workflow (called by ci.yml; not triggered directly). '_' prefix = internal.
# Deploy path for the infra/neon-secrets Pulumi project (#926 CI wiring):
# Neon service-role passwords + Cloudflare Secrets Store DSN secrets (ADR 0003).
# A slim, Pulumi-only sibling of reusable-deploy-component.yml — there is no
# Worker here, so there is no wrangler/deploy/smoke machinery; everything
# after the SDK build mirrors the component deploy's Pulumi steps (rollback
# backup #485, encrypted state backend, least-privilege CF token).
#
# Why the state backend is R2 (+ passphrase) and never a file backend: the
# stack state holds Neon role passwords and DSNs. The #926 validation ran on
# a local file:// backend, which CI cannot reach; the R2 backend (the same
# PULUMI_BACKEND_URL / PULUMI_CONFIG_PASSPHRASE the infra project uses)
# keeps the state encrypted at rest, private to the R2 credentials, and
# shares the infra rollback-backups bucket.
#
# First run (R2 backend): the stack does not exist yet, so this job
# `pulumi stack init`s it (passphrase secrets provider) and then runs
# .github/scripts/neon-secrets-adopt.sh — the resources the #926 local run
# created are live in staging, and a fresh `pulumi up` would try to re-create
# the roles (Neon API rejects duplicate role creates). Adoption imports them
# by ID; subsequent runs are plain no-change applies. See the script header
# for the provenance of the import IDs.
#
# NEON_API_KEY is needed only for the first run's adoption imports: `pulumi
# import` does not execute the stack program, so the passphrase-encrypted
# neonApiKey config in Pulumi.staging.yaml never reaches the import-time
# provider. The adopt script injects the key as the provider's apiKey input
# from this env var (the same key the #926 run used, so imported state matches
# what `pulumi up` configures). Once the stack owns its roles, adoption is a
# no-op and the env var is unused — `pulumi up` itself authenticates via the
# committed config, like infra's own stack configs.
name: deploy-neon-secrets
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      pulumi_stack: { required: true, type: string }
    secrets:
      # The six secrets the infra deploy steps consume, plus NEON_API_KEY
      # (ci.yml passes them through verbatim; all are `required: false` here
      # and guarded at the step level like the component deploy's steps, so a
      # caller that omits one fails with a readable message instead of a
      # Pulumi stack trace). NEON_API_KEY is consumed only by the first-run
      # adoption imports (see the header comment), guarded inside the adopt
      # script.
      PULUMI_CONFIG_PASSPHRASE: { required: false }
      PULUMI_BACKEND_URL: { required: false }
      CLOUDFLARE_PULUMI_API_TOKEN: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: false }
      R2_ACCESS_KEY_ID: { required: false }
      R2_SECRET_ACCESS_KEY: { required: false }
      NEON_API_KEY: { required: false }
jobs:
  deploy:
    timeout-minutes: 30
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: infra/neon-secrets/pnpm-lock.yaml
      # Installs the Pulumi CLI onto PATH without running a command (omitting
      # `command:` is the documented install-only mode). Needed both to
      # generate the provider SDK below and to run the deploy.
      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      # Generates the bridged kislerdm/neon provider SDK into sdks/neon
      # (gitignored; the project's Pulumi.yaml pins the terraform-provider
      # source and version). `pulumi package add` ALSO rewrites the project's
      # package.json — it records the generated SDK as a dependency and
      # (depending on pnpm state) appends build-approval entries to
      # pnpm.onlyBuiltDependencies whose `file:` specifier makes pnpm 10.33
      # reject the project outright (ERR_PNPM_INVALID_VERSION_UNION — the
      # non-semver spec breaks its version-union parsing). The manifest edit
      # is not load-bearing (the committed package.json already declares the
      # file:sdks/neon dependency), so it is reverted right after generation;
      # the SDK sources themselves live in the gitignored sdks/ tree.
      - name: Generate Neon provider SDK
        working-directory: infra/neon-secrets
        run: |
          pulumi package add terraform-provider kislerdm/neon
          git checkout -- package.json
      # infra/neon-secrets is its own pnpm workspace (pnpm-workspace.yaml with
      # `packages: []`), NOT a root-workspace member — the plain install
      # resolves against the project's own workspace file; `--frozen-lockfile`
      # pins infra/neon-secrets/pnpm-lock.yaml like every other package's
      # lockfile. The generated SDK's postinstall (which compiles it to
      # sdks/neon/bin) runs because the committed pnpm-workspace.yaml allows
      # '@pulumi/neon' builds — do not add --ignore-scripts here.
      - name: Install neon-secrets dependencies
        working-directory: infra/neon-secrets
        run: pnpm install --frozen-lockfile
      # Same rollback-backup pattern as reusable-deploy-component.yml (#485):
      # snapshot state before `up` mutates it, into the same R2 bucket the
      # Pulumi state backend already lives in (never a GitHub artifact — this
      # repo is public and artifacts are downloadable by any signed-in
      # account). Skipped while the stack does not exist yet on the R2
      # backend (first run): there is no state to back up, and the adoption
      # script below is itself the snapshot for that run.
      - name: Pulumi stack export (rollback backup)
        shell: bash
        # #933: same fix as reusable-deploy-component.yml — from the repo root
        # (no Pulumi.yaml) `pulumi stack select staging` always failed with
        # "pass the fully qualified name (organization/project/stack)", which
        # the `if !` guard below silently swallowed as "first run". Running
        # inside the project makes `staging` resolve to
        # animichi-neon-secrets/staging, so the guard only fires when the
        # stack genuinely does not exist yet.
        working-directory: infra/neon-secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          PULUMI_STACK: ${{ inputs.pulumi_stack }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$PULUMI_BACKEND_URL" ]; then
            echo "PULUMI_BACKEND_URL not set — skipping stack export"; exit 0
          fi
          # CLOUDFLARE_ACCOUNT_ID is a PUBLIC account identifier, not a secret:
          # it already ships in the committed stack config (cloudflareAccountId).
          # Prefer the secret when present, but fall back to the committed config so
          # a secret-wiring gap (issue #1001: 'CLOUDFLARE_ACCOUNT_ID not set') can never
          # block the rollback backup. Neither present -> fail closed (still safe).
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            CLOUDFLARE_ACCOUNT_ID="$(pulumi config get animichi-neon-secrets:cloudflareAccountId 2>/dev/null || true)"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID not set and cloudflareAccountId not in committed config — cannot derive the R2 endpoint for the rollback backup upload. Refusing to proceed without a rollback snapshot."
            exit 1
          fi
          pulumi login "$PULUMI_BACKEND_URL"
          if ! pulumi stack select "$PULUMI_STACK" 2>/dev/null; then
            echo "::warning::Stack $PULUMI_STACK does not exist yet on the R2 backend — first run; nothing to back up (the adoption step imports the live resources instead)."
            exit 0
          fi
          backup_file="$RUNNER_TEMP/pulumi-neon-secrets-$PULUMI_STACK-backup.json"
          pulumi stack export --file "$backup_file"
          if [ ! -s "$backup_file" ]; then
            echo "::error::pulumi stack export produced no (or an empty) backup file despite PULUMI_BACKEND_URL being set. Refusing to silently proceed to 'pulumi up' without a rollback snapshot."
            exit 1
          fi
          bucket="${PULUMI_BACKEND_URL#s3://}"
          bucket="${bucket%%\?*}"
          aws s3 cp --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            "$backup_file" "s3://$bucket/rollback-backups/pulumi-neon-secrets-$PULUMI_STACK-$GITHUB_RUN_ID.json"
      # Select the stack or initialize it (first run on the R2 backend), then
      # adopt the #926 live resources if this state is empty, then apply. The
      # first run's `up` is expected to be a no-change apply; subsequent runs
      # are identical no-change applies until the stack's config changes.
      - name: Pulumi up (neon-secrets)
        shell: bash
        working-directory: infra/neon-secrets
        env:
          # Least-privilege split (#674) + rename mapping, identical to the
          # infra deploy: the Cloudflare provider reads CLOUDFLARE_API_TOKEN,
          # the R2 state backend reads the AWS_* pair. NEON_API_KEY feeds the
          # first-run adoption imports (see the header comment).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # #1001: Cloudflare R2's S3-compatible API rejects the extraneous
          # request checksum (Content-MD5) that Pulumi's bundled AWS SDK Go v2
          # adds by default on the state PutObject ('InvalidDigest', HTTP 400).
          # Forcing WHEN_REQUIRED stops extraneous checksum headers from being
          # sent. This addresses the state-write half of the neon-secrets deploy
          # failure; the R2/Pulumi checksum negotiation must still be confirmed
          # on the live lane (documented on #1001 / #1056).
          AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
          AWS_RESPONSE_CHECKSUM_VALIDATION: "WHEN_REQUIRED"
          PULUMI_STACK: ${{ inputs.pulumi_stack }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$PULUMI_BACKEND_URL" ]; then
            echo "::error::PULUMI_BACKEND_URL not set — cannot reach the state backend. Refusing to deploy."
            exit 1
          fi
          pulumi login "$PULUMI_BACKEND_URL"
          if ! pulumi stack select "$PULUMI_STACK" 2>/dev/null; then
            echo "Stack $PULUMI_STACK not found on the backend — initializing (passphrase secrets provider)."
            pulumi stack init "$PULUMI_STACK" --secrets-provider passphrase
          fi
          bash ../../.github/scripts/neon-secrets-adopt.sh
          pulumi up --non-interactive --yes
