name: Rollback

on:
  workflow_dispatch:
    inputs:
      component:
        description: Production Worker unit from the selected successful CD run
        required: true
        type: choice
        options:
          - edge
          - web
          - catalog
          - users
      release_run_id:
        description: Successful main CD run containing the prior sealed artifact
        required: true
        type: string
      source_sha:
        description: Exact 40-character main SHA recorded by that CD run
        required: true
        type: string
      artifact_sha256:
        description: Exact SHA-256 from the selected unit's artifact manifest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: affected-cd-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rollback:
    name: Roll back ${{ inputs.component }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Fetch trusted CD run evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::release run ID must be numeric"; exit 2; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > "$RUNNER_TEMP/rollback-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/rollback-artifacts.json"
      - name: Reject unavailable release payloads
        env:
          COMPONENT: ${{ inputs.component }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          require_artifact() {
            jq -e --arg name "release-$SOURCE_SHA-$1" \
              '[.artifacts[] | select(.name == $name and .expired == false and .size_in_bytes > 0)] | length == 1' \
              "$RUNNER_TEMP/rollback-artifacts.json" >/dev/null
          }
          require_artifact "$COMPONENT" || {
            echo "::error::missing or expired sealed artifact; land a reviewed main recovery change instead of rebuilding during rollback"
            exit 1
          }
          [ "$COMPONENT" != edge ] || require_artifact agent || {
            echo "::error::missing or expired sealed artifact for the edge's paired agent image; land a reviewed main recovery change"
            exit 1
          }
      - name: Download selected sealed unit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.source_sha }}-${{ inputs.component }}
          path: ${{ runner.temp }}/rollback-release/${{ inputs.component }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
      - name: Download the edge's paired sealed agent image
        if: ${{ inputs.component == 'edge' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.source_sha }}-agent
          path: ${{ runner.temp }}/rollback-release/agent
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
      - name: Verify trusted run and immutable payload identity
        env:
          COMPONENT: ${{ inputs.component }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/rollback-release/$COMPONENT"
          python3 .github/scripts/validate-rollback-release.py \
            --run "$RUNNER_TEMP/rollback-run.json" --artifacts "$RUNNER_TEMP/rollback-artifacts.json" \
            --manifest "$release/artifact-manifest.json" --repository "$GITHUB_REPOSITORY" \
            --run-id "$RELEASE_RUN_ID" --unit "$COMPONENT" --source-sha "$SOURCE_SHA" \
            --artifact-sha256 "$ARTIFACT_SHA256"
          python3 .github/scripts/verify-release-artifact.py "$release" "$COMPONENT" "$SOURCE_SHA"
          if [ "$COMPONENT" = edge ]; then
            agent="$RUNNER_TEMP/rollback-release/agent"
            digest="$(jq -r .artifact_sha256 "$agent/artifact-manifest.json")"
            python3 .github/scripts/validate-rollback-release.py \
              --run "$RUNNER_TEMP/rollback-run.json" --artifacts "$RUNNER_TEMP/rollback-artifacts.json" \
              --manifest "$agent/artifact-manifest.json" --repository "$GITHUB_REPOSITORY" \
              --run-id "$RELEASE_RUN_ID" --unit agent --source-sha "$SOURCE_SHA" --artifact-sha256 "$digest"
            python3 .github/scripts/verify-release-artifact.py "$agent" agent "$SOURCE_SHA"
          fi
      - uses: ./.github/actions/setup
      - name: Promote the selected immutable release
        env:
          COMPONENT: ${{ inputs.component }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          ZEN_GO_API_KEY: ${{ secrets.ZEN_GO_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          ANON_ID_SECRET: ${{ secrets.ANON_ID_SECRET }}
          VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
          VITE_CATALOG_URL: ${{ vars.VITE_CATALOG_URL }}
          VITE_USERS_URL: ${{ vars.VITE_USERS_URL }}
          VITE_AGENT_URL: ${{ vars.VITE_AGENT_URL }}
          VITE_NEON_AUTH_BASE_URL: ${{ vars.VITE_NEON_AUTH_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
          VITE_SHOWCASE_MODE: ${{ vars.VITE_SHOWCASE_MODE }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            edge)
              bash .github/scripts/promote-release-unit.sh agent production "$SOURCE_SHA" "$RUNNER_TEMP/rollback-release/agent"
              bash .github/scripts/promote-release-unit.sh edge production "$SOURCE_SHA" "$RUNNER_TEMP/rollback-release/edge"
              ;;
            web|catalog|users)
              bash .github/scripts/promote-release-unit.sh "$COMPONENT" production "$SOURCE_SHA" \
                "$RUNNER_TEMP/rollback-release/$COMPONENT"
              ;;
            *) echo "::error::rollback-ineligible component: $COMPONENT"; exit 2 ;;
          esac
      - name: Record recovery boundary
        env:
          COMPONENT: ${{ inputs.component }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          {
            echo "Restored sealed production unit: $COMPONENT"
            echo "Release identity: run=$RELEASE_RUN_ID source=$SOURCE_SHA digest=$ARTIFACT_SHA256"
            echo "Database migrations, Durable Object migrations, and Pulumi state were not changed."
            echo "Edge recovery republishes the exact paired agent image bytes under a deterministic tag; rollback never rebuilds."
            echo "Run the manual checks in docs/ops/deployment.md before closing the incident."
          } >> "$GITHUB_STEP_SUMMARY"
