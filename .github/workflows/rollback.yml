name: Rollback

on:
  workflow_dispatch:
    inputs:
      component:
        description: Production Worker unit from the selected successful CD run
        required: true
        type: choice
        options:
          - edge
          - web
          - catalog
          - users
      release_run_id:
        description: Successful main CD run containing the prior sealed artifact
        required: true
        type: string
      source_sha:
        description: Exact 40-character main SHA recorded by that CD run
        required: true
        type: string
      artifact_sha256:
        description: Exact SHA-256 from the selected unit's artifact manifest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: affected-cd-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rollback:
    name: Roll back ${{ inputs.component }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Validate and promote the selected immutable release
        uses: ./.github/actions/rollback-release
        with:
          component: ${{ inputs.component }}
          release_run_id: ${{ inputs.release_run_id }}
          source_sha: ${{ inputs.source_sha }}
          artifact_sha256: ${{ inputs.artifact_sha256 }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          ZEN_GO_API_KEY: ${{ secrets.ZEN_GO_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          ANON_ID_SECRET: ${{ secrets.ANON_ID_SECRET }}
          VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
          VITE_CATALOG_URL: ${{ vars.VITE_CATALOG_URL }}
          VITE_USERS_URL: ${{ vars.VITE_USERS_URL }}
          VITE_AGENT_URL: ${{ vars.VITE_AGENT_URL }}
          VITE_NEON_AUTH_BASE_URL: ${{ vars.VITE_NEON_AUTH_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
          VITE_SHOWCASE_MODE: ${{ vars.VITE_SHOWCASE_MODE }}
