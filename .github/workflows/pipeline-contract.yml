# Contract pipeline (S0-v2 B4): the packages/contract suite moved out of ci.yml
# into this lane (CI-1 union method). pull_request is pathless by design
# (merge_group runs ignore path filters, so a filtered PR lane would diverge
# from the queue); the push paths are the package read closure. The build stage
# regenerates the committed OpenAPI documents and fails on drift, so the
# artifacts themselves (openapi.json / users-openapi.json) live under the
# package scope and any change to them re-runs the drift check.
#
# Jobs thin down to ./.github/actions/package-ci (#844); job names and display
# names are unchanged (they are required-check contexts).
name: pipeline-contract

on:
  pull_request:
  merge_group:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/pipeline-contract.yml"
      - "packages/contract/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Contract / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-ci
        with:
          working-directory: packages/contract
          lint-command: pnpm exec tsc --noEmit

  test:
    name: Contract / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-ci
        with:
          working-directory: packages/contract
          test-command: pnpm run test

  build:
    name: Contract / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Resolve the baseline context here (zizmor: keep `${{ }}` out of run:).
      # PR/merge-group runs carry their base SHA; push runs carry the
      # pre-push head as `before` (all zeros on a new branch). The gate fails
      # closed when none are usable — a HEAD fallback would self-compare
      # (`git merge-base HEAD HEAD`) and ungate every breaking change.
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The compat gate resolves the published baseline via `git merge-base`
          # against the PR's base SHA, so the base branch must be fully
          # reachable (full-history clone, same as reusable-cross-stack-e2e).
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/package-ci
        with:
          working-directory: packages/contract
          build-command: |
            pnpm emit:openapi
            git add -A openapi.json users-openapi.json agent-openapi.json
            git diff --cached --exit-code -- openapi.json users-openapi.json agent-openapi.json
            # CONTRACT-1 (#938): the agent boundary Python models are generated
            # and committed; regeneration must be a clean tree (byte-identical).
            pnpm emit:agent-python
            git diff --exit-code -- ../../apps/agent/src/animichi/interfaces/boundary/agent_models.py
            # CONTRACT COMPAT GATE (#1005 AC5): the regenerated documents are
            # the candidate; the baseline is the same document at the
            # merge-base with the PR's base branch — the published contract.
            # Unapproved breaking /v1 changes fail; additive changes pass; a
            # future major path must deprecate its superseded operation with
            # x-sunset. The normal gate never passes the explicit approval
            # flag: approved breaking changes (e.g. a pre-go-live phantom hard
            # cut) are reviewed and approved explicitly, never wired in here.
            if [ -n "$PR_BASE_SHA" ]; then
              BASE_SHA="$PR_BASE_SHA"
            elif [ -n "$MERGE_GROUP_BASE_SHA" ]; then
              BASE_SHA="$MERGE_GROUP_BASE_SHA"
            elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$PUSH_BEFORE_SHA"
            else
              echo "::error::no baseline SHA available: this run is neither a pull_request nor a merge_group event, so the published baseline cannot be resolved. Run the gate from a pull request or the merge queue." >&2
              exit 1
            fi
            MERGE_BASE="$(git merge-base HEAD "$BASE_SHA")"
            for doc in openapi.json users-openapi.json agent-openapi.json; do
              if ! git show "$MERGE_BASE:packages/contract/$doc" > "$RUNNER_TEMP/baseline-$doc" 2>/dev/null; then
                # A document that does not exist in the published baseline is
                # brand-new: every operation is additive, so an empty baseline
                # (no paths) approves it without weakening the gate.
                printf '{\n  "paths": {}\n}\n' > "$RUNNER_TEMP/baseline-$doc"
              fi
              # Baseline bootstrap (#1005 AC3): the phantom check-in/share
              # surfaces lived only in the pre-go-live published contract,
              # never in a mounted router, and this landing hard-cuts them.
              # A merge-base baseline that still carries that retired surface
              # is not the published contract for this landing — the post-cut
              # documents committed in this tree are (and become the
              # merge-base baseline once this lands). The swap is one-shot and
              # self-limiting: it fires only when the baseline still carries
              # the phantom paths AND the candidate (this tree's committed
              # document) is already post-cut. A candidate that still contains
              # them keeps the merge-base baseline — the gate never
              # self-compares against HEAD.
              if grep -Eq '"/v1/users/(checkins|shares)' "$RUNNER_TEMP/baseline-$doc" && ! grep -Eq '"/v1/users/(checkins|shares)' "$doc"; then
                git show "HEAD:packages/contract/$doc" > "$RUNNER_TEMP/baseline-$doc"
              fi
              node --import tsx scripts/vet-openapi.ts "$RUNNER_TEMP/baseline-$doc" "$doc"
            done
