name: Release build
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    name: Release / complete snapshot
    if: ${{ github.repository == 'lifeodyssey/animichi' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: release-build-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the complete web output
        run: |
          pnpm --filter web build
          mkdir -p release/web
          cp -RL apps/web/.output release/web/.output
          node --input-type=module -e 'import {sealedConfig} from "./.github/lib/release/config.mjs"; import {writeFileSync} from "node:fs"; writeFileSync("release/web/wrangler.json", JSON.stringify(sealedConfig("web", ""), null, 2))'
      - name: Bundle catalog and users
        run: |
          node .github/scripts/release/build-worker.mjs catalog
          node .github/scripts/release/build-worker.mjs users
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version-file: .pulumi.version
      - name: Seal all foundation sources and the pinned generated provider
        run: bash .github/scripts/release/seal-foundation.sh
      - name: Seal source-pinned dependency patches
        run: node .github/scripts/release/seal-pnpm-patches.mjs "$GITHUB_SHA" release/foundation
      # The chain travels inside the migrator bundle (`prepare-migrations.ts`), and
      # `source_closure.rb` proves that copy is the selected commit's own bytes. `migration check`
      # is the static integrity check: every emitted artifact still matches its authored
      # migration, and the graph is connected.
      - name: Check the sealed migration graph's integrity
        run: pnpm --filter @animichi/pi-session-neon exec prisma migration check
      # #1717: the build names no image, so it opens no registry configuration and holds
      # no identity — no ESC environment, no registry principal, no login, no buildx, no
      # registry proof, and no Cloudflare variable either: `build-worker.test.sh` runs the
      # same bundling dry-run in a job that declares no Cloudflare variable at all.
      - name: Bundle Workers and seal the container-free snapshot
        run: |
          node .github/scripts/release/build-worker.mjs edge
          node .github/scripts/release/build-worker.mjs migrator
          ruby .github/scripts/release/seal.rb
      - name: Archive the complete snapshot
        run: tar --format=ustar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf release.tar release
      - name: Publish the immutable snapshot
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-snapshot-${{ github.sha }}-${{ github.run_attempt }}
          path: release.tar
          if-no-files-found: error
          retention-days: 14
      - name: Record the selectable artifact ID
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: printf 'Artifact ID %s\n\nDigest %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
  dispatch-cd:
    name: Release / dispatch staging CD
    needs: [snapshot]
    if: ${{ github.repository == 'lifeodyssey/animichi' && github.ref == 'refs/heads/main' && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-dispatch-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      actions: write # dispatch cd.yml for this run's own snapshot; nothing else
    steps:
      - name: Dispatch CD for this snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.snapshot.outputs.artifact_id }}
        # No checkout in this job, so name the repository instead of letting gh resolve it from a git remote.
        run: gh workflow run cd.yml --repo lifeodyssey/animichi --ref main -f artifact_id="$ARTIFACT_ID"

  # A release build that fails stops the deploy before CD is even dispatched, and
  # nothing said so (#678 AC1): one deduplicated alert issue per failing-job set,
  # through the run's own token and no new credential.
  alert-failure:
    name: Ops / failure alert
    needs: [snapshot, dispatch-cd]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The key's own (workflow, ref) prefix: two runs that could share an alert
    # must not interleave their read-then-create, and never cancel each other.
    concurrency:
      group: ops-alert-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions: {contents: read, actions: read, issues: write} # read this run's jobs; publish the alert issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
      - name: Publish the failure alert
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_SELF_JOB: Ops / failure alert
        run: ruby .github/scripts/alert/failure-alert.rb
