# TEMPORARY diagnostic workflow for issue #527 — DO NOT MERGE AS-IS.
# Mirrors the exact shape of _deploy-component.yml's `deploy` job (job-level
# `environment: ${{ inputs.environment }}` + named `secrets:` at the
# workflow_call boundary) so we can empirically observe, from a real
# deployment log, whether `secrets.<NAME>` inside a reusable-workflow job
# that declares `environment:` resolves to the environment-scoped secret or
# to the value explicitly passed by the caller.
#
# Prints ONLY booleans (`!= ''`) and lengths via `wc -c` on values already
# loaded into env vars — never the secret value itself.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      NEON_AUTH_JWKS_URL:
        required: false
      CORS_ALLOWED_ORIGIN:
        required: false
      NEON_DATABASE_URL:
        required: false
jobs:
  diag:
    name: "diag(named-secrets, environment=${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Report resolved secret shape (booleans/lengths only)
        env:
          NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DIAG_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "case=named-secrets-passthrough environment=$DIAG_ENVIRONMENT"
          echo "  NEON_AUTH_JWKS_URL   set=$([ -n "$NEON_AUTH_JWKS_URL" ] && echo true || echo false) len=${#NEON_AUTH_JWKS_URL}"
          echo "  CORS_ALLOWED_ORIGIN  set=$([ -n "$CORS_ALLOWED_ORIGIN" ] && echo true || echo false) len=${#CORS_ALLOWED_ORIGIN}"
          echo "  NEON_DATABASE_URL    set=$([ -n "$NEON_DATABASE_URL" ] && echo true || echo false) len=${#NEON_DATABASE_URL}"
