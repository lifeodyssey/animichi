# Reusable static quality lane for the single CI workflow.
# machine-checked invariants over every workflow (step 1d) plus the actionlint
# gate that validates workflow syntax itself, moved here from
# reusable-security.yml so it stands as an independent required context.
# S0-v2 B4: the retired repository-quality-gate's contents (repo-hygiene checks,
# CI contract test, codecov patch policy) also live here — this lane is the
# fixed point of its own checks. It is reusable and is called only by the
# single code-CI workflow; review/comment events never restart this heavy lane.
name: _static-quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  invariants:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruby syntax check workflow meta scripts
        run: |
            for f in .github/scripts/assert-workflow-invariants.rb .github/scripts/assert-workflow-invariants-expression.rb .github/scripts/assert-workflow-invariants.test.rb .github/scripts/test_ci_contract.rb .github/scripts/test_ci_contract_security.rb .github/scripts/security-check-runs-canary.rb .github/scripts/test_security_check_runs_canary.rb .github/scripts/test_ci_contract_security_mutation.rb .github/scripts/test_ci_routing_consistency.rb .github/scripts/test_ci_contract_ruleset_migration.rb .github/scripts/test_ci_contract_ruleset_migration_mutation.rb .github/scripts/ruleset_cutover.rb .github/scripts/ruleset_cutover_cli.rb .github/scripts/test_ruleset_cutover.rb .github/scripts/test_ruleset_cutover_mutation.rb .github/scripts/test_ruleset_cutover_integration.rb .github/scripts/test_ci_contract_review_gate.rb .github/scripts/test_ci_contract_review_gate_mutation.rb .github/scripts/test_production_safety_contract.rb .github/scripts/test_rollback_edge_pair_mutation.rb .github/scripts/test_retired_retention_absence.rb .github/scripts/test_neon_test_infra_absence.rb .github/scripts/test_promotion_ac5_contract.rb .github/scripts/test_promotion_ac5_mutation.rb .github/scripts/test_database_credential_boundary.rb .github/scripts/test_migration_promotion_contract.rb .github/scripts/test_cd_workflow_contract.rb .github/scripts/ci_prepush_parity.rb .github/scripts/ci_prepush_parity_yaml.rb .github/scripts/ci_prepush_parity_extract.rb .github/scripts/test_ci_prepush_parity.rb .github/scripts/test_ci_prepush_parity.test.rb .github/scripts/test_cd_worker_promotion_contract.rb .github/scripts/test_cd_infrastructure_safety_contract.rb .github/scripts/test_cd_affected_routing_contract.rb; do
            ruby -c "${f}"
            done
        shell: bash
      - name: Workflow invariant behavioral tests
        run: ruby .github/scripts/assert-workflow-invariants.test.rb
        shell: bash
      - name: Assert workflow invariants
        run: ruby .github/scripts/assert-workflow-invariants.rb
        shell: bash
      - name: Validate component manifest behavior
        run: python3 .github/scripts/test_component_manifest.py
      - name: Validate affected change planning
        run: python3 .github/scripts/test_change_plan.py
      - name: Validate immutable CD cohort planning
        run: python3 .github/scripts/test_cd_cohort_plan.py
      - name: Validate durable CD range base
        run: bash .github/scripts/test_resolve_cd_base.sh
      - name: Validate immutable artifact envelope
        run: python3 .github/scripts/test_verify_release_artifact.py
      - name: Validate promotion adapter boundaries
        run: bash .github/scripts/test_promote_release_unit.sh
      - name: Validate immutable CD workflow contract
        run: ruby .github/scripts/test_cd_workflow_contract.rb
      - name: Production promotion and rollback safety contract
        run: ruby .github/scripts/test_production_safety_contract.rb
        shell: bash
      - name: Trusted rollback release behavior and mutation probes
        run: python3 .github/scripts/test_validate_rollback_release.py && ruby .github/scripts/test_rollback_edge_pair_mutation.rb
        shell: bash
      - name: Retired retention surface absence contract
        run: ruby .github/scripts/test_retired_retention_absence.rb
        shell: bash
      - name: Database credential boundary contract
        run: ruby .github/scripts/test_database_credential_boundary.rb
        shell: bash
      - name: Migration promotion boundary contract
        run: ruby .github/scripts/test_migration_promotion_contract.rb
        shell: bash
      # #1013 (AC5): production workflow holds no build command for a promoted
      # component and tag creation cannot trigger a deploy. This runs unfiltered
      # so a build step leaking back into the promoted path (or a tag trigger
      # sneaking into a deploy workflow) fails closed in every quality lane.
      - name: Promotion AC5 contract (no prod build + no tag deploy)
        run: ruby .github/scripts/test_promotion_ac5_contract.rb
        shell: bash
      # #1013 AC5 mutation hardening (owner commitment #5): the promotion-lane
      # mutation probes prove each hazard is rejected and the pristine set
      # passes (red/restore/green).
      - name: Promotion AC5 mutation probes
        run: ruby .github/scripts/test_promotion_ac5_mutation.rb
        shell: bash
      # S0-v2 B4: the retired repository-quality-gate's contents moved here —
      # this lane is the fixed point that never path-filters, so the checks
      # that test the CI contract itself must live here (a gate that cannot
      # test itself is not a gate).
      - name: AGENTS.md reference check self-tests
        run: bash .github/scripts/check-agents-refs.test.sh
      - name: AGENTS.md reference check
        run: bash .github/scripts/check-agents-refs.sh
      # #913 (close-out W5): every docs/-prefixed string in tracked files must
      # resolve — extends the reference-check surface to code comments and all
      # docs (archive/ exempt: read-only history).
      - name: Docs path check self-tests
        run: bash .github/scripts/check-docs-paths.test.sh
      - name: Docs path check
        run: bash .github/scripts/check-docs-paths.sh
      - name: Root allowlist check self-tests
        run: bash .github/scripts/check-root-allowlist.test.sh
      - name: Root allowlist check
        run: bash .github/scripts/check-root-allowlist.sh
      - name: E2E promotion guard self-tests
        run: bash .github/scripts/check-e2e-promotion.test.sh
      - name: E2E promotion guard
        run: bash .github/scripts/check-e2e-promotion.sh
      # S0-v2 B3 (supply chain): every `uses:` must be pinned to a full 40-char
      # SHA; local `./` action/workflow paths are allowed and `docker://` images
      # must be digest-pinned (documented exception in check-actions-pinned.sh).
      - name: Actions pinning check self-tests
        run: bash .github/scripts/check-actions-pinned.test.sh
      - name: Actions pinning check
        run: bash .github/scripts/check-actions-pinned.sh
      # #1013: web runtime-config payload recursion guard (self-test + check).
      - name: Web runtime-config payload recursion guard (self-test + check)
        run: bash .github/scripts/check-web-runtime-config-payloads.test.sh && bash .github/scripts/check-web-runtime-config-payloads.sh
        shell: bash
      # #680 deploy-gate sanity: the edge ratelimit-namespace placeholder
      # precheck (wired fail-closed into the edge build lane) is mechanically
      # self-tested here so the quality lane covers the script's behavior.
      - name: Edge ratelimit namespace precheck self-tests
        run: bash .github/scripts/check-edge-ratelimit-namespace.test.sh
      - name: Verify CI contract
        run: ruby .github/scripts/test_ci_contract.rb
      - name: Verify direct Worker promotion contract
        run: ruby .github/scripts/test_cd_worker_promotion_contract.rb
      - name: Verify infrastructure promotion safety
        run: ruby .github/scripts/test_cd_infrastructure_safety_contract.rb
      - name: Verify affected CD routing
        run: ruby .github/scripts/test_cd_affected_routing_contract.rb
      # #1177: every Security child lane and failure-propagation edge must be
      # rejected by the contract when mutated, then pass on the pristine tree.
      - name: Verify Security check-runs canary fixture
        run: ruby .github/scripts/test_security_check_runs_canary.rb
        shell: bash
      - name: Verify Security contract mutation probes
        run: ruby .github/scripts/test_ci_contract_security_mutation.rb
      # AC1 (#1053): the Neon test-infra retirement contract — no tested
      # lane may reference the retired Neon control-plane key or select the
      # live-Neon pytest arm, and the test-base refresh workflow is gone.
      # (The control-plane key stays only in the role-provisioning deploy
      # workflows, allowlisted inside the script.)
      - name: Verify Neon test-infra absence contract
        run: ruby .github/scripts/test_neon_test_infra_absence.rb
      # AC6 (#679): the ruleset migration contract — a new required check must
      # be added (and producible on merge_group) before old names are retired;
      # the mutation probes prove each hazard is rejected and the pristine
      # snapshot passes (red/restore/green).
      - name: Verify ruleset migration contract
        run: ruby .github/scripts/test_ci_contract_ruleset_migration_mutation.rb
      # The post-cutover target has exactly two required contexts;
      # all API behavior is hermetic here and the live PUT remains operator-gated.
      - name: Verify ruleset cutover contract
        run: ruby .github/scripts/test_ruleset_cutover.rb
      - name: Verify ruleset cutover mutation probes
        run: ruby .github/scripts/test_ruleset_cutover_mutation.rb
      - name: Verify ruleset cutover API seam
        run: ruby .github/scripts/test_ruleset_cutover_integration.rb
      - name: Verify patch coverage policy
        run: ruby .github/scripts/test_codecov_patch.rb
      # Local changed-component routing must match the single affected CI graph.
      - name: Verify CI routing consistency
        run: ruby .github/scripts/test_ci_routing_consistency.rb
      # #1114: CI↔pre-push parity — a locally-runnable CI check that is not
      # hung on pre-push (and not on the exemption list with a CI-only reason)
      # fails closed here and in scripts/local-gates/quality.sh.
      - name: Verify CI pre-push parity contract
        run: ruby .github/scripts/test_ci_prepush_parity.rb
      - name: CI pre-push parity mutation probes
        run: ruby .github/scripts/test_ci_prepush_parity.test.rb
      - name: Download actionlint
        run: |
          ACTIONLINT_VERSION="1.7.7"
          ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          ACTIONLINT_CHECKSUMS="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          ACTIONLINT_BASE_URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSfL --proto '=https' --proto-redir '=https' -o "${ACTIONLINT_ARCHIVE}" "${ACTIONLINT_BASE_URL}/${ACTIONLINT_ARCHIVE}"
          curl -sSfL --proto '=https' --proto-redir '=https' -o "${ACTIONLINT_CHECKSUMS}" "${ACTIONLINT_BASE_URL}/${ACTIONLINT_CHECKSUMS}"
          grep -F "  ${ACTIONLINT_ARCHIVE}" "${ACTIONLINT_CHECKSUMS}" > actionlint.sha256
          sha256sum -c actionlint.sha256
          tar -xzf "${ACTIONLINT_ARCHIVE}" actionlint
          chmod +x actionlint
        shell: bash
      - name: Run actionlint
        run: |
          bash .github/scripts/test_run_actionlint.sh
          ruby .github/scripts/test_actionlint_queue_contract.rb
          ACTIONLINT_BIN=./actionlint bash .github/scripts/run-actionlint.sh
        shell: bash
