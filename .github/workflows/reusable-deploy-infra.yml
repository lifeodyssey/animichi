# Reusable workflow (called by ci.yml; not triggered directly).
# Pulumi-only apply of the main infra stack (`infra/`, stack staging).
# Sibling of reusable-deploy-neon-secrets.yml: no Wrangler, no smoke, no Atlas.
# Catalog/users/web/root publish jobs need this job plus the migrator (#1074).
#
# #1077: login is GitHub OIDC → Pulumi Cloud (pulumi/auth-actions). State and
# stack encryption live in Pulumi Cloud; the pre-apply R2 export is retired.
# The Pulumi-plane Cloudflare token still comes from GitHub until #1078.
name: deploy-infra
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      pulumi_stack: { required: true, type: string }
    secrets:
      CLOUDFLARE_PULUMI_API_TOKEN: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: false }
jobs:
  deploy:
    timeout-minutes: 30
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version-file: .pulumi.version
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: lifeodyssey
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:lifeodyssey
      - name: Pulumi up
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: lifeodyssey/${{ inputs.pulumi_stack }}
          work-dir: infra
          pulumi-version-file: .pulumi.version
          upsert: false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PULUMI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
