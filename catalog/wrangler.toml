name = "catalog"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive is prod-only (binds the Worker to a pooled Postgres connection).
# Locally we cannot exercise this binding, so the SPIKE connects directly to
# Postgres via `postgres`/`pg` to validate the Drizzle + PostGIS query path.
# Uncomment and fill `id` after `wrangler hyperdrive create` for prod.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"

[observability]
enabled = true

[vars]
ENVIRONMENT = "development"
