# osv-scanner applies this file to the lockfiles in the repository root (pnpm-lock.yaml,
# Gemfile.lock): a config covers the lockfiles in its own directory, not child directories, so
# infra/database-access keeps its own.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
# The pinned scanner (v2.7.1) reads an ignored vulnerability's expiry from `effectiveUntil`.
effectiveUntil = 2026-12-18
reason = "picomatch ReDoS through repeated extglobs (https://github.com/advisories/GHSA-fc5q-39xc-vjpf): every version through 4.0.7, the latest, is affected, so no fix exists, and no picomatch issue tracked it on 2026-11-18. In this lockfile picomatch (2.3.2, 4.0.5, 4.0.7) comes in through build, test and development tooling (vite, vitest, nitropack, Storybook, TanStack's build plugins, the Prisma CLI) and through three runtime dependencies (agents in workers/edge, @tanstack/react-start in apps/web, @prisma/orm-toolchain in workers/migrator), but only by modules the bundles leave out: no tracked source imports it, and neither the four Workers' bundles nor the web build contains it, so it runs only in that tooling. The patterns this repository passes that tooling are committed literals, whose one extglob (Storybook's stories glob) is not repeated. Owner decision of 2026-11-18 in docs/agents/owner-decisions.md; remove it when picomatch ships a fix."
