# Database-access production stack (#1048 - production runtime DSNs).
#
# Replicates the staging Secrets Store DSN pattern (#912) for PRODUCTION:
# catalog_svc / users_svc / agent_svc role DSNs for the production Neon branch
# are composed and published to the shared Cloudflare Secrets Store under
# distinct secret names (see infra/database-access/index.ts - the prod stack
# appends a "_PROD" suffix so it never collides with the staging-role DSNs the
# same store already holds).
#
# Production branch (br-cold-term-aor1v6gl) lives in the SAME Neon project
# (billowing-fire-22850320) as staging, so it reuses the project's neonApiKey.
# The account plan allows only the single default Secrets Store
# (secretsStoreId), shared with staging.
#
# First-deploy provisioning (owner-gated, executed by the operator/orchestrator
# through the CI production environment approval):
# The animichi-neon-secrets namespace below is the stable Pulumi state/config
# identity; the code and delivery component are named database-access.
#   pulumi config set --stack prod --secret animichi-neon-secrets:neonApiKey "<neon api key>"
# The neonApiKey secret is deliberately NOT committed here - it is set as a
# passphrase-encrypted secure value before the first prod apply (mirrors how
# the staging stack carried a live ciphertext from its local #926 bootstrap).
config:
  animichi-neon-secrets:neonProjectId: billowing-fire-22850320
  animichi-neon-secrets:neonBranchId: br-cold-term-aor1v6gl
  animichi-neon-secrets:cloudflareAccountId: 021233c1880a43aa68565496100e1f8c
  animichi-neon-secrets:secretsStoreName: animichi-secrets
  animichi-neon-secrets:databaseName: neondb
  animichi-neon-secrets:secretsStoreId: 66c9bb0faef644b4a0671bb7d90d98bd
