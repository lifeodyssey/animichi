# Stable Pulumi state identity. Renaming it requires an explicit cross-project
# stack migration for staging and prod; the code/package name is database-access.
name: animichi-neon-secrets
# State and stack encryption live in Pulumi Cloud (#1077); CI logs in with
# GitHub OIDC (`pulumi/auth-actions`), never a stored access token.
backend:
  url: https://api.pulumi.com
runtime:
  name: nodejs
  options:
    typescript: false
description: Database roles and runtime access material managed through Neon and Cloudflare
packages:
  neon:
    source: terraform-provider
    version: 1.3.0
    parameters:
      - kislerdm/neon
