# osv-scanner reads this file for the lockfile in this directory only; it does not propagate.
#
# GHSA-ch52-4w7c-c8xp: http-cache-semantics <= 4.2.0 can hand one user's cached response to
# another through a SHARED cache's max-stale handling. Here it is only a transitive dependency of
# @pulumi/pulumi (-> @npmcli/arborist -> npm-registry-fetch -> make-fetch-happen), and
# make-fetch-happen builds every cache policy with `shared: false` (lib/cache/policy.js), so the
# shared-cache entry the advisory needs never exists; the Pulumi SDK also reaches arborist only
# through closure code-path computation, which these programs never call. No fixed version exists
# (advisory published 2026-09-18, modified 2026-10-02). The owner approved this time-boxed ignore
# on 2026-10-04 (docs/agents/owner-decisions.md). From 2026-10-18 the lane is red again unless the
# lockfile has moved to a fixed version; remove this file together with that decision entry.
[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-10-18
reason = "Unreachable here: only a transitive dependency of @pulumi/pulumi; make-fetch-happen builds its HTTP cache with shared: false, so the shared-cache entry the advisory needs never exists. No fixed version yet; re-check at expiry."
