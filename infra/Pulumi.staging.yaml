config:
  # Same Cloudflare account as prod (already committed in Pulumi.prod.yaml).
  seichijunrei-infra:cloudflareAccountId: 021233c1880a43aa68565496100e1f8c
  # re-enabled 2026-08-05: token gained Workers Routes (zone) + Workers Scripts (account) edit scopes
  seichijunrei-infra:webRoutesEnabled: "true"
  seichijunrei-infra:cloudflareZoneId: 44fdcc54545c1152a8e730137b671be4
  seichijunrei-infra:stagingDomain: staging.animichi.com
  #
  # ── Hostname cutover (#541), ENABLED 2026-08-05 ────────────────────────
  # Flipping the flag publishes. `webRoutesEnabled` creates the Custom
  # Domain and the /v1, /img, /tiles, /healthz edge routes together. One flag on
  # purpose — a hostname that resolves before its routes are narrowed answers a
  # browser navigation with the edge Worker's JSON 404.
  #
  #   pulumi config set webRoutesEnabled true                   --stack staging
  #   pulumi config set cloudflareZoneId <animichi.com zone id> --stack staging
  #   pulumi config set stagingDomain staging.animichi.com      --stack staging
  #
  # The key is `stagingDomain`, NOT `webDomain`. `webDomain` is the prod apex and
  # is read only on the prod stack. An earlier version of this comment said
  # `webDomain` here; following it would leave `stagingDomain` unset and fail the
  # apply with "Missing required configuration variable".
  #
  # ── Staging access gate (#529/#559), ON since 2026-08-05 (#541 step 6) ─────
  # A WAF rule blocking staging traffic that carries neither the
  # `animichi_staging` cookie nor the `x-staging-key` header (and is not on the
  # `stagingAllowedIps` allowlist or hitting the OIDC exchange path). The token
  # is a value you invent (`openssl rand -base64 32`), not one issued by
  # anybody. The SAME value must reach two places: this config, and the
  # STAGING_GATE_TOKEN GitHub secret that CI's smoke/E2E requests send as the
  # `x-staging-key` header. `bash scripts/setup-staging-gate.sh --rotate`
  # replaces both together — a mismatch locks CI out of staging.
  #
  # #1054 (OIDC phase 2): the CI channel of the staging gate is switching to the
  # pipeline's GitHub OIDC identity — CI exchanges it at /staging-gate/exchange for
  # a short-lived gate session (distinct audience animichi:github-actions:staging-gate).
  # Deleting the STAGING_GATE_TOKEN GitHub secret is the ORCHESTRATOR's post-merge step,
  # taken ONLY after the OIDC smoke switch is verified in a real deploy (issue #1054 AC5).
  # The WAF cannot verify the opaque session, so the static token stays the WAF credential
  # for the CI transit until that cutover; the human browser cookie/header channel is unchanged.
  #
  #   pulumi config set cloudflareZoneId <animichi.com zone id> --stack staging
  #   pulumi config set stagingDomain staging.animichi.com      --stack staging
  #   pulumi config set stagingGateEnabled true                 --stack staging
  #   pulumi config set --secret stagingGateToken "<value>"     --stack staging
  #
  # The first two repeat the cutover block above on purpose. The gate reads them
  # independently of `webRoutesEnabled`, so enabling only the gate while the
  # cutover flag is still false fails the apply on missing config — which is
  # what following the previous version of these instructions would have done.

  seichijunrei-infra:stagingGateEnabled: "true"
  seichijunrei-infra:stagingAllowedIps:
    secure: AAABALiqDFOq100yZBGSU0p3At9dty2mTuRaVYhpHvubdUiT7iaFwFFXN1+Xo5i9hyth+R6p9++a/dYlaBvf7d/0eDe8
  seichijunrei-infra:stagingGateToken:
    secure: AAABANl4oFN+iGsQWCIgCwCJoLgLv+Mv6gB1IzjE3ixMVfFvdx5ynM4lXS9tn1LxaYzq4IN9EAIC+7e3rQcOMbDYd9YLD64jfa1MJSeTNTn5B5/eu5jI629d8TXTBapc
