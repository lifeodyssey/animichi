packages:
  - "workers/*"
  - "apps/*"
  - "packages/*"
  - "e2e"
  - "infra"

# pnpm 11 moved every non-auth setting here out of `.npmrc` and removed the
# `package.json#pnpm` field; 12 rejects a key it does not recognise. Keys are
# camelCase — a kebab-case key is silently ignored with a warning. This file is
# the only settings surface, so there is no `.npmrc`.
#
# The linker is pnpm's default isolated one (#1730): no `nodeLinker`, no
# `shamefullyHoist`. A package resolves only what its own manifest declares, so
# a dependency borrowed from a neighbour fails the install instead of shipping
# (#578), and every worktree links into the one shared store.

# v11/v12 defaults kept deliberately, each with its reason:
#   strictDepBuilds: true   — kept. The `allowBuilds` map below is the explicit
#                             decision it demands; every entry is `false`.
#   minimumReleaseAge: 1440 — kept (1 day). No resolved version needed an
#                             exception; a too-fresh version must be justified in
#                             the PR that wants it, not waved through by config.
#   blockExoticSubdeps: true— kept. The one `file:` dependency in the tree
#                             (`infra/database-access`'s `@pulumi/neon`) is a
#                             direct dependency of its own workspace root, which
#                             the setting does not cover.
#   verifyDepsBeforeRun     — kept at its new `install` default. Every gate here
#                             is `pnpm run …`, and this makes a stale tree
#                             re-install itself instead of silently testing the
#                             wrong `node_modules`.
#   optimisticRepeatInstall — kept at its new `true` default, which is what makes
#                             `verifyDepsBeforeRun: install` cheap.
strictDepBuilds: true
minimumReleaseAge: 1440
blockExoticSubdeps: true

catalogMode: strict

# Hold-backs: a version this workspace keeps below its latest release on purpose, with the
# gate its bump fails written on the same line, in one shape:
#   `# hold-back: <package>@<declared> -> <latest> fails <gate>` then a dash and `#<issue>`,
# the follow-up card that retires the pin. `dependency-hold-backs.json` records that number
# per entry, so a line citing any other issue fails the contract.
# `test/repo-config/dependency-hold-backs.test.rb` derives the set of below-latest pins from
# `test/repo-config/fixtures/dependency-hold-backs.json` — refreshed by
# `ruby test/repo-config/refresh-hold-backs.rb --write`, which reads `pnpm outdated -r
# --format json` — and fails on an entry with no line and on a line whose entry is no longer
# below latest. A version a `package.json` declares registers in the `# Manifest pins:` block
# at the end of this file, because JSON carries no comments; a specifier that already admits
# the latest release is not a hold-back and gets no line.
# Every external dependency declared by two or more workspace importers (the root
# included) is defined once here; each manifest references it with `catalog:`.
# `catalogMode: strict` rejects a `pnpm add`/`pnpm update` that asks for a version
# outside the entry, so the drift this consolidates cannot come back through the CLI.
catalog:
  "@cloudflare/vitest-pool-workers": "^0.22.0"
  "@cloudflare/workers-types": "5.20260916.1"
  "@earendil-works/chord": "0.85.1"
  "@earendil-works/pi-agent-core": "0.85.1"
  "@earendil-works/pi-ai": "0.85.1"
  "@modelcontextprotocol/sdk": "1.30.0"
  "@neondatabase/serverless": "^1.1.0"
  "@orpc/client": "1.15.1"
  "@orpc/contract": "1.15.1"
  "@orpc/openapi": "1.15.1"
  "@orpc/openapi-client": "1.15.1"
  "@orpc/server": "1.15.1"
  "@playwright/test": "^1.63.0"
  "@prisma/cli-engine": "0.3.0"
  # hold-back: @prisma/orm-postgres@8.0.0-rc.9 -> 8.0.0-rc.11 fails `pnpm install` (ERR_PNPM_UNUSED_PATCH: the rc.9 @prisma/orm-target-postgres patch matches no package) — #1741
  "@prisma/orm-postgres": "8.0.0-rc.9"
  # TanStack ships the router/start family from one monorepo and pins the
  # packages to each other EXACTLY (router-generator@1.167.36 pins
  # router-core 1.171.30; everything from the same release event pins
  # 1.171.32), so a caret here lets one lockfile carry two router-cores from
  # different release events — an unsupported mix that broke the web build
  # (`makeSerovalPlugin` missing from router-core's ssr/client.js). Every
  # entry is therefore exact, at the newest release event in which the whole
  # family published together (2026-09-16T21:53–21:57Z):
  #   react-start 1.168.56 · react-router 1.170.38 · router-generator 1.167.38
  #   router-core/start-plugin-core/start-server-core/start-client-core et al.
  #   resolve transitively to that same event.
  "@tanstack/nitro-v2-vite-plugin": "1.155.2"
  "@tanstack/react-query": "5.103.1"
  "@tanstack/react-router": "1.170.38"
  "@tanstack/react-router-with-query": "1.130.17"
  "@tanstack/react-start": "1.168.56"
  "@tanstack/router-generator": "1.167.38"
  "@types/node": ^26.6.1
  "@types/pg": "^8.23.1"
  # hold-back: @vitest/coverage-istanbul@4.1.11 -> 5.0.1 fails workers/users test:worker (the provider throws "coverageFilesDirectory is required" under vitest 4, so coverage stays 0%) — #1742
  "@vitest/coverage-istanbul": "4.1.11"
  "ai": ^7.0.102
  "drizzle-orm": "^0.45.2"
  "esbuild": "0.28.2"
  "hono": "^4.13.7"
  "jose": "^6.2.12"
  # hold-back: miniflare@4.20260722.0 -> 5.20260915.0-alpha fails workers/migrator typecheck and test:integration (miniflare 5 has no `createFetchMock` and takes `workers` instead of `modules`) — #1742
  "miniflare": "4.20260722.0"
  "pg": "^8.23.0"
  # hold-back: prisma@8.0.0-rc.13 -> 8.0.0-rc.15 fails `pnpm install` (kept level with @prisma/orm-postgres rc.9: the same ERR_PNPM_UNUSED_PATCH) — #1741
  "prisma": "8.0.0-rc.13"
  "smol-toml": "1.8.0"
  "testcontainers": "^12.1.0"
  "tsx": "^4.23.13"
  "typebox": 1.3.32
  "typescript": "^7.0.2"
  "vite": "^8.3.0"
  # hold-back: vitest@^4.1.11 -> 5.0.1 fails workers/users test:worker (@cloudflare/vitest-pool-workers supports only vitest ^4.1.0, so the pool loads 0 tests) — #1742
  "vitest": "^4.1.11"
  "wrangler": "4.132.0"
  "yaml": "^2.9.1"
  "zod": "4.6.5"

overrides:
  postcss: ">=8.5.23"
  ws: ">=8.21.0"
  qs: ">=6.15.2"
  fast-uri: ">=4.1.1"
  hono: ">=4.13.7"
  esbuild: "0.28.2"
  "@vitest/expect": "4.1.11"
  "@vitest/spy": "4.1.11"
  uuid: ">=11.1.1"
  sharp: ">=0.35.3"
  valibot: ">=1.4.2"
  brace-expansion: ">=5.0.9"
  "@hono/node-server": ">=2.0.5"
  minimatch: ">=10.2.6"
  nanoid: "3.3.18"
  "testcontainers>undici": "8.9.0"
  "miniflare>undici": "7.29.0"
  "jsdom>undici": "7.29.0"
  "@ai-sdk/provider-utils>undici": "7.29.0"
  tmp: ">=0.2.6"
  browserslist: ">=4.28.7"
  # `@prisma/orm-postgres` and `@opentelemetry/instrumentation-pg` pin
  # `@types/pg` to exact versions. Without this the tree carries three copies,
  # and `Pool` becomes three unrelated types: `packages/prisma-geography` fails
  # TS2769 importing the repo's own `pg` and prisma's. Types only, so one copy.
  "@types/pg": "8.23.1"
  lodash: ">=4.18.1 <5"
  # `vite` is an optional peer of the `@prisma/orm-*` family, and pnpm keys each
  # copy of a package by its resolved peers. `workers/edge` never declares vite,
  # so its graph kept an older auto-installed one and got its own
  # `@prisma/orm-postgres`; `param()` from `@animichi/pi-session-neon`'s copy is
  # then a foreign value to the edge runtime's `sql` (RAW_SQL_UNSUPPORTED_
  # INTERPOLATION). The hoisted linker hid it by linking one directory for both.
  vite: "catalog:"

# `allowBuilds` replaces pnpm 10's `onlyBuiltDependencies` family. Under
# `strictDepBuilds: true` every dependency that declares an install script must
# appear here or the install fails, so this map is the complete set pnpm named in
# `ERR_PNPM_IGNORED_BUILDS`, not a sample. All twelve are `false`: none of them
# has ever run here. pnpm 10 blocked dependency build scripts by default and CI
# installs with `--ignore-scripts`, and `esbuild/bin/esbuild` and
# `workerd/bin/workerd` under `node_modules/.pnpm/` are still the JS shims — proof
# the scripts have never executed. Read each entry as "the shell is not needed":
#   workerd, esbuild      — optional-platform packages supply the binary; the
#                           install script only validates/hardlinks it.
#   @parcel/watcher       — `scripts/build-from-source.js` is a no-op unless
#                           `npm_config_build_from_source=true`.
#   core-js, core-js-pure,
#   msw, protobufjs,
#   @google/genai         — postinstall prints a notice or patches a sibling
#                           package's metadata; no artifact depends on it.
#   cpu-features, ssh2,
#   msgpackr-extract      — native accelerators reached through optional edges;
#                           their prebuilt platform packages are installed.
allowBuilds:
  "@google/genai": false
  "@parcel/watcher": false
  core-js: false
  core-js-pure: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  msw: false
  protobufjs: false
  ssh2: false
  workerd: false
patchedDependencies:
  "@prisma/orm-target-postgres@8.0.0-rc.9": packages/pi-session-neon/patches/@prisma__orm-target-postgres@8.0.0-rc.9.patch

# Manifest pins: a `package.json` cannot carry a comment, so the register lines for the pins
# declared there live in this block, in the same shape as the lines beside the catalog
# entries above. Each line's gate is the gate that fails when the bump is attempted.
# hold-back: @prisma/orm-toolchain@8.0.0-rc.9 -> 8.0.0-rc.11 fails `pnpm install` (the rc.9 @prisma/orm-target-postgres patch matches no package, and the stored migration snapshots are rc.9-shaped) — #1741
# hold-back: h3@^1.15.11 -> 2.0.1-rc.32 fails apps/web test:integration (h3 2 splits nitro 2.13.4's build: the nitro virtual modules resolve the app's h3 2 while nitropack's runtime keeps 1.15, and the built Worker answers 500 to every SSR request) — #1744
