packages:
  - "workers/*"
  - "apps/*"
  - "packages/*"
  - "e2e"
  - "infra"

# pnpm 11 moved every non-auth setting here out of `.npmrc` and removed the
# `package.json#pnpm` field; 12 rejects a key it does not recognise. Keys are
# camelCase — a kebab-case key is silently ignored with a warning. This file is
# the only settings surface: `nodeLinker`/`shamefullyHoist` were `.npmrc`'s only
# two lines, so `.npmrc` is deleted. Both keep their pre-migration values; the
# flat root `node_modules` that wrangler, vitest-pool-workers and esbuild resolve
# through is unchanged, and swapping the linker is a separate, testable decision.
nodeLinker: hoisted
shamefullyHoist: true

# v11/v12 defaults kept deliberately, each with its reason:
#   strictDepBuilds: true   — kept. The `allowBuilds` map below is the explicit
#                             decision it demands; every entry is `false`.
#   minimumReleaseAge: 1440 — kept (1 day). No resolved version needed an
#                             exception; a too-fresh version must be justified in
#                             the PR that wants it, not waved through by config.
#   blockExoticSubdeps: true— kept. The one `file:` dependency in the tree
#                             (`infra/database-access`'s `@pulumi/neon`) is a
#                             direct dependency of its own workspace root, which
#                             the setting does not cover.
#   verifyDepsBeforeRun     — kept at its new `install` default. Every gate here
#                             is `pnpm run …`, and this makes a stale tree
#                             re-install itself instead of silently testing the
#                             wrong `node_modules`.
#   optimisticRepeatInstall — kept at its new `true` default, which is what makes
#                             `verifyDepsBeforeRun: install` cheap.
strictDepBuilds: true
minimumReleaseAge: 1440
blockExoticSubdeps: true

catalogMode: strict

# Every external dependency declared by two or more workspace importers (the root
# included) is defined once here; each manifest references it with `catalog:`.
# `catalogMode: strict` rejects a `pnpm add`/`pnpm update` that asks for a version
# outside the entry, so the drift this consolidates cannot come back through the CLI.
catalog:
  "@cloudflare/vitest-pool-workers": "^0.18.8"
  "@cloudflare/workers-types": "5.20260727.1"
  "@earendil-works/chord": "0.85.1"
  "@earendil-works/pi-agent-core": "0.85.1"
  "@earendil-works/pi-ai": "0.85.1"
  "@modelcontextprotocol/sdk": "1.30.0"
  "@neondatabase/serverless": "^1.1.0"
  "@orpc/client": "1.15.0"
  "@orpc/contract": "1.15.0"
  "@orpc/openapi": "1.15.0"
  "@orpc/openapi-client": "1.15.0"
  "@orpc/server": "1.15.0"
  "@prisma/cli-engine": "0.3.0"
  "@prisma/orm-postgres": "8.0.0-rc.9"
  # TanStack ships the router/start family from one monorepo and pins the
  # packages to each other EXACTLY (router-generator@1.167.36 pins
  # router-core 1.171.30; everything from the same release event pins
  # 1.171.32), so a caret here lets one lockfile carry two router-cores from
  # different release events — an unsupported mix that broke the web build
  # (`makeSerovalPlugin` missing from router-core's ssr/client.js). Every
  # entry is therefore exact, at the newest release event in which the whole
  # family published together (2026-09-16T21:53–21:57Z):
  #   react-start 1.168.56 · react-router 1.170.38 · router-generator 1.167.38
  #   router-core/start-plugin-core/start-server-core/start-client-core et al.
  #   resolve transitively to that same event.
  "@tanstack/nitro-v2-vite-plugin": "1.155.2"
  "@tanstack/react-query": "5.103.1"
  "@tanstack/react-router": "1.170.38"
  "@tanstack/react-router-with-query": "1.130.17"
  "@tanstack/react-start": "1.168.56"
  "@tanstack/router-generator": "1.167.38"
  "@types/node": "^26.5.1"
  "@types/pg": "^8.23.1"
  "@vitest/coverage-istanbul": "4.1.11"
  "ai": "^7.0.100"
  "drizzle-orm": "^0.45.2"
  "esbuild": "0.28.2"
  "hono": "^4.13.7"
  "jose": "^6.2.12"
  "miniflare": "4.20260722.0"
  "pg": "^8.23.0"
  "prisma": "8.0.0-rc.13"
  "smol-toml": "1.8.0"
  "testcontainers": "^12.1.0"
  "tsx": "^4.23.13"
  "typebox": 1.3.31
  "typescript": "^7.0.2"
  "vitest": "^4.1.11"
  "wrangler": "4.132.0"
  "yaml": "^2.9.1"
  "zod": "4.4.3"

overrides:
  postcss: ">=8.5.23"
  ws: ">=8.21.0"
  qs: ">=6.15.2"
  fast-uri: ">=4.1.1"
  hono: ">=4.13.7"
  esbuild: "0.28.2"
  "@vitest/expect": "4.1.11"
  "@vitest/spy": "4.1.11"
  uuid: ">=11.1.1"
  sharp: ">=0.35.3"
  valibot: ">=1.4.2"
  brace-expansion: ">=5.0.9"
  "@hono/node-server": ">=2.0.5"
  minimatch: ">=10.2.6"
  nanoid: "3.3.18"
  "testcontainers>undici": "8.9.0"
  "miniflare>undici": "7.29.0"
  "jsdom>undici": "7.29.0"
  "@ai-sdk/provider-utils>undici": "7.29.0"
  tmp: ">=0.2.6"
  browserslist: ">=4.28.7"
  # `@prisma/orm-postgres` and `@opentelemetry/instrumentation-pg` pin
  # `@types/pg` to exact versions. Without this the tree carries three copies,
  # and `Pool` becomes three unrelated types: `packages/prisma-geography` fails
  # TS2769 importing the repo's own `pg` and prisma's. Types only, so one copy.
  "@types/pg": "8.23.1"
  # `@cloudflare/workers-types` 5.20260915.1 added a `nodejs_compat` global block
  # to `index.d.ts` (`declare const process: any`, `Buffer: any`, `setImmediate`,
  # ...) that 5.20260727.1 does not have. Where a tsconfig lists both this package
  # and `node` in `types` — `workers/edge` does — the `any` wins, every
  # `process.*` in its 12 Node-side test files becomes unsafe-any, and
  # `oxlint --type-aware --deny-warnings` reports 39 errors. Importing
  # `node:process` does NOT fix it: `@types/node` declares that module as
  # `export = process`, so it re-exports the widened global (proven with a
  # throwaway `tsc` probe). Held at the last release without the block; the exit
  # is upstream dropping the global or `workers/edge` splitting its Node tests
  # off the Worker global surface.
  "@cloudflare/workers-types": "5.20260727.1"
  lodash: ">=4.18.1 <5"

# `allowBuilds` replaces pnpm 10's `onlyBuiltDependencies` family. Under
# `strictDepBuilds: true` every dependency that declares an install script must
# appear here or the install fails, so this map is the complete set pnpm named in
# `ERR_PNPM_IGNORED_BUILDS`, not a sample. All twelve are `false`: none of them
# has ever run here. pnpm 10 blocked dependency build scripts by default and CI
# installs with `--ignore-scripts`, and `node_modules/esbuild/bin/esbuild` and
# `node_modules/workerd/bin/workerd` are still the JS shims — proof the scripts
# have never executed. Read each entry as "the shell is not needed":
#   workerd, esbuild      — optional-platform packages supply the binary; the
#                           install script only validates/hardlinks it.
#   @parcel/watcher       — `scripts/build-from-source.js` is a no-op unless
#                           `npm_config_build_from_source=true`.
#   core-js, core-js-pure,
#   msw, protobufjs,
#   @google/genai         — postinstall prints a notice or patches a sibling
#                           package's metadata; no artifact depends on it.
#   cpu-features, ssh2,
#   msgpackr-extract      — native accelerators reached through optional edges;
#                           their prebuilt platform packages are installed.
allowBuilds:
  "@google/genai": false
  "@parcel/watcher": false
  core-js: false
  core-js-pure: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  msw: false
  protobufjs: false
  ssh2: false
  workerd: false
patchedDependencies:
  "@prisma/orm-target-postgres@8.0.0-rc.9": packages/pi-session-neon/patches/@prisma__orm-target-postgres@8.0.0-rc.9.patch
