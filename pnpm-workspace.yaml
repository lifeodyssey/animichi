  glob: ">=14.0.2"
  tmp: ">=0.2.6"
  ip-address: ">=10.7.4"
  browserslist: ">=4.28.7"
  "@grpc/grpc-js": ">=1.14.5"
  postcss-selector-parser: ">=7.1.6"
  "@cloudflare/vitest-pool-workers>zod": "^4.6.6"
